  const firebaseConfig = {
    apiKey: "AIzaSyDW9bsgzflkCqEMjabVfkfH09F4q7WejDc",

    projectId: "myapp-a7d5c",

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const GOLD='#B8955A',NAVY='#1B2A4A',BORDER='#E0D8CC',LIGHT='#F9F6F1',RED='#B84040',GREEN='#3A7A5A';

const GENRE_COLORS=[
  '#B8955A','#5B3FA6','#3A7A5A','#1B2A4A','#B84040','#C07030','#3A6080','#7A3A6A','#4A7A3A','#8A7030',
  '#E05080','#20B080','#8060C0','#C06020','#407080','#906040','#50A050','#C04060','#6080C0','#A04080',

const DEFAULT_CLUBS=['ドライバー','3W','5W','5U','4I','5I','6I','7I','8I','9I','PW','AW','SW','LW','パター'];
const MUSCLE_PARTS=['胸','背中','肩','腕','腹','脚','全身'];
const DEFAULT={
  pin:null,schedule:[],todos:[],goals:[],
  finance:{investment:0,records:[],investTotal:0,defenseTotal:0},
  resist:{items:[],log:{}},diary:[],weight:[],birthdays:[],
  workout:{sessions:[]},books:[],quotes:[],tabGoals:{},
  golf:{courses:[],rounds:[],practice:[],notes:[],clubs:['ドライバー','3W','5W','5U','4I','5I','6I','7I','8I','9I','PW','AW','SW','LW','パター']},
  genres:[
    {name:'国家試験勉強',color:'#5B3FA6'},{name:'ウエイト',color:'#3A7A5A'},
    {name:'英語学習',color:'#1B2A4A'},{name:'ストレッチ',color:'#C07030'},
    {name:'副業学習',color:'#B84040'},{name:'ゴルフ',color:'#3A6080'},{name:'読書',color:'#7A3A6A'},
  ],
  genreGoals:{},
  golf:{courses:[],rounds:[],practice:[],notes:[]},
};

function today(){return new Date().toISOString().split('T')[0];}
function todayLabel(){return new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'});}
function pad(n){return String(n).padStart(2,'0');}
function fmtYen(n){return '¥'+Math.round(n).toLocaleString();}
function getGenreColor(genres,name){const g=(genres||[]).find(x=>x.name===name);return g?g.color:GOLD;}

const st={
  inp:{width:'100%',background:'#fff',border:`1px solid ${BORDER}`,borderRadius:4,padding:'8px 11px',color:'#111',fontSize:13,outline:'none',boxSizing:'border-box'},
  btn:(bg,fg)=>({background:bg||GOLD,border:'none',borderRadius:4,padding:'9px 18px',color:fg||'#fff',cursor:'pointer',fontSize:13}),
  card:{background:'#fff',border:`1px solid ${BORDER}`,borderRadius:6,padding:'14px 16px',marginBottom:10},
  label:{fontSize:10,letterSpacing:'0.15em',color:'#888',textTransform:'uppercase',marginBottom:8},

  grid2:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8},
  grid3:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8},
};

const TABS=[
  {id:'home',label:'ホーム'},{id:'schedule',label:'スケジュール'},{id:'todo',label:'ToDo'},
  {id:'goals',label:'目標'},{id:'money',label:'お金'},{id:'weight',label:'体重'},
  {id:'golf',label:'ゴルフ'},{id:'diary',label:'日記'},
];

const MOODS=['😞','😕','😐','🙂','😊'];
const PCOLOR={urgent:'#B84040',high:'#C07030',medium:'#8A7030',low:'#3A6080'};
const PLABEL={urgent:'緊急',high:'高',medium:'中',low:'低'};
const CLUBS=['ドライバー','3W','5W','5U','4I','5I','6I','7I','8I','9I','PW','AW','SW','LW','パター'];

function ConfirmDialog({message,onOk,onCancel}){
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:300}}>
      <div style={{background:'#fff',borderRadius:10,padding:24,width:'80%',maxWidth:320}}>
        <div style={{fontSize:14,color:'#111',marginBottom:20,textAlign:'center',lineHeight:1.6}}>{message}</div>
        <div style={{display:'flex',gap:10}}>
          <button onClick={onCancel} style={{flex:1,padding:10,background:'#fff',border:`1px solid ${BORDER}`,borderRadius:4,color:'#555',cursor:'pointer',fontSize:13}}>キャンセル</button>
          <button onClick={onOk} style={{flex:1,padding:10,background:RED,border:'none',borderRadius:4,color:'#fff',cursor:'pointer',fontSize:13}}>削除する</button>
        </div>
      </div>
    </div>
  );
}

function useConfirm(){
  const [state,setState]=useState(null);
  function confirm(message){return new Promise(resolve=>{setState({message,resolve});});}
  function Dialog(){if(!state)return null;return <ConfirmDialog message={state.message} onOk={()=>{state.resolve(true);setState(null);}} onCancel={()=>{state.resolve(false);setState(null);}}/>;}
  return{confirm,Dialog};
}

function CheckCircle({done,onClick,size=18}){
  return <div onClick={onClick} style={{width:size,height:size,borderRadius:'50%',border:`1.5px solid ${done?GOLD:BORDER}`,background:done?GOLD:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,fontSize:size*0.6,color:'#fff'}}>{done?'✓':''}</div>;
}
function ProgressBar({value,color}){
  return <div style={{height:6,background:'#eee',borderRadius:3,overflow:'hidden',margin:'6px 0'}}><div style={{width:value+'%',height:'100%',background:color,borderRadius:3,transition:'width 0.3s'}}/></div>;
}

function App(){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('home');
  const [unlocked,setUnlocked]=useState(false);
  const [pinInput,setPinInput]=useState('');
  const [pinError,setPinError]=useState(0);
  const [lockUntil,setLockUntil]=useState(0);
  const [setupPin,setSetupPin]=useState('');
  const [saving,setSaving]=useState(false);

  useEffect(()=>{
    async function init(){
      if(!window._firebaseReady) await new Promise(r=>window.addEventListener('firebaseReady',r,{once:true}));
      const d=await window._fbLoad();
      if(d&&Object.keys(d).length>0){
        if(d.genres&&d.genres.length>0&&typeof d.genres[0]==='string') d.genres=d.genres.map((name,i)=>({name,color:GENRE_COLORS[i%GENRE_COLORS.length]}));
        if(!d.golf) d.golf={courses:[],rounds:[],practice:[],notes:[]};
        setData({...DEFAULT,...d});
      } else {
        try{const b=localStorage.getItem('ameno_os_backup');if(b)setData({...DEFAULT,...JSON.parse(b)});else setData(JSON.parse(JSON.stringify(DEFAULT)));}
        catch{setData(JSON.parse(JSON.stringify(DEFAULT)));}
      }
      setLoading(false);
    }
    init();
  },[]);

  const saveToFirebase=useCallback(async(nd)=>{
    setSaving(true);
    await window._fbSave(nd);
    try{localStorage.setItem('ameno_os_backup',JSON.stringify(nd));}catch{}
    setSaving(false);
  },[]);

  function upd(fn){setData(d=>{const n=JSON.parse(JSON.stringify(d));fn(n);saveToFirebase(n);return n;});}

  if(loading) return(
    <div style={{background:NAVY,minHeight:'100vh',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
      <div style={{fontSize:10,letterSpacing:'0.25em',color:GOLD,marginBottom:24}}>飴野家 PERSONAL OS</div>
      <div style={{width:32,height:32,borderRadius:'50%',border:'3px solid rgba(255,255,255,0.2)',borderTopColor:GOLD,animation:'spin 0.8s linear infinite'}}/>
      <div style={{fontSize:12,color:'rgba(255,255,255,0.4)',marginTop:16}}>データを読み込み中...</div>
    </div>
  );

  if(!data.pin) return(
    <div style={{background:NAVY,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div style={{textAlign:'center',padding:32}}>
        <div style={{fontSize:10,letterSpacing:'0.25em',color:GOLD,marginBottom:6}}>飴野家 PERSONAL OS</div>
        <div style={{fontSize:14,color:'#F5EDD8',marginBottom:28}}>PINコード（4桁）を設定</div>
        <PinDots count={setupPin.length}/>
        <PinPad value={setupPin} onChange={setSetupPin} maxLen={4}/>
        {setupPin.length===4&&<button onClick={()=>{upd(d=>{d.pin=setupPin;});setUnlocked(true);}} style={{...st.btn(),marginTop:16}}>設定する</button>}
      </div>
    </div>
  );

  if(!unlocked){
    const locked=lockUntil>Date.now();
    return(
      <div style={{background:NAVY,minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{textAlign:'center',padding:32}}>
          <div style={{fontSize:10,letterSpacing:'0.25em',color:GOLD,marginBottom:6}}>飴野家 PERSONAL OS</div>
          <div style={{fontSize:13,color:'rgba(255,255,255,0.5)',marginBottom:28}}>{todayLabel()}</div>
          {locked?<LockTimer lockUntil={lockUntil}/>:(
            <>
              <PinDots count={pinInput.length}/>
              {pinError>0&&<div style={{color:'#E07070',fontSize:12,marginBottom:12}}>PINが違います（{pinError}/3）</div>}
              <PinPad value={pinInput} onChange={v=>{
                setPinInput(v);
                if(v.length===4){
                  if(v===data.pin){setUnlocked(true);setPinInput('');setPinError(0);}
                  else{const e=pinError+1;setPinError(e);setPinInput('');if(e>=3){setLockUntil(Date.now()+30000);setPinError(0);}}
                }
              }} maxLen={4}/>
            </>
          )}
        </div>
      </div>
    );
  }

  return(
    <div style={{maxWidth:480,margin:'0 auto',background:'#fff',minHeight:'100vh'}}>
      <div style={{background:NAVY,padding:'14px 16px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
          <div>
            <div style={{fontSize:9,letterSpacing:'0.2em',color:GOLD,marginBottom:3}}>飴野家 PERSONAL OS</div>
            <div style={{fontSize:15,color:'#F5EDD8'}}>{todayLabel()}</div>
          </div>
          {saving&&<div style={{fontSize:9,color:GOLD,opacity:0.7}}>保存中...</div>}
        </div>
      </div>
      <div className="tabs-row" style={{background:NAVY,borderBottom:'2px solid rgba(184,149,90,0.3)',position:'sticky',top:0,zIndex:100}}>
        {TABS.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:'0 0 auto',padding:'10px 13px',background:'none',border:'none',borderBottom:tab===t.id?`2px solid ${GOLD}`:'2px solid transparent',color:tab===t.id?GOLD:'rgba(245,237,216,0.5)',fontSize:11,cursor:'pointer',whiteSpace:'nowrap'}}>
            {t.label}
          </button>
        ))}
      </div>
      <div style={{padding:'16px 16px 80px',background:'#fff'}}>
        {tab==='home'&&<HomeTab data={data} upd={upd}/>}
        {tab==='schedule'&&<ScheduleTab data={data} upd={upd}/>}
        {tab==='todo'&&<TodoTab data={data} upd={upd}/>}
        {tab==='goals'&&<GoalsTab data={data} upd={upd}/>}
        {tab==='money'&&<MoneyTab data={data} upd={upd}/>}
        {tab==='weight'&&<WeightTab data={data} upd={upd}/>}
        {tab==='workout'&&<WorkoutTab data={data} upd={upd}/>}
        {tab==='golf'&&<GolfTab data={data} upd={upd}/>}
        {tab==='books'&&<BooksTab data={data} upd={upd}/>}
        {tab==='quotes'&&<QuotesTab data={data} upd={upd}/>}
        {tab==='diary'&&<DiaryTab data={data} upd={upd}/>}
      </div>
    </div>
  );
}

function PinDots({count}){return <div style={{display:'flex',gap:12,justifyContent:'center',marginBottom:24}}>{[0,1,2,3].map(i=><div key={i} style={{width:14,height:14,borderRadius:'50%',background:count>i?GOLD:'rgba(255,255,255,0.2)'}}/>)}</div>;}
function PinPad({value,onChange,maxLen}){
  return <div style={{display:'grid',gridTemplateColumns:'repeat(3, 64px)',gap:10,justifyContent:'center'}}>
    {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((n,i)=>(
      <button key={i} onClick={()=>{if(n==='⌫'){onChange(value.slice(0,-1));return;}if(n==='')return;if(value.length<maxLen)onChange(value+n);}} style={{height:54,background:n===''?'none':'rgba(255,255,255,0.1)',border:`1px solid ${n===''?'transparent':'rgba(255,255,255,0.2)'}`,borderRadius:4,color:'#F5EDD8',fontSize:18,cursor:n===''?'default':'pointer'}}>{n}</button>
    ))}
  </div>;
}
function LockTimer({lockUntil}){
  const [rem,setRem]=useState(Math.ceil((lockUntil-Date.now())/1000));
  useEffect(()=>{const t=setInterval(()=>{const r=Math.ceil((lockUntil-Date.now())/1000);setRem(r);if(r<=0)clearInterval(t);},1000);return()=>clearInterval(t);},[lockUntil]);
  return <div style={{color:'#E07070',fontSize:13}}>{rem}秒後に再試行できます</div>;
}

// ── TIME OVERLAP CHECK ──
function timeToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function hasOverlap(schedule,date,start,end,excludeId=null){
  const sMin=timeToMin(start),eMin=timeToMin(end);
  return (schedule||[]).filter(s=>s.date===date&&s.id!==excludeId).some(s=>{
    const ss=timeToMin(s.start),se=s.end?timeToMin(s.end):ss+10;
    return sMin<se&&eMin>ss;
  });
}

// ── RESERVE MODAL ──
function ReserveModal({date,h,m,genres,existing,onSave,onClose,upd,schedule}){
  const initGenre=existing?existing.genre:(genres[0]?.name||'');
  const [title,setTitle]=useState(existing?.title||'');
  const [genre,setGenre]=useState(initGenre);
  const defEndH=(m+10)>=60?h+1:h;
  const defEndM=(m+10)>=60?(m+10)-60:m+10;
  const [end,setEnd]=useState(existing?.end||`${pad(defEndH)}:${pad(defEndM)}`);
  const [newGenre,setNewGenre]=useState('');
  const [newGenreColor,setNewGenreColor]=useState(GENRE_COLORS[0]);
  const [showAdd,setShowAdd]=useState(false);
  const [overlapErr,setOverlapErr]=useState(false);

  function addGenre(){if(!newGenre.trim())return;upd(d=>{if(!d.genres.find(g=>g.name===newGenre.trim()))d.genres=[...d.genres,{name:newGenre.trim(),color:newGenreColor}];});setGenre(newGenre.trim());setNewGenre('');setShowAdd(false);}
  const genreColor=getGenreColor(genres,genre);
  const startKey=`${pad(h)}:${pad(m)}`;

  function handleSave(){
    if(hasOverlap(schedule,date,startKey,end,existing?.id)){setOverlapErr(true);return;}
    onSave({title:title||genre,genre,start:startKey,end,color:genreColor});
  }

  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:'flex-end',justifyContent:'center',zIndex:200}} onClick={onClose}>
      <div style={{background:'#fff',borderRadius:'12px 12px 0 0',padding:24,width:'100%',maxWidth:480,paddingBottom:40,maxHeight:'85vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:15,fontWeight:700,marginBottom:14,color:'#111'}}>{pad(h)}:{pad(m)} {existing?'(編集)':'に予約'}</div>
        <div style={{fontSize:10,color:'#888',marginBottom:6}}>ジャンル</div>
        <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
          {genres.map(g=><button key={g.name} onClick={()=>setGenre(g.name)} style={{padding:'5px 12px',background:genre===g.name?g.color:LIGHT,border:`1px solid ${genre===g.name?g.color:BORDER}`,borderRadius:20,color:genre===g.name?'#fff':'#333',fontSize:12,cursor:'pointer'}}>{g.name}</button>)}
          <button onClick={()=>setShowAdd(!showAdd)} style={{padding:'5px 12px',background:'none',border:`1px dashed ${BORDER}`,borderRadius:20,color:'#888',fontSize:12,cursor:'pointer'}}>＋ 追加</button>
        </div>
        {showAdd&&(
          <div style={{marginBottom:10}}>
            <div style={{display:'flex',gap:6,marginBottom:8}}><input value={newGenre} onChange={e=>setNewGenre(e.target.value)} placeholder="新しいジャンル" style={{...st.inp,flex:1}}/><button onClick={addGenre} style={st.btn()}>追加</button></div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{GENRE_COLORS.map(c=><div key={c} onClick={()=>setNewGenreColor(c)} style={{width:22,height:22,borderRadius:'50%',background:c,border:`2px solid ${newGenreColor===c?'#111':BORDER}`,cursor:'pointer'}}/>)}</div>
          </div>
        )}
        <div style={{fontSize:10,color:'#888',marginBottom:4}}>タイトル（任意）</div>
        <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="例：読書、筋トレなど" style={{...st.inp,marginBottom:10}}/>
        <div style={{fontSize:10,color:'#888',marginBottom:4}}>終了時間</div>
        <input type="time" value={end} onChange={e=>{setEnd(e.target.value);setOverlapErr(false);}} style={{...st.inp,marginBottom:overlapErr?6:16}}/>
        {overlapErr&&<div style={{color:RED,fontSize:12,marginBottom:12}}>⚠️ この時間帯はすでに予約が入っています</div>}
        <button onClick={handleSave} style={{...st.btn(),width:'100%'}}>{existing?'更新する':'予約する'}</button>
      </div>
    </div>
  );
}

// ── HOME ──
function HomeTab({data,upd}){
  const [selDate,setSelDate]=useState(today());
  const [modal,setModal]=useState(null);
  const [editModal,setEditModal]=useState(null);
  const {confirm,Dialog}=useConfirm();

  const slots=[];
  for(let h=0;h<24;h++)for(let m=0;m<60;m+=10)slots.push({h,m});
  const res=(data.schedule||[]).filter(s=>s.date===selDate).sort((a,b)=>a.start.localeCompare(b.start));
  const todos=(data.todos||[]).filter(t=>!t.done).sort((a,b)=>({urgent:0,high:1,medium:2,low:3}[a.priority]||2)-({urgent:0,high:1,medium:2,low:3}[b.priority]||2));

  function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
  const dow=['日','月','火','水','木','金','土'][new Date(selDate+'T00:00:00').getDay()];

  // Find which slots are covered by each reservation
  function getSlotItem(key){
    return res.find(s=>{
      const ss=timeToMin(s.start);
      const se=s.end?timeToMin(s.end):ss+10;
      const sk=timeToMin(key);
      return sk>=ss&&sk<se;
    });
  }

  return(
    <div>
      <Dialog/>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:10}}>
        <button onClick={()=>setSelDate(d=>addDays(d,-1))} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>◀</button>
        <input type="date" value={selDate} onChange={e=>setSelDate(e.target.value)} style={{...st.inp,flex:1,textAlign:'center'}}/>
        <button onClick={()=>setSelDate(d=>addDays(d,1))} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>▶</button>
      </div>
      <div style={{fontSize:12,color:'#555',marginBottom:10,textAlign:'center'}}>
        {selDate}（{dow}）
        {selDate!==today()&&<button onClick={()=>setSelDate(today())} style={{marginLeft:8,fontSize:11,background:'none',border:`1px solid ${BORDER}`,borderRadius:3,padding:'2px 8px',cursor:'pointer',color:'#888'}}>今日</button>}
      </div>
      <div style={{...st.between,marginBottom:6}}>
        <div style={st.label}>スケジュール</div>
        <button onClick={()=>setModal({h:9,m:0})} style={{...st.btn(),fontSize:11,padding:'5px 12px'}}>+ 追加</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:2,marginBottom:12}}>
        {slots.map(({h,m})=>{
          const key=`${pad(h)}:${pad(m)}`;
          const item=getSlotItem(key);
          const isStart=item&&item.start===key;
          return(
            <div key={key} onClick={()=>item?setEditModal(item):setModal({h,m})}
              style={{padding:'3px 1px',borderRadius:3,display:'flex',flexDirection:'column',alignItems:'center',minHeight:32,cursor:'pointer',background:item?(item.color||GOLD)+'22':LIGHT,border:`1px solid ${item?(item.color||GOLD):BORDER}`}}>
              <span style={{fontSize:7,color:item?item.color:'#888'}}>{key}</span>
              {isStart&&<span style={{fontSize:7,fontWeight:700,color:item.color||GOLD,marginTop:1,textAlign:'center',lineHeight:1.1,wordBreak:'break-all'}}>{item.genre||item.title}</span>}
              {item&&item.end&&timeToMin(key)===timeToMin(item.end)-10&&<span style={{fontSize:6,color:item.color||GOLD,marginTop:'auto'}}>↓{item.end}</span>}
            </div>
          );
        })}
      </div>
      {res.map(s=>(
        <div key={s.id} style={{...st.card,borderLeft:`4px solid ${s.color||GOLD}`,padding:'10px 14px',marginBottom:6,display:'flex',alignItems:'center',gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'#888'}}>{s.start}{s.end?' — '+s.end:''}</div>
            <div style={{fontSize:13,color:'#111'}}>{s.title}</div>
            {s.genre&&<span style={{fontSize:10,background:(s.color||GOLD)+'22',color:s.color||GOLD,borderRadius:3,padding:'1px 6px'}}>{s.genre}</span>}
          </div>
          <button onClick={()=>setEditModal(s)} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
          <button onClick={async()=>{const ok=await confirm('この予定を削除しますか？');if(ok)upd(d=>{d.schedule=d.schedule.filter(x=>x.id!==s.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
        </div>
      ))}
      <div style={{...st.label,marginTop:14}}>今日のToDo</div>
      {todos.length===0&&<div style={{fontSize:12,color:'#aaa'}}>タスクなし</div>}
      {todos.slice(0,6).map(t=>{
        const pc=PCOLOR[t.priority]||PCOLOR.medium;
        return(
          <div key={t.id} style={{...st.card,borderLeft:`3px solid ${pc}`,padding:'10px 14px',marginBottom:7,display:'flex',alignItems:'center',gap:10}}>
            <CheckCircle done={t.done} onClick={()=>upd(d=>{d.todos=d.todos.map(x=>x.id===t.id?{...x,done:!x.done}:x);})}/>
            <div style={{flex:1,fontSize:13,color:'#111'}}>{t.text}</div>
            <span style={{fontSize:10,color:pc,border:`1px solid ${pc}40`,borderRadius:2,padding:'1px 5px'}}>{PLABEL[t.priority]}</span>
          </div>
        );
      })}
      {modal&&<ReserveModal date={selDate} h={modal.h} m={modal.m} genres={data.genres||[]} schedule={data.schedule} onSave={form=>{upd(d=>{d.schedule=[...d.schedule,{id:Date.now(),date:selDate,...form}];});setModal(null);}} onClose={()=>setModal(null)} upd={upd}/>}
      {editModal&&<ReserveModal date={selDate} h={parseInt(editModal.start.split(':')[0])} m={parseInt(editModal.start.split(':')[1])} genres={data.genres||[]} existing={editModal} schedule={data.schedule} onSave={form=>{upd(d=>{d.schedule=d.schedule.map(x=>x.id===editModal.id?{...x,...form}:x);});setEditModal(null);}} onClose={()=>setEditModal(null)} upd={upd}/>}
    </div>
  );
}

// ── SCHEDULE ──
function ScheduleTab({data,upd}){
  const [viewYM,setViewYM]=useState(today().slice(0,7));
  const [selDate,setSelDate]=useState(null);
  const [weekOffset,setWeekOffset]=useState(0);
  const [editGoal,setEditGoal]=useState(false);
  const [goalInputs,setGoalInputs]=useState({});
  const [showGenreEdit,setShowGenreEdit]=useState(false);
  const {confirm:confirmDel,Dialog:DelDialog}=useConfirm();

  const [year,month]=viewYM.split('-').map(Number);
  const startDow=new Date(year,month-1,1).getDay();
  const daysInMonth=new Date(year,month,0).getDate();
  const weeks=[];let week=Array(startDow).fill(null);
  for(let d=1;d<=daysInMonth;d++){week.push(d);if(week.length===7){weeks.push(week);week=[];}}
  if(week.length>0){while(week.length<7)week.push(null);weeks.push(week);}

  function getWeekDates(offset){
    const now=new Date();const dow=now.getDay();const diff=dow===0?-6:1-dow;
    const monday=new Date(now);monday.setDate(now.getDate()+diff+offset*7);
    return Array.from({length:7},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;});
  }
  const weekDates=getWeekDates(weekOffset);
  const weekSchedule=(data.schedule||[]).filter(s=>weekDates.includes(s.date));
  const genres=data.genres||[];
  const genreGoals=data.genreGoals||{};
  const genreTotals={};genres.forEach(g=>{genreTotals[g.name]=0;});
  weekSchedule.forEach(s=>{if(s.genre&&s.start&&s.end){const mins=timeToMin(s.end)-timeToMin(s.start);genreTotals[s.genre]=(genreTotals[s.genre]||0)+Math.max(0,mins);}});
  const activeGenres=genres.filter(g=>genreTotals[g.name]>0||genreGoals[g.name]);
  const totalMins=Object.values(genreTotals).reduce((s,v)=>s+v,0);
  let pieAngle=0;
  const pieSlices=genres.filter(g=>genreTotals[g.name]>0).map(g=>{const pct=genreTotals[g.name]/totalMins;const start=pieAngle;pieAngle+=pct*360;return{name:g.name,color:g.color,pct,start,end:pieAngle};});
  function polarToXY(cx,cy,r,deg){const rad=(deg-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}
  function pieArc(cx,cy,r,start,end){const s=polarToXY(cx,cy,r,start);const e=polarToXY(cx,cy,r,end);const large=end-start>180?1:0;return `M ${cx} ${cy} L ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} Z`;}
  const W=300,H=120,maxVal=Math.max(...activeGenres.map(g=>Math.max((genreTotals[g.name]||0)/60,genreGoals[g.name]||0)),1);

  const selDateStr=selDate?`${year}-${pad(month)}-${pad(selDate)}`:null;
  const selItems=selDateStr?(data.schedule||[]).filter(s=>s.date===selDateStr):[];
  const selBdays=selDateStr?(data.birthdays||[]).filter(b=>{const bp=b.date.split('-');return bp.length===2&&bp[0]===pad(month)&&bp[1]===pad(selDate);}):[];

  return(
    <div>
      <DelDialog/>
      <div style={st.label}>月間カレンダー</div>
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:12}}>
        <button onClick={()=>{const d=new Date(year,month-2,1);setViewYM(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);}} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>◀</button>
        <div style={{flex:1,textAlign:'center',fontSize:14,fontWeight:'bold',color:'#111'}}>{year}年{month}月</div>
        <button onClick={()=>{const d=new Date(year,month,1);setViewYM(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);}} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>▶</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>
        {['日','月','火','水','木','金','土'].map((d,i)=><div key={d} style={{textAlign:'center',fontSize:10,color:i===0?RED:i===6?'#3A6080':'#888',padding:'4px 0'}}>{d}</div>)}
      </div>
      <div style={{marginBottom:16}}>
        {weeks.map((wk,wi)=>(
          <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}}>
            {wk.map((d,di)=>{
              if(!d)return <div key={di}/>;
              const ds=`${year}-${pad(month)}-${pad(d)}`;
              const hasSched=(data.schedule||[]).some(s=>s.date===ds);
              const hasBday=(data.birthdays||[]).some(b=>{const bp=b.date.split('-');return bp.length===2&&bp[0]===pad(month)&&bp[1]===pad(d);});
              const isToday=ds===today();const isSel=selDate===d;
              return(
                <div key={di} onClick={()=>setSelDate(isSel?null:d)} style={{textAlign:'center',padding:'6px 2px',borderRadius:4,cursor:'pointer',background:isSel?GOLD:isToday?'#FBF7EE':'#fff',border:`1px solid ${isSel?GOLD:isToday?GOLD+'60':BORDER}`}}>
                  <div style={{fontSize:12,color:isSel?'#fff':di===0?RED:di===6?'#3A6080':'#111',fontWeight:isToday?'bold':'normal'}}>{d}</div>
                  <div style={{display:'flex',gap:2,justifyContent:'center',marginTop:2}}>
                    {hasSched&&<div style={{width:5,height:5,borderRadius:'50%',background:isSel?'#fff':GOLD}}/>}
                    {hasBday&&<div style={{width:5,height:5,borderRadius:'50%',background:isSel?'#fff':RED}}/>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
      {selDate&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:'bold',color:'#111',marginBottom:10}}>{year}年{month}月{selDate}日</div>
          {selBdays.map(b=><div key={b.id} style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,padding:'6px 10px',background:'#FFF0F0',borderRadius:4}}><span style={{fontSize:16}}>🎂</span><span style={{fontSize:13}}>{b.name} の誕生日</span></div>)}
          {selItems.length===0&&selBdays.length===0&&<div style={{fontSize:12,color:'#aaa'}}>予定なし</div>}
          {selItems.map(s=>(
            <div key={s.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:(s.color||GOLD)+'15',borderRadius:4,border:`1px solid ${s.color||GOLD}40`,marginBottom:6}}>
              <div style={{width:4,height:32,background:s.color||GOLD,borderRadius:2}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:'#888'}}>{s.start}{s.end?' — '+s.end:''}</div>
                <div style={{fontSize:13,color:'#111'}}>{s.title}</div>
                {s.genre&&<span style={{fontSize:10,color:s.color||GOLD}}>{s.genre}</span>}
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{...st.between,marginBottom:10}}>
        <div style={st.label}>ジャンル管理</div>
        <button onClick={()=>setShowGenreEdit(!showGenreEdit)} style={{...st.btn(LIGHT,'#333'),padding:'5px 10px',fontSize:11}}>{showGenreEdit?'閉じる':'編集'}</button>
      </div>
      {showGenreEdit&&(
        <div style={{...st.card,marginBottom:14}}>
          {genres.map(g=>(
            <div key={g.name} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style={{width:16,height:16,borderRadius:'50%',background:g.color,flexShrink:0}}/>
              <div style={{flex:1,fontSize:13,color:'#111'}}>{g.name}</div>
              <button onClick={async()=>{const ok=await confirmDel(`ジャンル「${g.name}」を削除しますか？`);if(ok)upd(d=>{d.genres=d.genres.filter(x=>x.name!==g.name);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:14,padding:'2px 6px'}}>×</button>
            </div>
          ))}
          <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:10,marginTop:6}}>
            <AddGenreForm genres={genres} upd={upd}/>
          </div>
        </div>
      )}

      <div style={st.label}>週間サマリー</div>
      <div style={{display:'flex',gap:8,marginBottom:14,alignItems:'center'}}>
        <button onClick={()=>setWeekOffset(w=>w-1)} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>◀</button>
        <div style={{flex:1,textAlign:'center',fontSize:12,color:'#333'}}>{weekDates[0].slice(5).replace('-','/')} 〜 {weekDates[6].slice(5).replace('-','/')}</div>
        <button onClick={()=>setWeekOffset(w=>w+1)} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>▶</button>
      </div>
      {totalMins>0&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>時間配分</div>
          <div style={{display:'flex',alignItems:'center',gap:16}}>
            <svg width="90" height="90" viewBox="0 0 90 90">{pieSlices.map((s,i)=><path key={i} d={pieArc(45,45,40,s.start,s.end)} fill={s.color}/>)}</svg>
            <div style={{flex:1}}>{pieSlices.map(s=>(
              <div key={s.name} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <div style={{width:10,height:10,borderRadius:2,background:s.color,flexShrink:0}}/>
                <span style={{fontSize:11,color:'#333'}}>{s.name}</span>
                <span style={{fontSize:11,color:'#888',marginLeft:'auto'}}>{(genreTotals[s.name]/60).toFixed(1)}h ({Math.round(s.pct*100)}%)</span>
              </div>
            ))}</div>
          </div>
        </div>
      )}
      {activeGenres.length>0&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>目標vs実績（時間）</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H+30}`} style={{overflow:'visible'}}>
            {activeGenres.map((g,i)=>{
              const x=20+i*((W-30)/activeGenres.length)+2;
              const bw=Math.min(26,(W-30)/activeGenres.length/2-4);
              const actualH=((genreTotals[g.name]||0)/60/maxVal)*H;
              const goalH=((genreGoals[g.name]||0)/maxVal)*H;
              const label=g.name.length>4?g.name.slice(0,4):g.name;
              return(
                <g key={g.name}>
                  {goalH>0&&<rect x={x} y={H-goalH} width={bw} height={goalH} fill="#C0D4F0" rx="2"/>}
                  <rect x={x+(goalH>0?bw+2:0)} y={H-actualH} width={bw} height={actualH} fill={g.color} rx="2"/>
                  <text x={x+bw/2} y={H+14} textAnchor="middle" fontSize="8" fill="#666">{label}</text>
                  {actualH>0&&<text x={x+(goalH>0?bw+2:0)+bw/2} y={H-actualH-3} textAnchor="middle" fontSize="8" fill={g.color}>{((genreTotals[g.name]||0)/60).toFixed(1)}</text>}
                </g>
              );
            })}
            <line x1="18" y1="0" x2="18" y2={H} stroke="#ddd" strokeWidth="1"/>
            <line x1="18" y1={H} x2={W} y2={H} stroke="#ddd" strokeWidth="1"/>
          </svg>
        </div>
      )}
      <div style={{...st.between,marginBottom:10}}>
        <div style={st.label}>目標時間（時間/週）</div>
        <button onClick={()=>{setGoalInputs({...genreGoals});setEditGoal(!editGoal);}} style={{...st.btn(LIGHT,'#333'),padding:'5px 10px',fontSize:11}}>{editGoal?'キャンセル':'編集'}</button>
      </div>
      {editGoal?(
        <div style={{...st.card,marginBottom:14}}>
          {genres.map(g=>(
            <div key={g.name} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style={{width:12,height:12,borderRadius:'50%',background:g.color,flexShrink:0}}/>
              <div style={{flex:1,fontSize:13,color:'#111'}}>{g.name}</div>
              <input type="number" value={goalInputs[g.name]||''} onChange={e=>setGoalInputs(gi=>({...gi,[g.name]:parseFloat(e.target.value)||0}))} placeholder="0" style={{...st.inp,width:70,textAlign:'center'}}/>
              <span style={{fontSize:11,color:'#888'}}>h</span>
            </div>
          ))}
          <button onClick={()=>{upd(d=>{d.genreGoals={...goalInputs};});setEditGoal(false);}} style={{...st.btn(),width:'100%'}}>保存</button>
        </div>
      ):(
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
          {genres.filter(g=>genreGoals[g.name]).map(g=>(
            <div key={g.name} style={{background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:6,padding:'6px 12px',fontSize:12}}>
              <span style={{color:'#333'}}>{g.name}</span>
              <span style={{color:g.color,marginLeft:6,fontWeight:700}}>{((genreTotals[g.name]||0)/60).toFixed(1)}h / {genreGoals[g.name]}h</span>
            </div>
          ))}
          {genres.filter(g=>genreGoals[g.name]).length===0&&<div style={{fontSize:12,color:'#aaa'}}>「編集」から目標時間を設定してください</div>}
        </div>
      )}
    </div>
  );
}

    <div>

    </div>
  );
}

// ── TODO ──
function TodoTab({data,upd}){
  const [filter,setFilter]=useState('active');
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({text:'',priority:'medium',deadline:'',repeat:''});
  const {confirm,Dialog}=useConfirm();
  function saveTodo(){if(!form.text.trim())return;if(editId)upd(d=>{d.todos=d.todos.map(x=>x.id===editId?{...x,...form}:x);});else upd(d=>{d.todos=[...d.todos,{id:Date.now(),...form,done:false}];});setForm({text:'',priority:'medium',deadline:'',repeat:''});setShowForm(false);setEditId(null);}
  const todos=(data.todos||[]).filter(t=>filter==='done'?t.done:!t.done).sort((a,b)=>({urgent:0,high:1,medium:2,low:3}[a.priority]||2)-({urgent:0,high:1,medium:2,low:3}[b.priority]||2));
  return(
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>タスク管理</div>
        <button onClick={()=>{setForm({text:'',priority:'medium',deadline:'',repeat:''});setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>
      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:12}}>
          <input value={form.text} onChange={e=>setForm(f=>({...f,text:e.target.value}))} placeholder="タスク内容" style={{...st.inp,marginBottom:8}}/>
          <div style={{...st.grid2,marginBottom:8}}>
            <select value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))} style={st.inp}><option value="urgent">緊急</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select>
            <input type="date" value={form.deadline} onChange={e=>setForm(f=>({...f,deadline:e.target.value}))} style={st.inp}/>
          </div>
          <select value={form.repeat} onChange={e=>setForm(f=>({...f,repeat:e.target.value}))} style={{...st.inp,marginBottom:10}}><option value="">繰り返しなし</option><option value="daily">毎日</option><option value="weekly">毎週</option><option value="monthly">毎月</option></select>
          <button onClick={saveTodo} style={st.btn()}>{editId?'更新':'保存'}</button>
        </div>
      )}
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['active','未完了'],['done','完了']].map(([k,l])=><button key={k} onClick={()=>setFilter(k)} style={{padding:'5px 12px',background:filter===k?GOLD:'#fff',border:`1px solid ${filter===k?GOLD:BORDER}`,borderRadius:3,color:filter===k?'#fff':'#555',fontSize:11,cursor:'pointer'}}>{l}</button>)}
      </div>
      {todos.length===0&&<div style={{fontSize:12,color:'#aaa'}}>タスクなし</div>}
      {todos.map(t=>{
        const pc=PCOLOR[t.priority]||PCOLOR.medium;
        const overdue=t.deadline&&t.deadline<today()&&!t.done;
        return(
          <div key={t.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'11px 14px',marginBottom:8,background:'#fff',border:`1px solid ${BORDER}`,borderLeft:`3px solid ${pc}`,borderRadius:4}}>
            <CheckCircle done={t.done} onClick={()=>upd(d=>{d.todos=d.todos.map(x=>x.id===t.id?{...x,done:!x.done}:x);})}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,color:t.done?'#aaa':'#111',textDecoration:t.done?'line-through':'none'}}>{t.text}</div>
              <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap'}}>
                <span style={{fontSize:10,color:pc,border:`1px solid ${pc}40`,borderRadius:2,padding:'1px 5px'}}>{PLABEL[t.priority]}</span>
                {t.deadline&&<span style={{fontSize:10,color:overdue?RED:'#888'}}>{t.deadline}</span>}
                {t.repeat&&<span style={{fontSize:10,color:'#888'}}>{{daily:'毎日',weekly:'毎週',monthly:'毎月'}[t.repeat]}</span>}
              </div>

// ── WEIGHT ──
function WeightTab({data,upd}){
  const [form,setForm]=useState({date:today(),weight:''});
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const {confirm,Dialog}=useConfirm();
  function saveWeight(){const w=parseFloat(form.weight);if(isNaN(w))return;if(editId)upd(d=>{d.weight=d.weight.map(x=>x.id===editId?{...x,date:form.date,weight:w}:x).sort((a,b)=>b.date.localeCompare(a.date));});else upd(d=>{d.weight=[{id:Date.now(),date:form.date,weight:w},...(d.weight||[])].sort((a,b)=>b.date.localeCompare(a.date));});setForm({date:today(),weight:''});setShowForm(false);setEditId(null);}
  const records=[...(data.weight||[])].reverse().slice(-30);
  const latest=(data.weight||[])[0];
  const W=300,H=110;
  const weights=records.map(r=>r.weight);
  const minW=weights.length>0?Math.min(...weights)-1:50;
  const maxW=weights.length>0?Math.max(...weights)+1:80;
  function toY(w){return H-((w-minW)/(maxW-minW))*H;}
  function toX(i){return records.length>1?(i/(records.length-1))*(W-20)+10:W/2;}
  const points=records.map((r,i)=>`${toX(i)},${toY(r.weight)}`).join(' ');
  return(
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}><div style={st.label}>体重記録</div><button onClick={()=>{setForm({date:today(),weight:''});setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 記録</button></div>
      {latest&&<div style={{...st.card,textAlign:'center',marginBottom:14,background:'#FBF7EE',border:`1px solid ${GOLD}50`}}><div style={{fontSize:10,color:'#888',marginBottom:4}}>最新</div><div style={{fontSize:32,color:GOLD,fontWeight:'bold'}}>{latest.weight}<span style={{fontSize:14,color:'#888'}}>kg</span></div><div style={{fontSize:11,color:'#888'}}>{latest.date}</div></div>}
      {showForm&&<div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}><div style={{...st.grid2,marginBottom:10}}><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/><input type="number" step="0.1" value={form.weight} onChange={e=>setForm(f=>({...f,weight:e.target.value}))} placeholder="体重 (kg)" style={st.inp}/></div><button onClick={saveWeight} style={st.btn()}>{editId?'更新':'保存'}</button></div>}

function GolfRound({golf,upd,data}){
  const {confirm,Dialog}=useConfirm();
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const courses=golf.courses||[];
  const [form,setForm]=useState({date:today(),courseId:'',score:'',putts:'',fairways:'',gir:'',ob:'',penalty:'',bunker:'',weather:'',wind:'',green:'',mental:'3',memo:''});
  const [holeScores,setHoleScores]=useState(Array(18).fill(''));

  function getCoursePar(courseId){
    const c=courses.find(x=>x.id===courseId);
    if(!c)return 72;
    return (c.holes||[]).reduce((s,h)=>s+(h.par||4),0);
  }

  function saveRound(){
    if(!form.date)return;
    const totalScore=holeScores.reduce((s,v)=>s+(parseInt(v)||0),0)||parseInt(form.score)||0;
    const round={id:editId||Date.now(),...form,score:totalScore,holeScores:[...holeScores]};
    if(editId) upd(d=>{d.golf.rounds=d.golf.rounds.map(x=>x.id===editId?round:x);});
    else upd(d=>{d.golf.rounds=[round,...(d.golf.rounds||[])];});
    setForm({date:today(),courseId:'',score:'',putts:'',fairways:'',gir:'',ob:'',penalty:'',bunker:'',weather:'',wind:'',green:'',mental:'3',memo:''});
    setHoleScores(Array(18).fill(''));setShowForm(false);setEditId(null);
  }

  function startEdit(r){
    setForm({date:r.date,courseId:r.courseId||'',score:String(r.score||''),putts:String(r.putts||''),fairways:String(r.fairways||''),gir:String(r.gir||''),ob:String(r.ob||''),penalty:String(r.penalty||''),bunker:String(r.bunker||''),weather:r.weather||'',wind:r.wind||'',green:r.green||'',mental:r.mental||'3',memo:r.memo||''});
    setHoleScores(r.holeScores||Array(18).fill(''));setEditId(r.id);setShowForm(true);
  }

  const rounds=(golf.rounds||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));

  // Score trend SVG
  const scoreData=rounds.slice().reverse().slice(-10);
  const W=300,H=80;
  const scores=scoreData.map(r=>r.score||0).filter(s=>s>0);
  const minS=scores.length>0?Math.min(...scores)-3:70;
  const maxS=scores.length>0?Math.max(...scores)+3:130;
  function toY(s){return H-((s-minS)/(maxS-minS))*H;}
  function toX(i){return scoreData.length>1?(i/(scoreData.length-1))*(W-20)+10:W/2;}
  const pts=scoreData.filter(r=>r.score>0).map((r,i)=>`${toX(i)},${toY(r.score)}`).join(' ');

  return(
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>ラウンド記録</div>
        <button onClick={()=>{setForm({date:today(),courseId:'',score:'',putts:'',fairways:'',gir:'',ob:'',penalty:'',bunker:'',weather:'',wind:'',green:'',mental:'3',memo:''});setHoleScores(Array(18).fill(''));setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>

      {scores.length>1&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>スコア推移</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H+20}`}>
            <polyline points={pts} fill="none" stroke={GREEN} strokeWidth="2"/>
            {scoreData.filter(r=>r.score>0).map((r,i)=>(
              <g key={r.id}>
                <circle cx={toX(i)} cy={toY(r.score)} r="4" fill={GREEN}/>
                <text x={toX(i)} y={toY(r.score)-6} textAnchor="middle" fontSize="9" fill="#555">{r.score}</text>
              </g>
            ))}
          </svg>
        </div>
      )}

      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}>
          <div style={{fontSize:13,fontWeight:'bold',color:'#111',marginBottom:12}}>{editId?'ラウンドを編集':'ラウンドを記録'}</div>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/>
            <select value={form.courseId} onChange={e=>setForm(f=>({...f,courseId:e.target.value}))} style={st.inp}>
              <option value="">コースを選択</option>
              {courses.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>

          {form.courseId&&(()=>{
            const c=courses.find(x=>x.id===form.courseId);
            if(!c||!c.holes||c.holes.length===0)return null;
            const par=getCoursePar(form.courseId);
            const total=holeScores.reduce((s,v)=>s+(parseInt(v)||0),0);
            return(
              <div style={{marginBottom:12}}>
                <div style={{fontSize:11,color:'#888',marginBottom:6}}>ホール別スコア（Par {par}）</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(6,1fr)',gap:4,marginBottom:8}}>
                  {c.holes.map((h,i)=>(
                    <div key={i} style={{textAlign:'center'}}>
                      <div style={{fontSize:9,color:'#888'}}>{i+1}H</div>
                      <div style={{fontSize:9,color:'#aaa'}}>P{h.par}</div>
                      <input type="number" value={holeScores[i]||''} onChange={e=>{const n=[...holeScores];n[i]=e.target.value;setHoleScores(n);}} style={{...st.inp,padding:'4px 2px',fontSize:12,textAlign:'center'}}/>
                      {holeScores[i]&&<div style={{fontSize:9,color:parseInt(holeScores[i])<h.par?'#5B3FA6':parseInt(holeScores[i])===h.par?GREEN:parseInt(holeScores[i])===h.par+1?'#888':RED}}>{parseInt(holeScores[i])-h.par>0?'+':''}{parseInt(holeScores[i])-h.par}</div>}
                    </div>
                  ))}
                </div>
                {total>0&&<div style={{fontSize:13,color:GOLD,fontWeight:'bold',textAlign:'center'}}>合計: {total} ({total-par>0?'+':''}{total-par})</div>}
              </div>
            );
          })()}

          {!form.courseId&&(
            <input type="number" value={form.score} onChange={e=>setForm(f=>({...f,score:e.target.value}))} placeholder="合計スコア" style={{...st.inp,marginBottom:8}}/>
          )}

          <div style={{...st.grid2,marginBottom:8}}>
            <input type="number" value={form.putts} onChange={e=>setForm(f=>({...f,putts:e.target.value}))} placeholder="パット数" style={st.inp}/>
            <input type="number" value={form.fairways} onChange={e=>setForm(f=>({...f,fairways:e.target.value}))} placeholder="フェアウェイキープ数" style={st.inp}/>
          </div>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="number" value={form.gir} onChange={e=>setForm(f=>({...f,gir:e.target.value}))} placeholder="GIR数" style={st.inp}/>
            <input type="number" value={form.ob} onChange={e=>setForm(f=>({...f,ob:e.target.value}))} placeholder="OB数" style={st.inp}/>
          </div>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="number" value={form.bunker} onChange={e=>setForm(f=>({...f,bunker:e.target.value}))} placeholder="バンカー数" style={st.inp}/>
            <input type="number" value={form.penalty} onChange={e=>setForm(f=>({...f,penalty:e.target.value}))} placeholder="ペナルティ数" style={st.inp}/>
          </div>
          <div style={{...st.grid2,marginBottom:8}}>
            <input value={form.weather} onChange={e=>setForm(f=>({...f,weather:e.target.value}))} placeholder="天候（晴れ・曇りなど）" style={st.inp}/>
            <input value={form.wind} onChange={e=>setForm(f=>({...f,wind:e.target.value}))} placeholder="風（強・弱・なし）" style={st.inp}/>
          </div>
          <input value={form.green} onChange={e=>setForm(f=>({...f,green:e.target.value}))} placeholder="グリーンの速さ（速い・普通・遅い）" style={{...st.inp,marginBottom:8}}/>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:'#888',marginBottom:4}}>メンタル</div>
            <div style={{display:'flex',gap:6}}>
              {['1','2','3','4','5'].map(v=><button key={v} onClick={()=>setForm(f=>({...f,mental:v}))} style={{flex:1,padding:'6px 0',background:form.mental===v?GOLD:'#fff',border:`1px solid ${form.mental===v?GOLD:BORDER}`,borderRadius:3,color:form.mental===v?'#fff':'#555',fontSize:12,cursor:'pointer'}}>{v}</button>)}
            </div>
          </div>
          <textarea value={form.memo} onChange={e=>setForm(f=>({...f,memo:e.target.value}))} placeholder="気づき・反省・次回への引き継ぎ" rows={3} style={{...st.inp,resize:'vertical',marginBottom:10}}/>
          <button onClick={saveRound} style={{...st.btn(),width:'100%'}}>{editId?'更新':'保存'}</button>
        </div>
      )}

      {rounds.length===0&&<div style={{fontSize:12,color:'#aaa'}}>ラウンドを記録してください</div>}
      {rounds.map(r=>{
        const c=courses.find(x=>x.id===r.courseId);
        const par=c?getCoursePar(r.courseId):72;
        const diff=r.score?(r.score-par):null;
        return(
          <div key={r.id} style={{...st.card,marginBottom:10}}>

                <div style={{fontSize:13,color:'#111',fontWeight:'bold'}}>{r.date} {c?c.name:''}</div>
                <div style={{fontSize:11,color:'#888'}}>{r.weather&&r.weather} {r.wind&&'風:'+r.wind}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontSize:22,color:diff===null?'#111':diff<=0?'#5B3FA6':diff<=5?GREEN:diff<=10?GOLD:RED,fontWeight:'bold'}}>{r.score||'-'}</div>
                {diff!==null&&<div style={{fontSize:11,color:'#888'}}>{diff>0?'+':''}{diff}</div>}

              <button onClick={async()=>{const ok=await confirm('このラウンドを削除しますか？');if(ok)upd(d=>{d.golf.rounds=d.golf.rounds.filter(x=>x.id!==r.id);});}} style={{...st.btn('#fff',RED),flex:1,fontSize:11,border:`1px solid ${RED}`}}>× 削除</button>
            </div>
          </div>
        );
      })}
    </div>
  );

function GolfPractice({golf,upd}){
  const {confirm,Dialog}=useConfirm();
  const [showForm,setShowForm]=useState(false);
  const [clubData,setClubData]=useState(CLUBS.map(c=>({club:c,yards:[]})));
  const [form,setForm]=useState({date:today(),location:'',memo:''});
  const [yardInputs,setYardInputs]=useState({});

  function calcStats(yards){
    const nums=yards.filter(y=>y>0);if(nums.length===0)return{avg:0,std:0,min:0,max:0,count:0};
    const avg=nums.reduce((s,v)=>s+v,0)/nums.length;
    const std=Math.sqrt(nums.reduce((s,v)=>s+(v-avg)**2,0)/nums.length);
    return{avg:Math.round(avg),std:Math.round(std),min:Math.min(...nums),max:Math.max(...nums),count:nums.length};
  }

  function savePractice(){
    const shots={};
    Object.entries(yardInputs).forEach(([club,val])=>{
      const yards=val.split(/[,\s]+/).map(v=>parseInt(v)).filter(v=>!isNaN(v)&&v>0);
      if(yards.length>0)shots[club]=yards;
    });
    upd(d=>{d.golf.practice=[{id:Date.now(),...form,shots},...(d.golf.practice||[])];});
    setForm({date:today(),location:'',memo:''});setYardInputs({});setShowForm(false);
  }

  // Aggregate club stats across all sessions
  const clubStats={};
  CLUBS.forEach(club=>{
    const allYards=[];
    (golf.practice||[]).forEach(p=>{if(p.shots&&p.shots[club])allYards.push(...p.shots[club]);});
    if(allYards.length>0)clubStats[club]=calcStats(allYards);
  });

  const practice=(golf.practice||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));

  return(
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>練習記録</div>
        <button onClick={()=>setShowForm(!showForm)} style={st.btn()}>+ 追加</button>
      </div>

      {Object.keys(clubStats).length>0&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:10}}>クラブ別平均飛距離</div>
          {Object.entries(clubStats).map(([club,s])=>(
            <div key={club} style={{marginBottom:8}}>
              <div style={{...st.between,marginBottom:2}}>
                <span style={{fontSize:12,color:'#111'}}>{club}</span>
                <span style={{fontSize:12,color:GOLD,fontWeight:'bold'}}>{s.avg}y</span>
              </div>
              <div style={{height:4,background:'#eee',borderRadius:2,overflow:'hidden'}}>
                <div style={{width:`${Math.min(100,(s.avg/300)*100)}%`,height:'100%',background:GOLD,borderRadius:2}}/>
              </div>
              <div style={{fontSize:10,color:'#888',marginTop:2}}>σ={s.std}y　{s.min}〜{s.max}y　({s.count}球)</div>
            </div>
          ))}
        </div>
      )}

      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/>
            <input value={form.location} onChange={e=>setForm(f=>({...f,location:e.target.value}))} placeholder="場所（打ちっぱなし名）" style={st.inp}/>
          </div>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>クラブ別飛距離（カンマ区切りで複数入力）</div>
          {CLUBS.map(club=>(
            <div key={club} style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
              <span style={{fontSize:12,color:'#333',width:80,flexShrink:0}}>{club}</span>
              <input value={yardInputs[club]||''} onChange={e=>setYardInputs(v=>({...v,[club]:e.target.value}))} placeholder="例: 240, 235, 245" style={{...st.inp,fontSize:12}}/>
              <span style={{fontSize:11,color:'#888',flexShrink:0}}>y</span>
            </div>
          ))}
          <textarea value={form.memo} onChange={e=>setForm(f=>({...f,memo:e.target.value}))} placeholder="練習メモ・気づき" rows={3} style={{...st.inp,resize:'vertical',marginTop:8,marginBottom:10}}/>
          <button onClick={savePractice} style={{...st.btn(),width:'100%'}}>保存</button>
        </div>
      )}

      {practice.length===0&&<div style={{fontSize:12,color:'#aaa'}}>練習を記録してください</div>}
      {practice.map(p=>(
        <div key={p.id} style={{...st.card,marginBottom:10}}>
          <div style={st.between}>
            <div><div style={{fontSize:13,color:'#111',fontWeight:'bold'}}>{p.date} {p.location&&`@ ${p.location}`}</div></div>
            <button onClick={async()=>{const ok=await confirm('この記録を削除しますか？');if(ok)upd(d=>{d.golf.practice=d.golf.practice.filter(x=>x.id!==p.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
          </div>
          {p.shots&&Object.keys(p.shots).length>0&&(
            <div style={{marginTop:8,display:'flex',flexWrap:'wrap',gap:6}}>
              {Object.entries(p.shots).map(([club,yards])=>{
                const s=calcStats(yards);
                return <span key={club} style={{fontSize:11,background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:4,padding:'2px 8px'}}>{club}: <strong>{s.avg}y</strong> (σ{s.std})</span>;
              })}
            </div>
          )}
          {p.memo&&<div style={{fontSize:11,color:'#555',marginTop:6,padding:'6px 8px',background:LIGHT,borderRadius:4}}>{p.memo}</div>}
        </div>
      ))}
    </div>
  );
}

function GolfCourse({golf,upd}){
  const {confirm,Dialog}=useConfirm();
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({name:'',address:'',holes:Array(18).fill({par:4,yards:0,memo:''})});
  const [holeCount,setHoleCount]=useState(18);

  function saveCourse(){
    if(!form.name.trim())return;
    const course={id:editId||Date.now(),name:form.name,address:form.address,holes:form.holes.slice(0,holeCount)};
    if(editId)upd(d=>{d.golf.courses=d.golf.courses.map(x=>x.id===editId?course:x);});
    else upd(d=>{d.golf.courses=[...(d.golf.courses||[]),course];});
    setForm({name:'',address:'',holes:Array(18).fill({par:4,yards:0,memo:''})});setShowForm(false);setEditId(null);
  }

  function startEdit(c){
    const holes=Array(18).fill({par:4,yards:0,memo:''}).map((h,i)=>c.holes[i]||h);
    setForm({name:c.name,address:c.address||'',holes});setHoleCount(c.holes.length||18);setEditId(c.id);setShowForm(true);
  }

  function updateHole(i,field,value){
    setForm(f=>{const holes=[...f.holes];holes[i]={...holes[i],[field]:field==='par'||field==='yards'?parseInt(value)||0:value};return{...f,holes};});

function GolfStats({golf}){
  const rounds=(golf.rounds||[]).filter(r=>r.score>0);
  const practice=golf.practice||[];
  if(rounds.length===0&&practice.length===0)return <div style={{fontSize:12,color:'#aaa'}}>データを記録すると統計が表示されます</div>;

  const avgScore=rounds.length>0?Math.round(rounds.reduce((s,r)=>s+r.score,0)/rounds.length):0;
  const bestScore=rounds.length>0?Math.min(...rounds.map(r=>r.score)):0;
  const avgPutts=rounds.filter(r=>r.putts>0).length>0?Math.round(rounds.filter(r=>r.putts>0).reduce((s,r)=>s+parseInt(r.putts||0),0)/rounds.filter(r=>r.putts>0).length):0;
  const avgOb=rounds.filter(r=>r.ob>0).length>0?Math.round(rounds.filter(r=>r.ob>0).reduce((s,r)=>s+parseInt(r.ob||0),0)/rounds.filter(r=>r.ob>0).length*10)/10:0;

  // Club stats
  const clubStats={};
  CLUBS.forEach(club=>{
    const allYards=[];
    practice.forEach(p=>{if(p.shots&&p.shots[club])allYards.push(...p.shots[club]);});
    if(allYards.length>0){
      const avg=Math.round(allYards.reduce((s,v)=>s+v,0)/allYards.length);
      const std=Math.round(Math.sqrt(allYards.reduce((s,v)=>s+(v-avg)**2,0)/allYards.length));
      clubStats[club]={avg,std,count:allYards.length};
    }
  });

  return(
    <div>
      <div style={st.label}>ラウンド統計</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
        {[{l:'平均スコア',v:avgScore||'-'},{l:'ベストスコア',v:bestScore||'-'},{l:'平均パット数',v:avgPutts||'-'},{l:'平均OB数',v:avgOb||'-'}].map(x=>(
          <div key={x.l} style={{background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:6,padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:9,color:'#888',marginBottom:4}}>{x.l}</div>
            <div style={{fontSize:22,color:NAVY,fontWeight:'bold'}}>{x.v}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:12,color:'#888',marginBottom:8}}>ラウンド数: {rounds.length}回</div>

      {Object.keys(clubStats).length>0&&(
        <>
          <div style={st.label}>クラブ別統計</div>
          <div style={{...st.card}}>
            {Object.entries(clubStats).map(([club,s])=>(
              <div key={club} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,paddingBottom:8,borderBottom:`1px solid ${BORDER}`}}>
                <span style={{fontSize:12,color:'#333',width:80,flexShrink:0}}>{club}</span>
                <div style={{flex:1}}>
                  <div style={{height:4,background:'#eee',borderRadius:2,overflow:'hidden',marginBottom:2}}>
                    <div style={{width:`${Math.min(100,(s.avg/300)*100)}%`,height:'100%',background:GOLD,borderRadius:2}}/>
                  </div>
                </div>
                <div style={{textAlign:'right',flexShrink:0}}>
                  <div style={{fontSize:13,color:GOLD,fontWeight:'bold'}}>{s.avg}y</div>
                  <div style={{fontSize:10,color:'#888'}}>σ{s.std} ({s.count}球)</div>
                </div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── WORKOUT ──
function WorkoutTab({data,upd}){
  const {confirm,Dialog}=useConfirm();
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({date:today(),exercise:'',location:'',condition:'3',parts:[],totalTime:'',memo:''});
  const [sets,setSets]=useState([{reps:'',weight:'',rest:''}]);
  function addSet(){setSets(s=>[...s,{reps:'',weight:'',rest:''}]);}
  function updateSet(i,field,val){setSets(s=>{const n=[...s];n[i]={...n[i],[field]:val};return n;});}
  function removeSet(i){setSets(s=>s.filter((_,idx)=>idx!==i));}
  function saveSession(){
    if(!form.exercise.trim())return;
    const session={id:editId||Date.now(),...form,sets:[...sets]};
    if(editId)upd(d=>{d.workout.sessions=d.workout.sessions.map(x=>x.id===editId?session:x);});
    else upd(d=>{d.workout.sessions=[session,...(d.workout.sessions||[])];});
    setForm({date:today(),exercise:'',location:'',condition:'3',parts:[],totalTime:'',memo:''});
    setSets([{reps:'',weight:'',rest:''}]);setShowForm(false);setEditId(null);
  }
  function startEdit(s){
    setForm({date:s.date,exercise:s.exercise,location:s.location||'',condition:s.condition||'3',parts:s.parts||[],totalTime:s.totalTime||'',memo:s.memo||''});
    setSets(s.sets&&s.sets.length>0?s.sets:[{reps:'',weight:'',rest:''}]);
    setEditId(s.id);setShowForm(true);
  }
  const sessions=(data.workout?.sessions||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const exerciseNames=[...new Set(sessions.map(s=>s.exercise))];
  const [selectedEx,setSelectedEx]=useState('');
  const exSessions=sessions.filter(s=>s.exercise===(selectedEx||exerciseNames[0]));
  const W=300,H=80;
  const volumes=exSessions.slice().reverse().map(s=>s.sets?s.sets.reduce((t,set)=>(t+(parseFloat(set.weight)||0)*(parseInt(set.reps)||0)),0):0);
  const minV=volumes.length>0?Math.min(...volumes):0;
  const maxV=volumes.length>0?Math.max(...volumes):0;
  function toYW(v){return maxV===minV?H/2:H-((v-minV)/(maxV-minV))*H;}
  function toXW(i,len){return len>1?(i/(len-1))*(W-20)+10:W/2;}
  const ptsW=volumes.map((v,i)=>`${toXW(i,volumes.length)},${toYW(v)}`).join(' ');
  const allRests=sessions.flatMap(s=>(s.sets||[]).map(set=>parseInt(set.rest)||0)).filter(r=>r>0);
  const avgRest=allRests.length>0?Math.round(allRests.reduce((s,v)=>s+v,0)/allRests.length):0;
  const PARTS=['胸','背中','肩','腕','腹','脚','全身'];
  return(
    <div>
      <Dialog/>
      <TabGoalBanner tabId="workout" data={data} upd={upd}/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>筋トレ記録</div>
        <button onClick={()=>{setForm({date:today(),exercise:'',location:'',condition:'3',parts:[],totalTime:'',memo:''});setSets([{reps:'',weight:'',rest:''}]);setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>
      {sessions.length>0&&(
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
          <div style={{background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:6,padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:9,color:'#888',marginBottom:4}}>総セッション数</div>
            <div style={{fontSize:22,color:NAVY,fontWeight:'bold'}}>{sessions.length}</div>
          </div>
          <div style={{background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:6,padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:9,color:'#888',marginBottom:4}}>平均セット間休憩</div>
            <div style={{fontSize:22,color:NAVY,fontWeight:'bold'}}>{avgRest>0?avgRest+'秒':'-'}</div>
          </div>
        </div>
      )}
      {exerciseNames.length>0&&volumes.length>1&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>種目別ボリューム推移</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:8}}>
            {exerciseNames.slice(0,5).map(ex=>(
              <button key={ex} onClick={()=>setSelectedEx(ex)} style={{padding:'4px 10px',background:(selectedEx||exerciseNames[0])===ex?NAVY:'#fff',border:`1px solid ${(selectedEx||exerciseNames[0])===ex?NAVY:BORDER}`,borderRadius:20,color:(selectedEx||exerciseNames[0])===ex?'#fff':'#555',fontSize:11,cursor:'pointer'}}>{ex}</button>
            ))}
          </div>
          <svg width="100%" viewBox={`0 0 ${W} ${H+20}`}>
            <polyline points={ptsW} fill="none" stroke={GREEN} strokeWidth="2"/>
            {volumes.map((v,i)=><circle key={i} cx={toXW(i,volumes.length)} cy={toYW(v)} r="3" fill={GREEN}/>)}
          </svg>
        </div>
      )}
      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/>
            <input value={form.location} onChange={e=>setForm(f=>({...f,location:e.target.value}))} placeholder="場所" style={st.inp}/>
          </div>
          <input value={form.exercise} onChange={e=>setForm(f=>({...f,exercise:e.target.value}))} placeholder="種目名（例：ベンチプレス）" style={{...st.inp,marginBottom:8}}/>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:'#888',marginBottom:6}}>部位</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {PARTS.map(p=><button key={p} onClick={()=>setForm(f=>({...f,parts:f.parts.includes(p)?f.parts.filter(x=>x!==p):[...f.parts,p]}))} style={{padding:'4px 10px',background:form.parts.includes(p)?NAVY:'#fff',border:`1px solid ${form.parts.includes(p)?NAVY:BORDER}`,borderRadius:20,color:form.parts.includes(p)?'#fff':'#555',fontSize:11,cursor:'pointer'}}>{p}</button>)}
            </div>
          </div>
          <div style={{marginBottom:8}}>
            <div style={{fontSize:10,color:'#888',marginBottom:4}}>コンディション</div>
            <div style={{display:'flex',gap:6}}>{['1','2','3','4','5'].map(v=><button key={v} onClick={()=>setForm(f=>({...f,condition:v}))} style={{flex:1,padding:'6px 0',background:form.condition===v?GOLD:'#fff',border:`1px solid ${form.condition===v?GOLD:BORDER}`,borderRadius:3,color:form.condition===v?'#fff':'#555',fontSize:12,cursor:'pointer'}}>{v}</button>)}</div>
          </div>
          <div style={{fontSize:11,color:'#888',marginBottom:6}}>セット記録（回数・重量kg・休憩秒）</div>
          {sets.map((set,i)=>(
            <div key={i} style={{display:'flex',gap:4,alignItems:'center',marginBottom:6}}>
              <span style={{fontSize:11,color:'#888',width:20,flexShrink:0}}>{i+1}</span>
              <input type="number" value={set.reps} onChange={e=>updateSet(i,'reps',e.target.value)} placeholder="回" style={{...st.inp,flex:1}}/>
              <input type="number" value={set.weight} onChange={e=>updateSet(i,'weight',e.target.value)} placeholder="kg" style={{...st.inp,flex:1}}/>
              <input type="number" value={set.rest} onChange={e=>updateSet(i,'rest',e.target.value)} placeholder="秒" style={{...st.inp,flex:1}}/>
              {sets.length>1&&<button onClick={()=>removeSet(i)} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>}
            </div>
          ))}
          <button onClick={addSet} style={{...st.btn(LIGHT,'#555'),width:'100%',marginBottom:8,fontSize:12}}>+ セット追加</button>
          <input value={form.totalTime} onChange={e=>setForm(f=>({...f,totalTime:e.target.value}))} placeholder="総時間（例: 60分）" style={{...st.inp,marginBottom:8}}/>
          <textarea value={form.memo} onChange={e=>setForm(f=>({...f,memo:e.target.value}))} placeholder="メモ・気づき" rows={2} style={{...st.inp,resize:'vertical',marginBottom:10}}/>
          <button onClick={saveSession} style={{...st.btn(),width:'100%'}}>{editId?'更新':'保存'}</button>
        </div>
      )}
      {sessions.length===0&&<div style={{fontSize:12,color:'#aaa'}}>筋トレを記録してください</div>}
      {sessions.map(s=>{
        const totalVol=s.sets?s.sets.reduce((t,set)=>(t+(parseFloat(set.weight)||0)*(parseInt(set.reps)||0)),0):0;
        return(
          <div key={s.id} style={{...st.card,marginBottom:10}}>
            <div style={st.between}>
              <div><div style={{fontSize:13,color:'#111',fontWeight:'bold'}}>{s.exercise}</div><div style={{fontSize:11,color:'#888'}}>{s.date}{s.location&&` @ ${s.location}`}</div></div>
              <div style={{textAlign:'right'}}><div style={{fontSize:13,color:GREEN,fontWeight:'bold'}}>{totalVol>0?totalVol+'kg':''}</div><div style={{fontSize:10,color:'#888'}}>{s.sets?s.sets.length:0}セット</div></div>
            </div>
            {s.parts&&s.parts.length>0&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginTop:4}}>{s.parts.map(p=><span key={p} style={{fontSize:10,background:NAVY+'15',color:NAVY,borderRadius:3,padding:'1px 6px'}}>{p}</span>)}</div>}
            {s.sets&&s.sets.length>0&&<div style={{marginTop:8,borderTop:`1px solid ${BORDER}`,paddingTop:8}}>{s.sets.map((set,i)=><div key={i} style={{display:'flex',gap:8,fontSize:12,color:'#555',marginBottom:3}}><span style={{color:'#888'}}>{i+1}セット</span><span>{set.reps}回</span>{set.weight&&<span>{set.weight}kg</span>}{set.rest&&<span style={{color:'#aaa'}}>休{set.rest}秒</span>}</div>)}</div>}
            {s.memo&&<div style={{fontSize:11,color:'#555',marginTop:6,padding:'6px 8px',background:LIGHT,borderRadius:4}}>{s.memo}</div>}
            <div style={{display:'flex',gap:6,marginTop:8}}>
              <button onClick={()=>startEdit(s)} style={{...st.btn(LIGHT,'#555'),flex:1,fontSize:11}}>✏️ 編集</button>
              <button onClick={async()=>{const ok=await confirm('このセッションを削除しますか？');if(ok)upd(d=>{d.workout.sessions=d.workout.sessions.filter(x=>x.id!==s.id);});}} style={{...st.btn('#fff',RED),flex:1,fontSize:11,border:`1px solid ${RED}`}}>× 削除</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── BOOKS ──
function BooksTab({data,upd}){
  const {confirm,Dialog}=useConfirm();
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [viewing,setViewing]=useState(null);
  const [form,setForm]=useState({title:'',author:'',date:today(),summary:'',impression:'',rating:'3'});
  function saveBook(){
    if(!form.title.trim())return;
    if(editId)upd(d=>{d.books=d.books.map(x=>x.id===editId?{...x,...form}:x);});
    else upd(d=>{d.books=[{id:Date.now(),...form},...(d.books||[])];});
    setForm({title:'',author:'',date:today(),summary:'',impression:'',rating:'3'});setShowForm(false);setEditId(null);
  }
  const books=data.books||[];
  if(viewing){
    const b=books.find(x=>x.id===viewing);
    return(
      <div>
        <Dialog/>
        <div style={{...st.between,marginBottom:14}}>
          <div style={st.label}>{b?.title}</div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>{setForm({title:b.title,author:b.author||'',date:b.date,summary:b.summary||'',impression:b.impression||'',rating:b.rating||'3'});setEditId(b.id);setShowForm(true);setViewing(null);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
            <button onClick={async()=>{const ok=await confirm('この本を削除しますか？');if(ok){upd(d=>{d.books=d.books.filter(x=>x.id!==b.id);});setViewing(null);}}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
            <button onClick={()=>setViewing(null)} style={{background:'none',border:'none',color:'#888',cursor:'pointer',fontSize:12}}>← 戻る</button>
          </div>
        </div>
        {b&&<div style={st.card}>
          <div style={{fontSize:18,color:NAVY,fontWeight:'bold',marginBottom:4}}>{b.title}</div>
          {b.author&&<div style={{fontSize:13,color:'#888',marginBottom:4}}>著者: {b.author}</div>}
          <div style={{fontSize:11,color:'#888',marginBottom:12}}>読了: {b.date}　{'⭐'.repeat(parseInt(b.rating)||3)}</div>
          {b.summary&&<div style={{marginBottom:12}}><div style={{fontSize:10,color:'#888',marginBottom:4,letterSpacing:'0.1em'}}>SUMMARY</div><div style={{fontSize:13,color:'#111',lineHeight:1.8,whiteSpace:'pre-wrap'}}>{b.summary}</div></div>}
          {b.impression&&<div><div style={{fontSize:10,color:'#888',marginBottom:4,letterSpacing:'0.1em'}}>IMPRESSION</div><div style={{fontSize:13,color:'#111',lineHeight:1.8,whiteSpace:'pre-wrap'}}>{b.impression}</div></div>}
        </div>}
      </div>
    );
  }
  return(
    <div>
      <Dialog/>
      <TabGoalBanner tabId="books" data={data} upd={upd}/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>読書記録 ({books.length}冊)</div>
        <button onClick={()=>{setForm({title:'',author:'',date:today(),summary:'',impression:'',rating:'3'});setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>
      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}>
          <input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} placeholder="書名" style={{...st.inp,marginBottom:8}}/>
          <input value={form.author} onChange={e=>setForm(f=>({...f,author:e.target.value}))} placeholder="著者" style={{...st.inp,marginBottom:8}}/>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/>
            <div><div style={{fontSize:10,color:'#888',marginBottom:4}}>評価</div><div style={{display:'flex',gap:3}}>{['1','2','3','4','5'].map(v=><button key={v} onClick={()=>setForm(f=>({...f,rating:v}))} style={{flex:1,padding:'5px 0',background:form.rating===v?GOLD:'#fff',border:`1px solid ${form.rating===v?GOLD:BORDER}`,borderRadius:3,color:form.rating===v?'#fff':'#555',fontSize:10,cursor:'pointer'}}>{v}⭐</button>)}</div></div>
          </div>
          <textarea value={form.summary} onChange={e=>setForm(f=>({...f,summary:e.target.value}))} placeholder="内容・要約" rows={3} style={{...st.inp,resize:'vertical',marginBottom:8}}/>
          <textarea value={form.impression} onChange={e=>setForm(f=>({...f,impression:e.target.value}))} placeholder="感想・学び" rows={3} style={{...st.inp,resize:'vertical',marginBottom:10}}/>
          <button onClick={saveBook} style={{...st.btn(),width:'100%'}}>{editId?'更新':'保存'}</button>
        </div>
      )}
      {books.length===0&&<div style={{fontSize:12,color:'#aaa'}}>本を追加してください</div>}
      {books.map(b=>(
        <div key={b.id} onClick={()=>setViewing(b.id)} style={{...st.card,cursor:'pointer',marginBottom:8,display:'flex',alignItems:'center',gap:12}}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,color:NAVY,fontWeight:'bold'}}>{b.title}</div>
            {b.author&&<div style={{fontSize:11,color:'#888'}}>{b.author}</div>}
            <div style={{fontSize:10,color:'#888',marginTop:2}}>{b.date}　{'⭐'.repeat(parseInt(b.rating)||3)}</div>
            {b.impression&&<div style={{fontSize:12,color:'#555',marginTop:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{b.impression}</div>}
          </div>
          <div style={{color:'#aaa'}}>›</div>
        </div>
      ))}
    </div>
  );
}

// ── QUOTES ──
function QuotesTab({data,upd}){
  const {confirm,Dialog}=useConfirm();
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [form,setForm]=useState({text:'',author:'',memo:''});
  function saveQuote(){
    if(!form.text.trim())return;
    if(editId)upd(d=>{d.quotes=d.quotes.map(x=>x.id===editId?{...x,...form}:x);});
    else upd(d=>{d.quotes=[{id:Date.now(),...form},...(d.quotes||[])];});
    setForm({text:'',author:'',memo:''});setShowForm(false);setEditId(null);
  }
  const quotes=data.quotes||[];
  const todayQuote=quotes.length>0?quotes[new Date().getDate()%quotes.length]:null;
  return(
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>名言・座右の銘 ({quotes.length}件)</div>
        <button onClick={()=>{setForm({text:'',author:'',memo:''});setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>
      {todayQuote&&(
        <div style={{...st.card,background:'#FBF7EE',border:`1px solid ${GOLD}`,marginBottom:14,textAlign:'center',padding:'20px 16px'}}>
          <div style={{fontSize:10,color:'#888',marginBottom:10,letterSpacing:'0.15em'}}>TODAY'S QUOTE</div>
          <div style={{fontSize:15,color:NAVY,lineHeight:1.8,fontStyle:'italic',marginBottom:10}}>「{todayQuote.text}」</div>
          {todayQuote.author&&<div style={{fontSize:12,color:GOLD}}>— {todayQuote.author}</div>}
        </div>
      )}
      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}>
          <textarea value={form.text} onChange={e=>setForm(f=>({...f,text:e.target.value}))} placeholder="名言・座右の銘" rows={3} style={{...st.inp,resize:'vertical',marginBottom:8}}/>
          <input value={form.author} onChange={e=>setForm(f=>({...f,author:e.target.value}))} placeholder="言った人・出典" style={{...st.inp,marginBottom:8}}/>
          <input value={form.memo} onChange={e=>setForm(f=>({...f,memo:e.target.value}))} placeholder="メモ（任意）" style={{...st.inp,marginBottom:10}}/>
          <button onClick={saveQuote} style={{...st.btn(),width:'100%'}}>{editId?'更新':'保存'}</button>
        </div>
      )}
      {quotes.length===0&&<div style={{fontSize:12,color:'#aaa'}}>名言を追加してください</div>}
      {quotes.map(q=>(
        <div key={q.id} style={{...st.card,marginBottom:10,borderLeft:`3px solid ${GOLD}`}}>
          <div style={st.between}>
            <div style={{flex:1}}>
              <div style={{fontSize:14,color:NAVY,lineHeight:1.7,fontStyle:'italic'}}>「{q.text}」</div>
              {q.author&&<div style={{fontSize:12,color:GOLD,marginTop:4}}>— {q.author}</div>}
              {q.memo&&<div style={{fontSize:11,color:'#888',marginTop:4}}>{q.memo}</div>}
            </div>
            <div style={{display:'flex',gap:4,marginLeft:8,flexShrink:0}}>
              <button onClick={()=>{setForm({text:q.text,author:q.author||'',memo:q.memo||''});setEditId(q.id);setShowForm(true);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
              <button onClick={async()=>{const ok=await confirm('この名言を削除しますか？');if(ok)upd(d=>{d.quotes=d.quotes.filter(x=>x.id!==q.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── GOLF CLUBS ──
function GolfClubsTab({golf,upd}){
  const {confirm,Dialog}=useConfirm();
  const [newClub,setNewClub]=useState('');
  const clubs=golf.clubs||['ドライバー','3W','5W','5U','4I','5I','6I','7I','8I','9I','PW','AW','SW','LW','パター'];
  return(
    <div>
      <Dialog/>
      <div style={st.label}>クラブ管理</div>
      <div style={{display:'flex',gap:6,marginBottom:14}}>
        <input value={newClub} onChange={e=>setNewClub(e.target.value)} placeholder="クラブ名を追加" style={{...st.inp,flex:1}}/>
        <button onClick={()=>{if(!newClub.trim())return;upd(d=>{if(!d.golf.clubs.includes(newClub.trim()))d.golf.clubs=[...d.golf.clubs,newClub.trim()];});setNewClub('');}} style={st.btn()}>追加</button>
      </div>
      {clubs.map(c=>(
        <div key={c} style={{display:'flex',alignItems:'center',padding:'10px 14px',marginBottom:6,background:'#fff',border:`1px solid ${BORDER}`,borderRadius:4}}>
          <div style={{flex:1,fontSize:13}}>{c}</div>
          <button onClick={async()=>{const ok=await confirm(`「${c}」を削除しますか？`);if(ok)upd(d=>{d.golf.clubs=d.golf.clubs.filter(x=>x!==c);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
        </div>
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
