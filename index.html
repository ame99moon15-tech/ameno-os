<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDW9bsgzflkCqEMjabVfkfH09F4q7WejDc",
    authDomain: "myapp-a7d5c.firebaseapp.com",
    projectId: "myapp-a7d5c",
    storageBucket: "myapp-a7d5c.firebasestorage.app",
    messagingSenderId: "246001375032",
    appId: "1:246001375032:web:5af96af5b5c93492ac53cd",
    measurementId: "G-H57R56PEC6"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const DOC_REF = doc(db, "ameno_os", "data");

  window._fbLoad = async function() {
    try {
      const snap = await getDoc(DOC_REF);
      if (snap.exists()) return snap.data();
      return null;
    } catch(e) { console.error('Firebase load error:', e); return null; }
  };

  window._fbSave = async function(data) {
    try {
      await setDoc(DOC_REF, data);
    } catch(e) { console.error('Firebase save error:', e); }
  };

  window._firebaseReady = true;
  window.dispatchEvent(new Event('firebaseReady'));
</script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const GOLD = '#B8955A';
const NAVY = '#1B2A4A';
const BORDER = '#E0D8CC';
const LIGHT = '#F9F6F1';
const RED = '#B84040';
const GREEN = '#3A7A5A';
const GENRE_COLORS = ['#B8955A','#5B3FA6','#3A7A5A','#1B2A4A','#B84040','#C07030','#3A6080','#7A3A6A','#4A7A3A','#8A7030'];

const DEFAULT = {
  pin: null,
  schedule: [], todos: [], goals: [],
  finance: { investment: 0, records: [], investTotal: 0, defenseTotal: 0 },
  resist: { items: [], log: {} },
  diary: [], weight: [], birthdays: [],
  genres: [
    { name: '国家試験勉強', color: '#5B3FA6' },
    { name: 'ウエイト', color: '#3A7A5A' },
    { name: '英語学習', color: '#1B2A4A' },
    { name: 'ストレッチ', color: '#C07030' },
    { name: '副業学習', color: '#B84040' },
    { name: 'ゴルフ', color: '#3A6080' },
    { name: '読書', color: '#7A3A6A' },
  ],
  genreGoals: {},
};

function getGenreColor(genres, name) {
  const g = (genres||[]).find(x => x.name === name);
  return g ? g.color : GOLD;
}

const st = {
  inp: { width: '100%', background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 4, padding: '8px 11px', color: '#111', fontSize: 13, outline: 'none', boxSizing: 'border-box' },
  btn: (bg, fg) => ({ background: bg || GOLD, border: 'none', borderRadius: 4, padding: '9px 18px', color: fg || '#fff', cursor: 'pointer', fontSize: 13 }),
  card: { background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 6, padding: '14px 16px', marginBottom: 10 },
  label: { fontSize: 10, letterSpacing: '0.15em', color: '#888', textTransform: 'uppercase', marginBottom: 8 },
  between: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
  grid2: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 },
};

const TABS = [
  { id: 'home', label: 'ホーム' },
  { id: 'schedule', label: 'スケジュール' },
  { id: 'todo', label: 'ToDo' },
  { id: 'goals', label: '目標' },
  { id: 'money', label: 'お金' },
  { id: 'weight', label: '体重' },
  { id: 'diary', label: '日記' },
];

const MOODS = ['😞','😕','😐','🙂','😊'];
const PCOLOR = { urgent: '#B84040', high: '#C07030', medium: '#8A7030', low: '#3A6080' };
const PLABEL = { urgent: '緊急', high: '高', medium: '中', low: '低' };

function today() { return new Date().toISOString().split('T')[0]; }
function todayLabel() { return new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' }); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtYen(n) { return '¥' + Math.round(n).toLocaleString(); }
function fmtMan(n) { return (n / 10000).toFixed(1) + '万'; }

// ── CONFIRM DIALOG ──
function ConfirmDialog({ message, onOk, onCancel }) {
  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 300 }}>
      <div style={{ background: '#fff', borderRadius: 10, padding: 24, width: '80%', maxWidth: 320 }}>
        <div style={{ fontSize: 14, color: '#111', marginBottom: 20, textAlign: 'center', lineHeight: 1.6 }}>{message}</div>
        <div style={{ display: 'flex', gap: 10 }}>
          <button onClick={onCancel} style={{ flex: 1, padding: 10, background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 4, color: '#555', cursor: 'pointer', fontSize: 13 }}>キャンセル</button>
          <button onClick={onOk} style={{ flex: 1, padding: 10, background: RED, border: 'none', borderRadius: 4, color: '#fff', cursor: 'pointer', fontSize: 13 }}>削除する</button>
        </div>
      </div>
    </div>
  );
}

function useConfirm() {
  const [state, setState] = useState(null);
  function confirm(message) {
    return new Promise(resolve => { setState({ message, resolve }); });
  }
  function Dialog() {
    if (!state) return null;
    return <ConfirmDialog message={state.message} onOk={() => { state.resolve(true); setState(null); }} onCancel={() => { state.resolve(false); setState(null); }} />;
  }
  return { confirm, Dialog };
}

// ── APP ──
function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState('home');
  const [unlocked, setUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const [setupPin, setSetupPin] = useState('');
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    async function init() {
      // Wait for Firebase
      if (!window._firebaseReady) {
        await new Promise(resolve => window.addEventListener('firebaseReady', resolve, { once: true }));
      }
      const d = await window._fbLoad();
      if (d && Object.keys(d).length > 0) {
        // migrate genres
        if (d.genres && d.genres.length > 0 && typeof d.genres[0] === 'string') {
          d.genres = d.genres.map((name, i) => ({ name, color: GENRE_COLORS[i % GENRE_COLORS.length] }));
        }
        setData({ ...DEFAULT, ...d });
      } else {
        // try localStorage backup
        try {
          const backup = localStorage.getItem('ameno_os_backup');
          if (backup) setData({ ...DEFAULT, ...JSON.parse(backup) });
          else setData(JSON.parse(JSON.stringify(DEFAULT)));
        } catch {
          setData(JSON.parse(JSON.stringify(DEFAULT)));
        }
      }
      setLoading(false);
    }
    init();
  }, []);

  const saveToFirebase = useCallback(async (newData) => {
    setSaving(true);
    await window._fbSave(newData);
    // also save to localStorage as backup
    try { localStorage.setItem('ameno_os_backup', JSON.stringify(newData)); } catch {}
    setSaving(false);
  }, []);

  function upd(fn) {
    setData(d => {
      const n = JSON.parse(JSON.stringify(d));
      fn(n);
      saveToFirebase(n);
      return n;
    });
  }

  if (loading) {
    return (
      <div style={{ background: NAVY, minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ fontSize: 10, letterSpacing: '0.25em', color: GOLD, marginBottom: 24 }}>飴野家 PERSONAL OS</div>
        <div style={{ width: 32, height: 32, borderRadius: '50%', border: `3px solid rgba(255,255,255,0.2)`, borderTopColor: GOLD, animation: 'spin 0.8s linear infinite' }} />
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
        <div style={{ fontSize: 12, color: 'rgba(255,255,255,0.4)', marginTop: 16 }}>データを読み込み中...</div>
      </div>
    );
  }

  if (!data.pin) {
    return (
      <div style={{ background: NAVY, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center', padding: 32 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.25em', color: GOLD, marginBottom: 6 }}>飴野家 PERSONAL OS</div>
          <div style={{ fontSize: 14, color: '#F5EDD8', marginBottom: 28 }}>PINコード（4桁）を設定</div>
          <PinDots count={setupPin.length} />
          <PinPad value={setupPin} onChange={setSetupPin} maxLen={4} />
          {setupPin.length === 4 && (
            <button onClick={() => { upd(d => { d.pin = setupPin; }); setUnlocked(true); }} style={{ ...st.btn(), marginTop: 16 }}>設定する</button>
          )}
        </div>
      </div>
    );
  }

  if (!unlocked) {
    const now = Date.now();
    const locked = lockUntil > now;
    return (
      <div style={{ background: NAVY, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center', padding: 32 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.25em', color: GOLD, marginBottom: 6 }}>飴野家 PERSONAL OS</div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 28 }}>{todayLabel()}</div>
          {locked ? <LockTimer lockUntil={lockUntil} /> : (
            <>
              <PinDots count={pinInput.length} />
              {pinError > 0 && <div style={{ color: '#E07070', fontSize: 12, marginBottom: 12 }}>PINが違います（{pinError}/3）</div>}
              <PinPad value={pinInput} onChange={v => {
                setPinInput(v);
                if (v.length === 4) {
                  if (v === data.pin) { setUnlocked(true); setPinInput(''); setPinError(0); }
                  else { const e = pinError + 1; setPinError(e); setPinInput(''); if (e >= 3) { setLockUntil(Date.now() + 30000); setPinError(0); } }
                }
              }} maxLen={4} />
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 480, margin: '0 auto', background: '#fff', minHeight: '100vh' }}>
      <div style={{ background: NAVY, padding: '14px 16px 10px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div>
            <div style={{ fontSize: 9, letterSpacing: '0.2em', color: GOLD, marginBottom: 3 }}>飴野家 PERSONAL OS</div>
            <div style={{ fontSize: 15, color: '#F5EDD8' }}>{todayLabel()}</div>
          </div>
          {saving && <div style={{ fontSize: 9, color: GOLD, opacity: 0.7 }}>保存中...</div>}
        </div>
      </div>
      <div className="tabs-row" style={{ background: NAVY, borderBottom: `2px solid rgba(184,149,90,0.3)`, position: 'sticky', top: 0, zIndex: 100 }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: '0 0 auto', padding: '10px 13px', background: 'none', border: 'none', borderBottom: tab === t.id ? `2px solid ${GOLD}` : '2px solid transparent', color: tab === t.id ? GOLD : 'rgba(245,237,216,0.5)', fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap' }}>
            {t.label}
          </button>
        ))}
      </div>
      <div style={{ padding: '16px 16px 80px', background: '#fff' }}>
        {tab === 'home' && <HomeTab data={data} upd={upd} />}
        {tab === 'schedule' && <ScheduleTab data={data} upd={upd} />}
        {tab === 'todo' && <TodoTab data={data} upd={upd} />}
        {tab === 'goals' && <GoalsTab data={data} upd={upd} />}
        {tab === 'money' && <MoneyTab data={data} upd={upd} />}
        {tab === 'weight' && <WeightTab data={data} upd={upd} />}
        {tab === 'diary' && <DiaryTab data={data} upd={upd} />}
      </div>
    </div>
  );
}

function PinDots({ count }) {
  return (
    <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 24 }}>
      {[0,1,2,3].map(i => <div key={i} style={{ width: 14, height: 14, borderRadius: '50%', background: count > i ? GOLD : 'rgba(255,255,255,0.2)' }} />)}
    </div>
  );
}

function PinPad({ value, onChange, maxLen }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 64px)', gap: 10, justifyContent: 'center' }}>
      {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((n, i) => (
        <button key={i} onClick={() => {
          if (n === '⌫') { onChange(value.slice(0,-1)); return; }
          if (n === '') return;
          if (value.length < maxLen) onChange(value + n);
        }} style={{ height: 54, background: n===''?'none':'rgba(255,255,255,0.1)', border: `1px solid ${n===''?'transparent':'rgba(255,255,255,0.2)'}`, borderRadius: 4, color: '#F5EDD8', fontSize: 18, cursor: n===''?'default':'pointer' }}>{n}</button>
      ))}
    </div>
  );
}

function LockTimer({ lockUntil }) {
  const [rem, setRem] = useState(Math.ceil((lockUntil - Date.now()) / 1000));
  useEffect(() => {
    const t = setInterval(() => { const r = Math.ceil((lockUntil - Date.now()) / 1000); setRem(r); if (r <= 0) clearInterval(t); }, 1000);
    return () => clearInterval(t);
  }, [lockUntil]);
  return <div style={{ color: '#E07070', fontSize: 13 }}>{rem}秒後に再試行できます</div>;
}

// ── RESERVE MODAL ──
function ReserveModal({ date, h, m, genres, existing, onSave, onClose, upd }) {
  const initGenre = existing ? existing.genre : (genres[0]?.name || '');
  const [title, setTitle] = useState(existing?.title || '');
  const [genre, setGenre] = useState(initGenre);
  const defEndH = (m+10)>=60 ? h+1 : h;
  const defEndM = (m+10)>=60 ? (m+10)-60 : m+10;
  const [end, setEnd] = useState(existing?.end || `${pad(defEndH)}:${pad(defEndM)}`);
  const [newGenre, setNewGenre] = useState('');
  const [newGenreColor, setNewGenreColor] = useState(GENRE_COLORS[0]);
  const [showAdd, setShowAdd] = useState(false);

  function addGenre() {
    if (!newGenre.trim()) return;
    upd(d => { if (!d.genres.find(g => g.name===newGenre.trim())) d.genres = [...d.genres, { name: newGenre.trim(), color: newGenreColor }]; });
    setGenre(newGenre.trim());
    setNewGenre('');
    setShowAdd(false);
  }

  const genreColor = getGenreColor(genres, genre);

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 200 }} onClick={onClose}>
      <div style={{ background: '#fff', borderRadius: '12px 12px 0 0', padding: 24, width: '100%', maxWidth: 480, paddingBottom: 40, maxHeight: '85vh', overflowY: 'auto' }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14, color: '#111' }}>{pad(h)}:{pad(m)} {existing?'(編集)':'に予約'}</div>
        <div style={{ fontSize: 10, color: '#888', marginBottom: 6 }}>ジャンル</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
          {genres.map(g => (
            <button key={g.name} onClick={() => setGenre(g.name)} style={{ padding: '5px 12px', background: genre===g.name?g.color:LIGHT, border: `1px solid ${genre===g.name?g.color:BORDER}`, borderRadius: 20, color: genre===g.name?'#fff':'#333', fontSize: 12, cursor: 'pointer' }}>{g.name}</button>
          ))}
          <button onClick={() => setShowAdd(!showAdd)} style={{ padding: '5px 12px', background: 'none', border: `1px dashed ${BORDER}`, borderRadius: 20, color: '#888', fontSize: 12, cursor: 'pointer' }}>＋ 追加</button>
        </div>
        {showAdd && (
          <div style={{ marginBottom: 10 }}>
            <div style={{ display: 'flex', gap: 6, marginBottom: 8 }}>
              <input value={newGenre} onChange={e => setNewGenre(e.target.value)} placeholder="新しいジャンル" style={{ ...st.inp, flex: 1 }} />
              <button onClick={addGenre} style={st.btn()}>追加</button>
            </div>
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
              {GENRE_COLORS.map(c => (
                <div key={c} onClick={() => setNewGenreColor(c)} style={{ width: 24, height: 24, borderRadius: '50%', background: c, border: `2px solid ${newGenreColor===c?'#111':BORDER}`, cursor: 'pointer' }} />
              ))}
            </div>
          </div>
        )}
        <div style={{ fontSize: 10, color: '#888', marginBottom: 4 }}>タイトル（任意）</div>
        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="例：読書、筋トレなど" style={{ ...st.inp, marginBottom: 10 }} />
        <div style={{ fontSize: 10, color: '#888', marginBottom: 4 }}>終了時間</div>
        <input type="time" value={end} onChange={e => setEnd(e.target.value)} style={{ ...st.inp, marginBottom: 16 }} />
        <button onClick={() => onSave({ title: title||genre, genre, start: `${pad(h)}:${pad(m)}`, end, color: genreColor })} style={{ ...st.btn(), width: '100%' }}>{existing?'更新する':'予約する'}</button>
      </div>
    </div>
  );
}

// ── HOME ──
function HomeTab({ data, upd }) {
  const [selDate, setSelDate] = useState(today());
  const [modal, setModal] = useState(null);
  const [editModal, setEditModal] = useState(null);
  const { confirm, Dialog } = useConfirm();

  const slots = [];
  for (let h = 0; h < 24; h++) for (let m = 0; m < 60; m += 10) slots.push({ h, m });
  const res = (data.schedule||[]).filter(s => s.date === selDate).sort((a,b) => a.start.localeCompare(b.start));
  const todos = (data.todos||[]).filter(t => !t.done).sort((a,b) => ({ urgent:0,high:1,medium:2,low:3 }[a.priority]||2) - ({ urgent:0,high:1,medium:2,low:3 }[b.priority]||2));

  function addDays(dateStr, n) {
    const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }
  const dt = new Date(selDate+'T00:00:00');
  const dow = ['日','月','火','水','木','金','土'][dt.getDay()];

  async function deleteRes(id) {
    const ok = await confirm('この予定を削除しますか？');
    if (ok) upd(d => { d.schedule = d.schedule.filter(x => x.id!==id); });
  }

  return (
    <div>
      <Dialog />
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 10 }}>
        <button onClick={() => setSelDate(d => addDays(d,-1))} style={{ ...st.btn(LIGHT,'#333'), padding: '6px 12px' }}>◀</button>
        <input type="date" value={selDate} onChange={e => setSelDate(e.target.value)} style={{ ...st.inp, flex: 1, textAlign: 'center' }} />
        <button onClick={() => setSelDate(d => addDays(d,1))} style={{ ...st.btn(LIGHT,'#333'), padding: '6px 12px' }}>▶</button>
      </div>
      <div style={{ fontSize: 12, color: '#555', marginBottom: 10, textAlign: 'center' }}>
        {selDate}（{dow}）
        {selDate !== today() && <button onClick={() => setSelDate(today())} style={{ marginLeft: 8, fontSize: 11, background: 'none', border: `1px solid ${BORDER}`, borderRadius: 3, padding: '2px 8px', cursor: 'pointer', color: '#888' }}>今日</button>}
      </div>
      <div style={{ ...st.between, marginBottom: 6 }}>
        <div style={st.label}>スケジュール</div>
        <button onClick={() => setModal({ h: 9, m: 0 })} style={{ ...st.btn(), fontSize: 11, padding: '5px 12px' }}>+ 追加</button>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6,1fr)', gap: 2, marginBottom: 12 }}>
        {slots.map(({ h, m }) => {
          const key = `${pad(h)}:${pad(m)}`;
          const item = res.find(s => s.start === key);
          return (
            <div key={key} onClick={() => item ? setEditModal(item) : setModal({ h, m })}
              style={{ padding: '4px 1px', borderRadius: 3, display: 'flex', flexDirection: 'column', alignItems: 'center', minHeight: 34, cursor: 'pointer', background: item ? (item.color||GOLD)+'22' : LIGHT, border: `1px solid ${item?(item.color||GOLD):BORDER}` }}>
              <span style={{ fontSize: 7, color: '#888' }}>{key}</span>
              {item && <span style={{ fontSize: 7, fontWeight: 700, color: item.color||GOLD, marginTop: 1, textAlign: 'center', lineHeight: 1.1, wordBreak: 'break-all' }}>{item.genre||item.title}</span>}
            </div>
          );
        })}
      </div>
      {res.length > 0 && res.map(s => (
        <div key={s.id} style={{ ...st.card, borderLeft: `4px solid ${s.color||GOLD}`, padding: '10px 14px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, color: '#888' }}>{s.start}{s.end?' — '+s.end:''}</div>
            <div style={{ fontSize: 13, color: '#111' }}>{s.title}</div>
            {s.genre && <span style={{ fontSize: 10, background: (s.color||GOLD)+'22', color: s.color||GOLD, borderRadius: 3, padding: '1px 6px' }}>{s.genre}</span>}
          </div>
          <button onClick={() => setEditModal(s)} style={{ background: 'none', border: 'none', color: '#aaa', cursor: 'pointer', fontSize: 13 }}>✏️</button>
          <button onClick={() => deleteRes(s.id)} style={{ background: 'none', border: 'none', color: '#aaa', cursor: 'pointer', fontSize: 16 }}>×</button>
        </div>
      ))}
      <div style={{ ...st.label, marginTop: 14 }}>今日のToDo</div>
      {todos.length===0 && <div style={{ fontSize: 12, color: '#aaa' }}>タスクなし</div>}
      {todos.slice(0,6).map(t => {
        const pc = PCOLOR[t.priority]||PCOLOR.medium;
        return (
          <div key={t.id} style={{ ...st.card, borderLeft: `3px solid ${pc}`, padding: '10px 14px', marginBottom: 7, display: 'flex', alignItems: 'center', gap: 10 }}>
            <CheckCircle done={t.done} onClick={() => upd(d => { d.todos = d.todos.map(x => x.id===t.id?{...x,done:!x.done}:x); })} />
            <div style={{ flex: 1, fontSize: 13, color: '#111' }}>{t.text}</div>
            <span style={{ fontSize: 10, color: pc, border: `1px solid ${pc}40`, borderRadius: 2, padding: '1px 5px' }}>{PLABEL[t.priority]}</span>
          </div>
        );
      })}
      {modal && <ReserveModal date={selDate} h={modal.h} m={modal.m} genres={data.genres||[]} onSave={form => { upd(d => { d.schedule = [...d.schedule, { id: Date.now(), date: selDate, ...form }]; }); setModal(null); }} onClose={() => setModal(null)} upd={upd} />}
      {editModal && <ReserveModal date={selDate} h={parseInt(editModal.start.split(':')[0])} m={parseInt(editModal.start.split(':')[1])} genres={data.genres||[]} existing={editModal} onSave={form => { upd(d => { d.schedule = d.schedule.map(x => x.id===editModal.id?{...x,...form}:x); }); setEditModal(null); }} onClose={() => setEditModal(null)} upd={upd} />}
    </div>
  );
}

// ── SCHEDULE ──
function ScheduleTab({ data, upd }) {
  const [viewYM, setViewYM] = useState(today().slice(0,7));
  const [selDate, setSelDate] = useState(null);
  const [weekOffset, setWeekOffset] = useState(0);
  const [editGoal, setEditGoal] = useState(false);
  const [goalInputs, setGoalInputs] = useState({});
  const [showGenreEdit, setShowGenreEdit] = useState(false);
  const { confirm: confirmDel, Dialog: DelDialog } = useConfirm();

  const [year, month] = viewYM.split('-').map(Number);
  const firstDay = new Date(year, month-1, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(year, month, 0).getDate();
  const weeks = [];
  let week = Array(startDow).fill(null);
  for (let d = 1; d <= daysInMonth; d++) {
    week.push(d);
    if (week.length===7) { weeks.push(week); week=[]; }
  }
  if (week.length>0) { while(week.length<7) week.push(null); weeks.push(week); }

  function getWeekDates(offset) {
    const now = new Date(); const dow = now.getDay(); const diff = dow===0?-6:1-dow;
    const monday = new Date(now); monday.setDate(now.getDate()+diff+offset*7);
    return Array.from({length:7},(_,i)=>{ const d=new Date(monday); d.setDate(monday.getDate()+i); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; });
  }
  const weekDates = getWeekDates(weekOffset);
  const weekSchedule = (data.schedule||[]).filter(s => weekDates.includes(s.date));
  const genres = data.genres||[];
  const genreGoals = data.genreGoals||{};
  const genreTotals = {};
  genres.forEach(g => { genreTotals[g.name]=0; });
  weekSchedule.forEach(s => { if(s.genre) genreTotals[s.genre]=(genreTotals[s.genre]||0)+10; });
  const activeGenres = genres.filter(g => genreTotals[g.name]>0||genreGoals[g.name]);
  const totalMins = Object.values(genreTotals).reduce((s,v)=>s+v,0);

  let pieAngle=0;
  const pieSlices = genres.filter(g=>genreTotals[g.name]>0).map(g => {
    const pct=genreTotals[g.name]/totalMins; const start=pieAngle; pieAngle+=pct*360;
    return {name:g.name,color:g.color,pct,start,end:pieAngle};
  });
  function polarToXY(cx,cy,r,deg){const rad=(deg-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}
  function pieArc(cx,cy,r,start,end){const s=polarToXY(cx,cy,r,start);const e=polarToXY(cx,cy,r,end);const large=end-start>180?1:0;return `M ${cx} ${cy} L ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} Z`;}

  const W=300,H=120;
  const maxVal=Math.max(...activeGenres.map(g=>Math.max((genreTotals[g.name]||0)/60,genreGoals[g.name]||0)),1);

  const selDateStr = selDate ? `${year}-${pad(month)}-${pad(selDate)}` : null;
  const selItems = selDateStr ? (data.schedule||[]).filter(s=>s.date===selDateStr) : [];
  const selBdays = selDateStr ? (data.birthdays||[]).filter(b=>{ const bp=b.date.split('-'); return bp.length===2&&bp[0]===pad(month)&&bp[1]===pad(selDate); }) : [];

  return (
    <div>
      <DelDialog />
      <div style={st.label}>月間カレンダー</div>
      <div style={{ display:'flex',gap:8,alignItems:'center',marginBottom:12 }}>
        <button onClick={()=>{const d=new Date(year,month-2,1);setViewYM(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);}} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>◀</button>
        <div style={{flex:1,textAlign:'center',fontSize:14,fontWeight:'bold',color:'#111'}}>{year}年{month}月</div>
        <button onClick={()=>{const d=new Date(year,month,1);setViewYM(`${d.getFullYear()}-${pad(d.getMonth()+1)}`);}} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>▶</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:4}}>
        {['日','月','火','水','木','金','土'].map((d,i)=><div key={d} style={{textAlign:'center',fontSize:10,color:i===0?RED:i===6?'#3A6080':'#888',padding:'4px 0'}}>{d}</div>)}
      </div>
      <div style={{marginBottom:16}}>
        {weeks.map((wk,wi)=>(
          <div key={wi} style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:2,marginBottom:2}}>
            {wk.map((d,di)=>{
              if(!d) return <div key={di}/>;
              const dateStr=`${year}-${pad(month)}-${pad(d)}`;
              const hasSched=(data.schedule||[]).some(s=>s.date===dateStr);
              const hasBday=(data.birthdays||[]).some(b=>{const bp=b.date.split('-');return bp.length===2&&bp[0]===pad(month)&&bp[1]===pad(d);});
              const isToday=dateStr===today(); const isSel=selDate===d;
              return(
                <div key={di} onClick={()=>setSelDate(isSel?null:d)} style={{textAlign:'center',padding:'6px 2px',borderRadius:4,cursor:'pointer',background:isSel?GOLD:isToday?'#FBF7EE':'#fff',border:`1px solid ${isSel?GOLD:isToday?GOLD+'60':BORDER}`}}>
                  <div style={{fontSize:12,color:isSel?'#fff':di===0?RED:di===6?'#3A6080':'#111',fontWeight:isToday?'bold':'normal'}}>{d}</div>
                  <div style={{display:'flex',gap:2,justifyContent:'center',marginTop:2}}>
                    {hasSched&&<div style={{width:5,height:5,borderRadius:'50%',background:isSel?'#fff':GOLD}}/>}
                    {hasBday&&<div style={{width:5,height:5,borderRadius:'50%',background:isSel?'#fff':RED}}/>}
                  </div>
                </div>
              );
            })}
          </div>
        ))}
      </div>
      {selDate&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:'bold',color:'#111',marginBottom:10}}>{year}年{month}月{selDate}日</div>
          {selBdays.map(b=>(
            <div key={b.id} style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,padding:'6px 10px',background:'#FFF0F0',borderRadius:4}}>
              <span style={{fontSize:16}}>🎂</span><span style={{fontSize:13,color:'#111'}}>{b.name} の誕生日</span>
            </div>
          ))}
          {selItems.length===0&&selBdays.length===0&&<div style={{fontSize:12,color:'#aaa'}}>予定なし</div>}
          {selItems.map(s=>(
            <div key={s.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:(s.color||GOLD)+'15',borderRadius:4,border:`1px solid ${s.color||GOLD}40`,marginBottom:6}}>
              <div style={{width:4,height:32,background:s.color||GOLD,borderRadius:2}}/>
              <div style={{flex:1}}>
                <div style={{fontSize:11,color:'#888'}}>{s.start}{s.end?' — '+s.end:''}</div>
                <div style={{fontSize:13,color:'#111'}}>{s.title}</div>
                {s.genre&&<span style={{fontSize:10,color:s.color||GOLD}}>{s.genre}</span>}
              </div>
            </div>
          ))}
        </div>
      )}

      <div style={{...st.between,marginBottom:10}}>
        <div style={st.label}>ジャンル管理</div>
        <button onClick={()=>setShowGenreEdit(!showGenreEdit)} style={{...st.btn(LIGHT,'#333'),padding:'5px 10px',fontSize:11}}>{showGenreEdit?'閉じる':'編集'}</button>
      </div>
      {showGenreEdit&&(
        <div style={{...st.card,marginBottom:14}}>
          {genres.map(g=>(
            <div key={g.name} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style={{width:16,height:16,borderRadius:'50%',background:g.color,flexShrink:0}}/>
              <div style={{flex:1,fontSize:13,color:'#111'}}>{g.name}</div>
              <button onClick={async()=>{const ok=await confirmDel(`ジャンル「${g.name}」を削除しますか？`);if(ok)upd(d=>{d.genres=d.genres.filter(x=>x.name!==g.name);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:14}}>×</button>
            </div>
          ))}
          <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:10,marginTop:6}}>
            <AddGenreForm genres={genres} upd={upd}/>
          </div>
        </div>
      )}

      <div style={st.label}>週間サマリー</div>
      <div style={{display:'flex',gap:8,marginBottom:14,alignItems:'center'}}>
        <button onClick={()=>setWeekOffset(w=>w-1)} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>◀</button>
        <div style={{flex:1,textAlign:'center',fontSize:12,color:'#333'}}>{weekDates[0].slice(5).replace('-','/')} 〜 {weekDates[6].slice(5).replace('-','/')}</div>
        <button onClick={()=>setWeekOffset(w=>w+1)} style={{...st.btn(LIGHT,'#333'),padding:'6px 12px'}}>▶</button>
      </div>

      {totalMins>0&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>時間配分</div>
          <div style={{display:'flex',alignItems:'center',gap:16}}>
            <svg width="90" height="90" viewBox="0 0 90 90">
              {pieSlices.map((s,i)=><path key={i} d={pieArc(45,45,40,s.start,s.end)} fill={s.color}/>)}
            </svg>
            <div style={{flex:1}}>
              {pieSlices.map(s=>(
                <div key={s.name} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                  <div style={{width:10,height:10,borderRadius:2,background:s.color,flexShrink:0}}/>
                  <span style={{fontSize:11,color:'#333'}}>{s.name}</span>
                  <span style={{fontSize:11,color:'#888',marginLeft:'auto'}}>{(genreTotals[s.name]/60).toFixed(1)}h ({Math.round(s.pct*100)}%)</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {activeGenres.length>0&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>目標vs実績（時間）</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H+30}`} style={{overflow:'visible'}}>
            {activeGenres.map((g,i)=>{
              const x=20+i*((W-30)/activeGenres.length)+2;
              const bw=Math.min(26,(W-30)/activeGenres.length/2-4);
              const actualH=((genreTotals[g.name]||0)/60/maxVal)*H;
              const goalH=((genreGoals[g.name]||0)/maxVal)*H;
              const label=g.name.length>4?g.name.slice(0,4):g.name;
              return(
                <g key={g.name}>
                  {goalH>0&&<rect x={x} y={H-goalH} width={bw} height={goalH} fill="#C0D4F0" rx="2"/>}
                  <rect x={x+(goalH>0?bw+2:0)} y={H-actualH} width={bw} height={actualH} fill={g.color} rx="2"/>
                  <text x={x+bw/2} y={H+14} textAnchor="middle" fontSize="8" fill="#666">{label}</text>
                  {actualH>0&&<text x={x+(goalH>0?bw+2:0)+bw/2} y={H-actualH-3} textAnchor="middle" fontSize="8" fill={g.color}>{((genreTotals[g.name]||0)/60).toFixed(1)}</text>}
                </g>
              );
            })}
            <line x1="18" y1="0" x2="18" y2={H} stroke="#ddd" strokeWidth="1"/>
            <line x1="18" y1={H} x2={W} y2={H} stroke="#ddd" strokeWidth="1"/>
          </svg>
        </div>
      )}

      <div style={{...st.between,marginBottom:10}}>
        <div style={st.label}>目標時間（時間/週）</div>
        <button onClick={()=>{setGoalInputs({...genreGoals});setEditGoal(!editGoal);}} style={{...st.btn(LIGHT,'#333'),padding:'5px 10px',fontSize:11}}>{editGoal?'キャンセル':'編集'}</button>
      </div>
      {editGoal?(
        <div style={{...st.card,marginBottom:14}}>
          {genres.map(g=>(
            <div key={g.name} style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <div style={{width:12,height:12,borderRadius:'50%',background:g.color,flexShrink:0}}/>
              <div style={{flex:1,fontSize:13,color:'#111'}}>{g.name}</div>
              <input type="number" value={goalInputs[g.name]||''} onChange={e=>setGoalInputs(gi=>({...gi,[g.name]:parseFloat(e.target.value)||0}))} placeholder="0" style={{...st.inp,width:70,textAlign:'center'}}/>
              <span style={{fontSize:11,color:'#888'}}>h</span>
            </div>
          ))}
          <button onClick={()=>{upd(d=>{d.genreGoals={...goalInputs};});setEditGoal(false);}} style={{...st.btn(),width:'100%'}}>保存</button>
        </div>
      ):(
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
          {genres.filter(g=>genreGoals[g.name]).map(g=>(
            <div key={g.name} style={{background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:6,padding:'6px 12px',fontSize:12}}>
              <span style={{color:'#333'}}>{g.name}</span>
              <span style={{color:g.color,marginLeft:6,fontWeight:700}}>{((genreTotals[g.name]||0)/60).toFixed(1)}h / {genreGoals[g.name]}h</span>
            </div>
          ))}
          {genres.filter(g=>genreGoals[g.name]).length===0&&<div style={{fontSize:12,color:'#aaa'}}>「編集」から目標時間を設定してください</div>}
        </div>
      )}
    </div>
  );
}

}

// ── TODO ──
function TodoTab({ data, upd }) {
  const [filter, setFilter] = useState('active');
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({ text:'', priority:'medium', deadline:'', repeat:'' });
  const { confirm, Dialog } = useConfirm();

  function saveTodo() {
    if (!form.text.trim()) return;
    if (editId) upd(d=>{d.todos=d.todos.map(x=>x.id===editId?{...x,...form}:x);});
    else upd(d=>{d.todos=[...d.todos,{id:Date.now(),...form,done:false}];});
    setForm({text:'',priority:'medium',deadline:'',repeat:''});
    setShowForm(false); setEditId(null);
  }

  const todos = (data.todos||[]).filter(t=>filter==='done'?t.done:!t.done).sort((a,b)=>({urgent:0,high:1,medium:2,low:3}[a.priority]||2)-({urgent:0,high:1,medium:2,low:3}[b.priority]||2));

  return (
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>タスク管理</div>
        <button onClick={()=>{setForm({text:'',priority:'medium',deadline:'',repeat:''});setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>
      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:12}}>
          <input value={form.text} onChange={e=>setForm(f=>({...f,text:e.target.value}))} placeholder="タスク内容" style={{...st.inp,marginBottom:8}}/>
          <div style={{...st.grid2,marginBottom:8}}>
            <select value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))} style={st.inp}>
              <option value="urgent">緊急</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option>
            </select>
            <input type="date" value={form.deadline} onChange={e=>setForm(f=>({...f,deadline:e.target.value}))} style={st.inp}/>
          </div>
          <select value={form.repeat} onChange={e=>setForm(f=>({...f,repeat:e.target.value}))} style={{...st.inp,marginBottom:10}}>
            <option value="">繰り返しなし</option><option value="daily">毎日</option><option value="weekly">毎週</option><option value="monthly">毎月</option>
          </select>
          <button onClick={saveTodo} style={st.btn()}>{editId?'更新':'保存'}</button>
        </div>
      )}
      <div style={{display:'flex',gap:6,marginBottom:12}}>
        {[['active','未完了'],['done','完了']].map(([k,l])=>(
          <button key={k} onClick={()=>setFilter(k)} style={{padding:'5px 12px',background:filter===k?GOLD:'#fff',border:`1px solid ${filter===k?GOLD:BORDER}`,borderRadius:3,color:filter===k?'#fff':'#555',fontSize:11,cursor:'pointer'}}>{l}</button>
        ))}
      </div>
      {todos.length===0&&<div style={{fontSize:12,color:'#aaa'}}>タスクなし</div>}
      {todos.map(t=>{
        const pc=PCOLOR[t.priority]||PCOLOR.medium;
        const overdue=t.deadline&&t.deadline<today()&&!t.done;
        return(
          <div key={t.id} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'11px 14px',marginBottom:8,background:'#fff',border:`1px solid ${BORDER}`,borderLeft:`3px solid ${pc}`,borderRadius:4}}>
            <CheckCircle done={t.done} onClick={()=>upd(d=>{d.todos=d.todos.map(x=>x.id===t.id?{...x,done:!x.done}:x);})}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,color:t.done?'#aaa':'#111',textDecoration:t.done?'line-through':'none'}}>{t.text}</div>
              <div style={{display:'flex',gap:6,marginTop:4,flexWrap:'wrap'}}>
                <span style={{fontSize:10,color:pc,border:`1px solid ${pc}40`,borderRadius:2,padding:'1px 5px'}}>{PLABEL[t.priority]}</span>
                {t.deadline&&<span style={{fontSize:10,color:overdue?RED:'#888'}}>{t.deadline}</span>}
                {t.repeat&&<span style={{fontSize:10,color:'#888'}}>{{daily:'毎日',weekly:'毎週',monthly:'毎月'}[t.repeat]}</span>}
              </div>
            </div>
            <button onClick={()=>{setForm({text:t.text,priority:t.priority,deadline:t.deadline||'',repeat:t.repeat||''});setEditId(t.id);setShowForm(true);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
            <button onClick={async()=>{const ok=await confirm('このタスクを削除しますか？');if(ok)upd(d=>{d.todos=d.todos.filter(x=>x.id!==t.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
          </div>
        );
      })}
    </div>
  );
}

// ── GOALS ──
function GoalsTab({ data, upd }) {
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const [form, setForm] = useState({title:'',current:'',target:'',unit:'',deadline:'',steps:''});
  const { confirm, Dialog } = useConfirm();

  function saveGoal() {
    if (!form.title) return;
    const steps=form.steps.split('\n').filter(s=>s.trim()).map(s=>({text:s.trim(),done:false}));
    if(editId) upd(d=>{d.goals=d.goals.map(x=>x.id===editId?{...x,title:form.title,current:parseFloat(form.current)||0,target:parseFloat(form.target)||100,unit:form.unit,deadline:form.deadline,steps}:x);});
    else upd(d=>{d.goals=[...(d.goals||[]),{id:Date.now(),title:form.title,current:parseFloat(form.current)||0,target:parseFloat(form.target)||100,unit:form.unit,deadline:form.deadline,steps}];});
    setForm({title:'',current:'',target:'',unit:'',deadline:'',steps:''});
    setShowForm(false); setEditId(null);
  }

  return (
    <div>
      <Dialog/>

            <input type="number" value={form.target} onChange={e=>setForm(f=>({...f,target:e.target.value}))} placeholder="目標値" style={st.inp}/>
          </div>
          <div style={{...st.grid2,marginBottom:8}}>
            <input value={form.unit} onChange={e=>setForm(f=>({...f,unit:e.target.value}))} placeholder="単位（点・kgなど）" style={st.inp}/>
            <input type="date" value={form.deadline} onChange={e=>setForm(f=>({...f,deadline:e.target.value}))} style={st.inp}/>
          </div>
          <textarea value={form.steps} onChange={e=>setForm(f=>({...f,steps:e.target.value}))} placeholder="ステップ（改行区切り）" rows={3} style={{...st.inp,resize:'vertical',marginBottom:10}}/>
          <button onClick={saveGoal} style={st.btn()}>{editId?'更新':'保存'}</button>
        </div>
      )}

      {(data.goals||[]).map(g=>{
        const prog=g.target>0?Math.min(100,Math.round((g.current/g.target)*100)):0;
        return(
          <div key={g.id} style={{...st.card,marginBottom:10}}>
            <div style={st.between}>
              <div style={{fontSize:14,color:'#111',fontWeight:'bold'}}>{g.title}</div>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>{setForm({title:g.title,current:String(g.current),target:String(g.target),unit:g.unit||'',deadline:g.deadline||'',steps:(g.steps||[]).map(s=>s.text).join('\n')});setEditId(g.id);setShowForm(true);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
                <button onClick={async()=>{const ok=await confirm('この目標を削除しますか？');if(ok)upd(d=>{d.goals=d.goals.filter(x=>x.id!==g.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
              </div>
            </div>
            {g.deadline&&<div style={{fontSize:11,color:'#888',marginTop:4}}>期限: {g.deadline}</div>}
            <div style={{display:'flex',alignItems:'center',gap:8,margin:'8px 0'}}>
              <div style={{flex:1,height:6,background:'#eee',borderRadius:3,overflow:'hidden'}}>
                <div style={{width:prog+'%',height:'100%',background:prog>=100?GREEN:GOLD,borderRadius:3}}/>
              </div>
              <div style={{fontSize:12,color:GOLD,minWidth:36,textAlign:'right'}}>{prog}%</div>
            </div>
            <div style={{fontSize:12,color:'#333'}}>{g.current}{g.unit} / {g.target}{g.unit}</div>
            <div style={{display:'flex',gap:6,marginTop:8}}>
              <input type="number" id={`gu-${g.id}`} placeholder="現在値を更新" style={{...st.inp,flex:1,fontSize:12}}/>
              <button onClick={()=>{const v=parseFloat(document.getElementById(`gu-${g.id}`)?.value);if(!isNaN(v))upd(d=>{d.goals=d.goals.map(x=>x.id===g.id?{...x,current:v}:x);});}} style={{...st.btn(),fontSize:11,padding:'8px 12px'}}>更新</button>
            </div>
            {g.steps&&g.steps.length>0&&(
              <div style={{marginTop:10,borderTop:`1px solid ${BORDER}`,paddingTop:8}}>
                <div style={{fontSize:9,color:'#888',marginBottom:6}}>STEPS</div>
                {g.steps.map((s2,si)=>(
                  <div key={si} style={{display:'flex',alignItems:'center',gap:8,marginBottom:5}}>
                    <CheckCircle done={s2.done} onClick={()=>upd(d=>{const g2=d.goals.find(x=>x.id===g.id);if(g2)g2.steps[si].done=!g2.steps[si].done;})}/>
                    <div style={{fontSize:12,color:s2.done?'#aaa':'#111',textDecoration:s2.done?'line-through':'none'}}>{s2.text}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── MONEY ──
function MoneyTab({ data, upd }) {
  const [viewMonth, setViewMonth] = useState(today().slice(0,7));
  const [showForm, setShowForm] = useState(false);
  const [editRecord, setEditRecord] = useState(null);
  const [showResist, setShowResist] = useState(false);
  const [showAll, setShowAll] = useState(false);
  const [form, setForm] = useState({date:today(),type:'expense',amount:'',category:'',note:''});
  const [resistForm, setResistForm] = useState({name:'',price:''});
  const { confirm, Dialog } = useConfirm();

  function saveRecord() {
    const amount=parseInt(form.amount);
    if(!amount||isNaN(amount)) return;
    if(editRecord) upd(d=>{d.finance.records=d.finance.records.map(x=>x.id===editRecord?{...x,...form,amount}:x);});
    else upd(d=>{d.finance.records=[{id:Date.now(),...form,amount},...d.finance.records];});
    setForm({date:today(),type:'expense',amount:'',category:'',note:''});
    setShowForm(false); setEditRecord(null);
  }

  const recs=(data.finance.records||[]).filter(r=>r.date&&r.date.startsWith(viewMonth));
  const totalIncome=recs.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const totalExpense=recs.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  const balance=totalIncome-totalExpense;
  const defProg=Math.min(100,Math.round(((data.finance.defenseTotal||0)/500000)*100));
  const invProg=Math.min(100,Math.round(((data.finance.investTotal||0)/1500000)*100));
  const fireMonths=7*12,fireRate=0.07/12;
  let projected=data.finance.investTotal||0;
  for(let i=0;i<fireMonths;i++) projected=projected*(1+fireRate)+(data.finance.investment||0);
  projected=Math.round(projected/10000);

  const items=data.resist?.items||[];
  const log=data.resist?.log||{};
  const td=today();
  let totalSaved=0;
  Object.values(log).forEach(dl=>Object.entries(dl).forEach(([id,sv])=>{if(sv)totalSaved+=(items.find(i=>i.id==id)||{price:0}).price;}));
  const future10=Math.round(totalSaved*Math.pow(1.07,10));

  // expense pie
  const catTotals={};
  recs.filter(r=>r.type==='expense').forEach(r=>{const cat=r.category||'未分類';catTotals[cat]=(catTotals[cat]||0)+r.amount;});
  const catEntries=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  let pieA=0;
  const catPieSlices=catEntries.map(([cat,amt],i)=>{const pct=amt/totalExpense;const start=pieA;pieA+=pct*360;return{cat,amt,pct,start,end:pieA,color:GENRE_COLORS[i%GENRE_COLORS.length]};});
  function polarToXY(cx,cy,r,deg){const rad=(deg-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};}
  function pieArc(cx,cy,r,start,end){const s=polarToXY(cx,cy,r,start);const e=polarToXY(cx,cy,r,end);const large=end-start>180?1:0;return `M ${cx} ${cy} L ${s.x} ${s.y} A ${r} ${r} 0 ${large} 1 ${e.x} ${e.y} Z`;}

  const displayRecs=showAll?recs:recs.slice(0,5);

  return (
    <div>
      <Dialog/>
      <div style={st.label}>収支管理</div>
      <div style={{display:'flex',gap:8,marginBottom:12,alignItems:'center'}}>
        <input type="month" value={viewMonth} onChange={e=>setViewMonth(e.target.value)} style={{...st.inp,flex:1}}/>
        <button onClick={()=>{setForm({date:today(),type:'expense',amount:'',category:'',note:''});setEditRecord(null);setShowForm(!showForm);}} style={st.btn()}>+ 追加</button>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:14}}>
        {[{l:'収入',v:totalIncome,c:GREEN},{l:'支出',v:totalExpense,c:RED},{l:'収支',v:balance,c:balance>=0?GOLD:RED}].map(x=>(
          <div key={x.l} style={{background:LIGHT,border:`1px solid ${BORDER}`,borderRadius:6,padding:'12px',textAlign:'center'}}>
            <div style={{fontSize:9,color:'#888',marginBottom:4}}>{x.l}</div>
            <div style={{fontSize:13,color:x.c,fontWeight:'bold'}}>{fmtYen(x.v)}</div>
          </div>
        ))}
      </div>

      {catPieSlices.length>0&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>支出の内訳</div>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <svg width="90" height="90" viewBox="0 0 90 90">
              {catPieSlices.map((s,i)=><path key={i} d={pieArc(45,45,40,s.start,s.end)} fill={s.color}/>)}
            </svg>
            <div style={{flex:1}}>
              {catPieSlices.map(s=>(
                <div key={s.cat} style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                  <div style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/>
                  <span style={{fontSize:11,color:'#333',flex:1}}>{s.cat}</span>
                  <span style={{fontSize:11,color:'#888'}}>{fmtYen(s.amt)} ({Math.round(s.pct*100)}%)</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:12}}>
          <div style={{...st.grid2,marginBottom:8}}>
            <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/>
            <select value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))} style={st.inp}>
              <option value="expense">支出</option><option value="income">収入</option>
            </select>
          </div>
          <input type="number" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="金額（円）" style={{...st.inp,marginBottom:8}}/>
          <input value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} placeholder="ジャンル（食費・副業など）" style={{...st.inp,marginBottom:8}}/>
          <input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} placeholder="メモ" style={{...st.inp,marginBottom:10}}/>
          <button onClick={saveRecord} style={st.btn()}>{editRecord?'更新':'保存'}</button>
        </div>
      )}

      {recs.length===0&&<div style={{fontSize:12,color:'#aaa',marginBottom:12}}>この月の記録なし</div>}
      {displayRecs.map(r=>(
        <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,padding:'11px 14px',marginBottom:7,background:'#fff',border:`1px solid ${BORDER}`,borderLeft:`3px solid ${r.type==='income'?GREEN:RED}`,borderRadius:4}}>
          <div style={{flex:1}}>
            <div style={{fontSize:13,color:'#111'}}>{r.category||''} {r.note&&<span style={{fontSize:11,color:'#888'}}>— {r.note}</span>}</div>
            <div style={{fontSize:10,color:'#888'}}>{r.date}</div>
          </div>
          <div style={{fontSize:13,color:r.type==='income'?GREEN:RED,fontWeight:'bold',whiteSpace:'nowrap'}}>{r.type==='income'?'+':'-'}{fmtYen(r.amount)}</div>
          <button onClick={()=>{setForm({date:r.date,type:r.type,amount:String(r.amount),category:r.category||'',note:r.note||''});setEditRecord(r.id);setShowForm(true);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
          <button onClick={async()=>{const ok=await confirm('この記録を削除しますか？');if(ok)upd(d=>{d.finance.records=d.finance.records.filter(x=>x.id!==r.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
        </div>
      ))}
      {recs.length>5&&(
        <button onClick={()=>setShowAll(!showAll)} style={{...st.btn(LIGHT,'#555'),width:'100%',marginBottom:14,fontSize:12}}>
          {showAll?'閉じる':`もっと見る（残り${recs.length-5}件）`}
        </button>
      )}

      <div style={{borderTop:`1px solid ${BORDER}`,marginTop:16,paddingTop:16}}>
        <div style={st.label}>積立状況</div>
        <div style={{...st.card,marginBottom:10}}>
          <div style={st.between}><div style={{fontSize:12,color:'#333'}}>投資時価残高（目標150万）</div><div style={{fontSize:13,color:GOLD,fontWeight:'bold'}}>{fmtYen(data.finance.investTotal||0)}</div></div>
          <ProgressBar value={invProg} color={GOLD}/>
          <div style={{display:'flex',gap:6,marginTop:8}}>
            <input type="number" id="invest-upd" placeholder="時価残高を入力" style={{...st.inp,flex:1,fontSize:12}}/>
            <button onClick={()=>{const v=parseFloat(document.getElementById('invest-upd')?.value);if(!isNaN(v))upd(d=>{d.finance.investTotal=v;});}} style={{...st.btn(),fontSize:11,padding:'8px 12px'}}>更新</button>
          </div>
        </div>
        <div style={{...st.card,marginBottom:14}}>
          <div style={st.between}><div style={{fontSize:12,color:'#333'}}>生活防衛費（目標50万）</div><div style={{fontSize:13,color:NAVY,fontWeight:'bold'}}>{fmtYen(data.finance.defenseTotal||0)}</div></div>
          <ProgressBar value={defProg} color={NAVY}/>
          <div style={{display:'flex',gap:6,marginTop:8}}>
            <input type="number" id="defense-upd" placeholder="累計防衛費を入力" style={{...st.inp,flex:1,fontSize:12}}/>
            <button onClick={()=>{const v=parseFloat(document.getElementById('defense-upd')?.value);if(!isNaN(v))upd(d=>{d.finance.defenseTotal=v;});}} style={{...st.btn(),fontSize:11,padding:'8px 12px'}}>更新</button>
          </div>
        </div>
        <div style={st.label}>FIREシミュレーション</div>
        <div style={{...st.card,background:'#FBF7EE',border:`1px solid ${GOLD}50`,marginBottom:16}}>
          <div style={{fontSize:10,color:'#888',marginBottom:4}}>30歳時点の予測資産（年利7%）</div>
          <div style={{fontSize:24,color:GOLD,fontWeight:'bold'}}>{projected.toLocaleString()}<span style={{fontSize:13,color:'#888'}}>万円</span></div>
          <div style={{display:'flex',gap:6,marginTop:10}}>
            <input type="number" id="inv-monthly" placeholder="月次投資額" style={{...st.inp,flex:1,fontSize:12}} defaultValue={data.finance.investment||''}/>
            <button onClick={()=>{const v=parseInt(document.getElementById('inv-monthly')?.value);if(!isNaN(v))upd(d=>{d.finance.investment=v;});}} style={{...st.btn(),fontSize:11,padding:'8px 12px'}}>設定</button>
          </div>
        </div>
      </div>

      <div style={{borderTop:`1px solid ${BORDER}`,paddingTop:16}}>
        <div style={{...st.between,marginBottom:10}}>
          <div style={st.label}>我慢リスト</div>
          <button onClick={()=>setShowResist(!showResist)} style={st.btn()}>+ 追加</button>
        </div>
        <div style={{...st.card,background:'#FBF7EE',border:`1px solid ${GOLD}50`,marginBottom:12}}>
          <div style={{fontSize:10,color:'#888'}}>累計節約額</div>
          <div style={{fontSize:22,color:GOLD,fontWeight:'bold'}}>{fmtYen(totalSaved)}</div>
          <div style={{fontSize:11,color:'#888',marginTop:4}}>10年投資したら → <span style={{color:GREEN,fontWeight:'bold'}}>{fmtYen(future10)}</span></div>
        </div>
        {showResist&&(
          <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:12}}>
            <input value={resistForm.name} onChange={e=>setResistForm(f=>({...f,name:e.target.value}))} placeholder="浪費アイテム（例: コンビニ夜ご飯）" style={{...st.inp,marginBottom:8}}/>
            <input type="number" value={resistForm.price} onChange={e=>setResistForm(f=>({...f,price:e.target.value}))} placeholder="1回あたりの金額（円）" style={{...st.inp,marginBottom:10}}/>
            <button onClick={()=>{const price=parseInt(resistForm.price);if(!resistForm.name||!price)return;upd(d=>{d.resist.items=[...(d.resist.items||[]),{id:Date.now(),name:resistForm.name,price}];});setResistForm({name:'',price:''});setShowResist(false);}} style={st.btn()}>保存</button>
          </div>
        )}
        {items.length===0&&<div style={{fontSize:12,color:'#aaa'}}>浪費アイテムを登録してください</div>}
        {items.map(item=>{
          const todayDone=log[td]&&log[td][item.id];
          return(
            <div key={item.id} style={{...st.card,marginBottom:8}}>
              <div style={st.between}>
                <div><div style={{fontSize:13,color:'#111',fontWeight:'bold'}}>{item.name}</div><div style={{fontSize:12,color:GOLD}}>{fmtYen(item.price)} / 回</div></div>
                <button onClick={async()=>{const ok=await confirm('この項目を削除しますか？');if(ok)upd(d=>{d.resist.items=d.resist.items.filter(i=>i.id!==item.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
              </div>
              <button onClick={()=>upd(d=>{if(!d.resist.log)d.resist.log={};if(!d.resist.log[td])d.resist.log[td]={};d.resist.log[td][item.id]=!d.resist.log[td][item.id];})} style={{width:'100%',marginTop:10,padding:8,background:todayDone?GREEN:'#fff',border:`1px solid ${todayDone?GREEN:BORDER}`,borderRadius:4,color:todayDone?'#fff':'#333',fontSize:12,cursor:'pointer'}}>
                {todayDone?'✓ 今日も我慢した':'今日我慢した'}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── WEIGHT ──
function WeightTab({ data, upd }) {
  const [form, setForm] = useState({date:today(),weight:''});
  const [showForm, setShowForm] = useState(false);
  const [editId, setEditId] = useState(null);
  const { confirm, Dialog } = useConfirm();

  function saveWeight() {
    const w=parseFloat(form.weight); if(isNaN(w)) return;
    if(editId) upd(d=>{d.weight=d.weight.map(x=>x.id===editId?{...x,date:form.date,weight:w}:x).sort((a,b)=>b.date.localeCompare(a.date));});
    else upd(d=>{d.weight=[{id:Date.now(),date:form.date,weight:w},...(d.weight||[])].sort((a,b)=>b.date.localeCompare(a.date));});
    setForm({date:today(),weight:''}); setShowForm(false); setEditId(null);
  }

  const records=[...(data.weight||[])].reverse().slice(-30);
  const latest=(data.weight||[])[0];
  const W=300,H=110;
  const weights=records.map(r=>r.weight);
  const minW=weights.length>0?Math.min(...weights)-1:50;
  const maxW=weights.length>0?Math.max(...weights)+1:80;
  function toY(w){return H-((w-minW)/(maxW-minW))*H;}
  function toX(i){return records.length>1?(i/(records.length-1))*(W-20)+10:W/2;}
  const points=records.map((r,i)=>`${toX(i)},${toY(r.weight)}`).join(' ');

  return (
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>体重記録</div>
        <button onClick={()=>{setForm({date:today(),weight:''});setEditId(null);setShowForm(!showForm);}} style={st.btn()}>+ 記録</button>
      </div>
      {latest&&(
        <div style={{...st.card,textAlign:'center',marginBottom:14,background:'#FBF7EE',border:`1px solid ${GOLD}50`}}>
          <div style={{fontSize:10,color:'#888',marginBottom:4}}>最新</div>
          <div style={{fontSize:32,color:GOLD,fontWeight:'bold'}}>{latest.weight}<span style={{fontSize:14,color:'#888'}}>kg</span></div>
          <div style={{fontSize:11,color:'#888'}}>{latest.date}</div>
        </div>
      )}
      {showForm&&(
        <div style={{...st.card,border:`1px solid ${GOLD}`,marginBottom:14}}>
          <div style={{...st.grid2,marginBottom:10}}>
            <input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={st.inp}/>
            <input type="number" step="0.1" value={form.weight} onChange={e=>setForm(f=>({...f,weight:e.target.value}))} placeholder="体重 (kg)" style={st.inp}/>
          </div>
          <button onClick={saveWeight} style={st.btn()}>{editId?'更新':'保存'}</button>
        </div>
      )}
      {records.length>1&&(
        <div style={{...st.card,marginBottom:14}}>
          <div style={{fontSize:11,color:'#888',marginBottom:8}}>体重推移（kg）</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H+20}`}>
            <polyline points={points} fill="none" stroke={GOLD} strokeWidth="2"/>
            {records.map((r,i)=><circle key={r.id} cx={toX(i)} cy={toY(r.weight)} r="3" fill={GOLD}/>)}
            {records.map((r,i)=>(i===0||i===records.length-1)&&<text key={`t${r.id}`} x={toX(i)} y={toY(r.weight)-6} textAnchor="middle" fontSize="9" fill="#888">{r.weight}</text>)}
            <text x="0" y={H+16} fontSize="9" fill="#aaa">{records[0]?.date.slice(5)}</text>
            {records.length>1&&<text x={W} y={H+16} fontSize="9" fill="#aaa" textAnchor="end">{records[records.length-1]?.date.slice(5)}</text>}
          </svg>
        </div>
      )}
      <div style={st.label}>記録一覧</div>
      {(data.weight||[]).length===0&&<div style={{fontSize:12,color:'#aaa'}}>まだ記録がありません</div>}
      {(data.weight||[]).slice(0,20).map(r=>(
        <div key={r.id} style={{display:'flex',alignItems:'center',padding:'10px 14px',marginBottom:6,background:'#fff',border:`1px solid ${BORDER}`,borderRadius:4}}>
          <div style={{flex:1,fontSize:11,color:'#888'}}>{r.date}</div>
          <div style={{fontSize:18,color:'#111',fontWeight:'bold'}}>{r.weight}<span style={{fontSize:11,color:'#888'}}>kg</span></div>
          <button onClick={()=>{setForm({date:r.date,weight:String(r.weight)});setEditId(r.id);setShowForm(true);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13,marginLeft:8}}>✏️</button>
          <button onClick={async()=>{const ok=await confirm('この記録を削除しますか？');if(ok)upd(d=>{d.weight=d.weight.filter(x=>x.id!==r.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16,marginLeft:4}}>×</button>
        </div>
      ))}
    </div>
  );
}

// ── DIARY ──
function DiaryTab({ data, upd }) {
  const [mode, setMode] = useState('list');
  const [entry, setEntry] = useState({date:today(),mood:'3',text:'',sleep:''});
  const [viewing, setViewing] = useState(null);
  const { confirm, Dialog } = useConfirm();

  function saveEntry() {
    if(!entry.text.trim()) return;
    upd(d=>{
      const idx=(d.diary||[]).findIndex(e=>e.date===entry.date);
      if(idx>=0) d.diary[idx]={...entry,id:d.diary[idx].id};
      else d.diary=[{...entry,id:Date.now()},...(d.diary||[])];
    });
    setMode('list');
  }

  if(mode==='write') return (
    <div>
      <div style={{...st.between,marginBottom:14}}>
        <div style={st.label}>日記を書く</div>
        <button onClick={()=>setMode('list')} style={{background:'none',border:'none',color:'#888',cursor:'pointer',fontSize:12}}>← 戻る</button>
      </div>
      <input type="date" value={entry.date} onChange={e=>setEntry(v=>({...v,date:e.target.value}))} style={{...st.inp,marginBottom:8}}/>
      <div style={{marginBottom:8}}>
        <div style={{fontSize:10,color:'#888',marginBottom:6}}>気分</div>
        <div style={{display:'flex',gap:8}}>
          {MOODS.map((m,i)=><button key={i} onClick={()=>setEntry(v=>({...v,mood:String(i)}))} style={{fontSize:20,background:entry.mood==i?'#FBF7EE':'#fff',border:`1px solid ${entry.mood==i?GOLD:BORDER}`,borderRadius:4,padding:'5px 8px',cursor:'pointer'}}>{m}</button>)}
        </div>
      </div>
      <div style={{marginBottom:8}}>
        <div style={{fontSize:10,color:'#888',marginBottom:4}}>睡眠時間</div>
        <input value={entry.sleep} onChange={e=>setEntry(v=>({...v,sleep:e.target.value}))} placeholder="例: 23:30 → 7:00" style={st.inp}/>
      </div>
      <textarea value={entry.text} onChange={e=>setEntry(v=>({...v,text:e.target.value}))} placeholder="今日のこと..." rows={8} style={{...st.inp,resize:'vertical',marginBottom:10}}/>
      <button onClick={saveEntry} style={st.btn()}>保存</button>
    </div>
  );

  if(viewing) {
    const e=(data.diary||[]).find(x=>x.id===viewing);
    return(
      <div>
        <Dialog/>
        <div style={{...st.between,marginBottom:14}}>
          <div style={st.label}>{e?.date}</div>
          <div style={{display:'flex',gap:8}}>
            <button onClick={()=>{setEntry({date:e.date,mood:e.mood,text:e.text,sleep:e.sleep||''});setMode('write');setViewing(null);}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:13}}>✏️</button>
            <button onClick={async()=>{const ok=await confirm('この日記を削除しますか？');if(ok){upd(d=>{d.diary=d.diary.filter(x=>x.id!==e.id);});setViewing(null);}}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
            <button onClick={()=>setViewing(null)} style={{background:'none',border:'none',color:'#888',cursor:'pointer',fontSize:12}}>← 戻る</button>
          </div>
        </div>
        {e&&<div style={st.card}><div style={{fontSize:22,marginBottom:8}}>{MOODS[parseInt(e.mood)]||'😐'}</div>{e.sleep&&<div style={{fontSize:11,color:'#888',marginBottom:8}}>睡眠: {e.sleep}</div>}<div style={{fontSize:13,lineHeight:1.8,color:'#111',whiteSpace:'pre-wrap'}}>{e.text}</div></div>}
      </div>
    );
  }

  return(
    <div>
      <Dialog/>
      <div style={{...st.between,marginBottom:12}}>
        <div style={st.label}>日記</div>
        <button onClick={()=>{setEntry({date:today(),mood:'3',text:'',sleep:''});setMode('write');}} style={st.btn()}>+ 書く</button>
      </div>
      {(data.diary||[]).length===0&&<div style={{fontSize:12,color:'#aaa'}}>まだ日記がありません</div>}
      {(data.diary||[]).map(e=>(
        <div key={e.id} style={{...st.card,cursor:'pointer',display:'flex',alignItems:'center',gap:12,marginBottom:8}}>
          <div onClick={()=>setViewing(e.id)} style={{display:'flex',alignItems:'center',gap:12,flex:1}}>
            <div style={{fontSize:20}}>{MOODS[parseInt(e.mood)]||'😐'}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:11,color:'#888'}}>{e.date}{e.sleep?' | '+e.sleep:''}</div>
              <div style={{fontSize:13,color:'#111',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{e.text}</div>
            </div>
          </div>
          <button onClick={async()=>{const ok=await confirm('この日記を削除しますか？');if(ok)upd(d=>{d.diary=d.diary.filter(x=>x.id!==e.id);});}} style={{background:'none',border:'none',color:'#aaa',cursor:'pointer',fontSize:16}}>×</button>
        </div>
      ))}
    </div>
  );
}

function CheckCircle({done,onClick,size=18}){
  return <div onClick={onClick} style={{width:size,height:size,borderRadius:'50%',border:`1.5px solid ${done?GOLD:BORDER}`,background:done?GOLD:'#fff',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0,fontSize:size*0.6,color:'#fff'}}>{done?'✓':''}</div>;
}
function ProgressBar({value,color}){
  return <div style={{height:6,background:'#eee',borderRadius:3,overflow:'hidden',margin:'6px 0'}}><div style={{width:value+'%',height:'100%',background:color,borderRadius:3,transition:'width 0.3s'}}/></div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
