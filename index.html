<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="飴野家OS" />
  <title>飴野家 Personal OS</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #fff; color: #111; font-family: 'Georgia', 'Times New Roman', serif; }
    #root { height: 100%; }
    input, select, textarea, button { font-family: 'Georgia', 'Times New Roman', serif; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .tabs-row { display: flex; overflow-x: auto; }
    .tabs-row::-webkit-scrollbar { display: none; }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="month"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

const GOLD = '#B8955A';
const NAVY = '#1B2A4A';
const BORDER = '#E0D8CC';
const LIGHT = '#F9F6F1';
const RED = '#B84040';
const GREEN = '#3A7A5A';

const APP_KEY = 'ameno_os_v4';
const DEFAULT = {
  pin: null,
  schedule: [], todos: [], goals: [],
  finance: { income: 0, investment: 0, defense: 0, records: [], investTotal: 0, defenseTotal: 0 },
  resist: { items: [], log: {} },
  diary: [], weight: [], birthdays: [],
  genres: ['国家試験勉強', 'ウエイト', '英語学習', 'ストレッチ', '副業学習', 'ゴルフ', '読書'],
  genreGoals: {},
};

function loadData() {
  try { const r = localStorage.getItem(APP_KEY); if (r) return { ...DEFAULT, ...JSON.parse(r) }; } catch {}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function saveData(d) { try { localStorage.setItem(APP_KEY, JSON.stringify(d)); } catch {} }
function today() { return new Date().toISOString().split('T')[0]; }
function todayLabel() { return new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' }); }
function pad(n) { return String(n).padStart(2, '0'); }
function fmtYen(n) { return '¥' + Math.round(n).toLocaleString(); }
function fmtMan(n) { return (n / 10000).toFixed(1) + '万'; }

const st = {
  inp: { width: '100%', background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 4, padding: '8px 11px', color: '#111', fontSize: 13, outline: 'none', boxSizing: 'border-box' },
  btn: (bg, fg) => ({ background: bg || GOLD, border: 'none', borderRadius: 4, padding: '9px 18px', color: fg || '#fff', cursor: 'pointer', fontSize: 13 }),
  card: { background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 6, padding: '14px 16px', marginBottom: 10 },
  label: { fontSize: 10, letterSpacing: '0.15em', color: '#888', textTransform: 'uppercase', marginBottom: 8 },
  between: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
  grid2: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 },
};

const TABS = [
  { id: 'home', label: 'ホーム' },
  { id: 'schedule', label: 'スケジュール' },
  { id: 'todo', label: 'ToDo' },
  { id: 'goals', label: '目標' },
  { id: 'money', label: 'お金' },
  { id: 'weight', label: '体重' },
  { id: 'diary', label: '日記' },
];

const MOODS = ['😞','😕','😐','🙂','😊'];
const PCOLOR = { urgent: '#B84040', high: '#C07030', medium: '#8A7030', low: '#3A6080' };
const PLABEL = { urgent: '緊急', high: '高', medium: '中', low: '低' };

function App() {
  const [data, setData] = useState(loadData);
  const [tab, setTab] = useState('home');
  const [unlocked, setUnlocked] = useState(false);
  const [pinInput, setPinInput] = useState('');
  const [pinError, setPinError] = useState(0);
  const [lockUntil, setLockUntil] = useState(0);
  const [setupPin, setSetupPin] = useState('');

  function upd(fn) {
    setData(d => {
      const n = JSON.parse(JSON.stringify(d));
      fn(n);
      saveData(n);
      return n;
    });
  }

  if (!data.pin) {
    return (
      <div style={{ background: NAVY, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center', padding: 32 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.25em', color: GOLD, marginBottom: 6 }}>飴野家 PERSONAL OS</div>
          <div style={{ fontSize: 14, color: '#F5EDD8', marginBottom: 28 }}>PINコード（4桁）を設定</div>
          <PinDots count={setupPin.length} />
          <PinPad value={setupPin} onChange={setSetupPin} maxLen={4} />
          {setupPin.length === 4 && (
            <button onClick={() => { upd(d => { d.pin = setupPin; }); setUnlocked(true); }} style={{ ...st.btn(), marginTop: 16 }}>設定する</button>
          )}
        </div>
      </div>
    );
  }

  if (!unlocked) {
    const now = Date.now();
    const locked = lockUntil > now;
    return (
      <div style={{ background: NAVY, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center', padding: 32 }}>
          <div style={{ fontSize: 10, letterSpacing: '0.25em', color: GOLD, marginBottom: 6 }}>飴野家 PERSONAL OS</div>
          <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 28 }}>{todayLabel()}</div>
          {locked ? <LockTimer lockUntil={lockUntil} /> : (
            <>
              <PinDots count={pinInput.length} />
              {pinError > 0 && <div style={{ color: '#E07070', fontSize: 12, marginBottom: 12 }}>PINが違います（{pinError}/3）</div>}
              <PinPad value={pinInput} onChange={v => {
                setPinInput(v);
                if (v.length === 4) {
                  if (v === data.pin) { setUnlocked(true); setPinInput(''); setPinError(0); }
                  else {
                    const e = pinError + 1; setPinError(e); setPinInput('');
                    if (e >= 3) { setLockUntil(Date.now() + 30000); setPinError(0); }
                  }
                }
              }} maxLen={4} />
            </>
          )}
        </div>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 480, margin: '0 auto', background: '#fff', minHeight: '100vh' }}>
      <div style={{ background: NAVY, padding: '14px 16px 10px' }}>
        <div style={{ fontSize: 9, letterSpacing: '0.2em', color: GOLD, marginBottom: 3 }}>飴野家 PERSONAL OS</div>
        <div style={{ fontSize: 15, color: '#F5EDD8' }}>{todayLabel()}</div>
      </div>
      <div className="tabs-row" style={{ background: NAVY, borderBottom: `2px solid rgba(184,149,90,0.3)`, position: 'sticky', top: 0, zIndex: 100 }}>
        {TABS.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: '0 0 auto', padding: '10px 13px', background: 'none', border: 'none', borderBottom: tab === t.id ? `2px solid ${GOLD}` : '2px solid transparent', color: tab === t.id ? GOLD : 'rgba(245,237,216,0.5)', fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap' }}>
            {t.label}
          </button>
        ))}
      </div>
      <div style={{ padding: '16px 16px 80px', background: '#fff' }}>
        {tab === 'home' && <HomeTab data={data} upd={upd} />}
        {tab === 'schedule' && <ScheduleTab data={data} upd={upd} />}
        {tab === 'todo' && <TodoTab data={data} upd={upd} />}
        {tab === 'goals' && <GoalsTab data={data} upd={upd} />}
        {tab === 'money' && <MoneyTab data={data} upd={upd} />}
        {tab === 'weight' && <WeightTab data={data} upd={upd} />}
        {tab === 'diary' && <DiaryTab data={data} upd={upd} />}
      </div>
    </div>
  );
}

function PinDots({ count }) {
  return (
    <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 24 }}>
      {[0,1,2,3].map(i => <div key={i} style={{ width: 14, height: 14, borderRadius: '50%', background: count > i ? GOLD : 'rgba(255,255,255,0.2)' }} />)}
    </div>
  );
}

function PinPad({ value, onChange, maxLen }) {
  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 64px)', gap: 10, justifyContent: 'center' }}>
      {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((n, i) => (
        <button key={i} onClick={() => {
          if (n === '⌫') { onChange(value.slice(0, -1)); return; }
          if (n === '') return;
          if (value.length < maxLen) onChange(value + n);
        }} style={{ height: 54, background: n === '' ? 'none' : 'rgba(255,255,255,0.1)', border: `1px solid ${n === '' ? 'transparent' : 'rgba(255,255,255,0.2)'}`, borderRadius: 4, color: '#F5EDD8', fontSize: 18, cursor: n === '' ? 'default' : 'pointer' }}>{n}</button>
      ))}
    </div>
  );
}

function LockTimer({ lockUntil }) {
  const [rem, setRem] = useState(Math.ceil((lockUntil - Date.now()) / 1000));
  useEffect(() => {
    const t = setInterval(() => { const r = Math.ceil((lockUntil - Date.now()) / 1000); setRem(r); if (r <= 0) clearInterval(t); }, 1000);
    return () => clearInterval(t);
  }, [lockUntil]);
  return <div style={{ color: '#E07070', fontSize: 13 }}>{rem}秒後に再試行できます</div>;
}

// ── HOME ──
function HomeTab({ data, upd }) {
  const td = today();
  const [modal, setModal] = useState(null);
  const slots = [];
  for (let h = 7; h < 23; h++) for (let m = 0; m < 60; m += 10) slots.push({ h, m });
  const res = (data.schedule||[]).filter(s => s.date === td).sort((a,b) => a.start.localeCompare(b.start));
  const todos = (data.todos||[]).filter(t => !t.done).sort((a,b) => {
    const po = { urgent:0, high:1, medium:2, low:3 };
    return (po[a.priority]||2)-(po[b.priority]||2);
  });

  function saveRes(form) {
    upd(d => { d.schedule = [...d.schedule, { id: Date.now(), date: td, ...form }]; });
    setModal(null);
  }

  return (
    <div>
      <div style={st.label}>今日のスケジュール</div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(6,1fr)', gap: 3, marginBottom: 12 }}>
        {slots.map(({ h, m }) => {
          const key = `${pad(h)}:${pad(m)}`;
          const item = res.find(s => s.start === key);
          return (
            <div key={key} onClick={() => !item && setModal({ h, m })}
              style={{ padding: '5px 2px', borderRadius: 4, display: 'flex', flexDirection: 'column', alignItems: 'center', minHeight: 40, cursor: item ? 'default' : 'pointer', background: item ? '#EAE0FF' : LIGHT, border: `1px solid ${item ? '#9B7FD4' : BORDER}` }}>
              <span style={{ fontSize: 8, color: '#888' }}>{key}</span>
              {item && <span style={{ fontSize: 7, fontWeight: 700, color: '#5B3FA6', marginTop: 1, textAlign: 'center', lineHeight: 1.2, wordBreak: 'break-all' }}>{item.genre || item.title}</span>}
            </div>
          );
        })}
      </div>

      {res.length > 0 && (
        <div style={{ marginBottom: 14 }}>
          {res.map(s => (
            <div key={s.id} style={{ ...st.card, borderLeft: `3px solid ${GOLD}`, padding: '10px 14px', marginBottom: 6, display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: '#888' }}>{s.start}{s.end?' — '+s.end:''}</div>
                <div style={{ fontSize: 13, color: '#111' }}>{s.title}</div>
                {s.genre && <span style={{ fontSize: 10, background: '#EAE0FF', color: '#5B3FA6', borderRadius: 3, padding: '1px 6px' }}>{s.genre}</span>}
              </div>
              <button onClick={() => upd(d => { d.schedule = d.schedule.filter(x => x.id !== s.id); })} style={{ background: 'none', border: 'none', color: '#aaa', cursor: 'pointer', fontSize: 16 }}>×</button>
            </div>
          ))}
        </div>
      )}

      <div style={st.label}>今日のToDo</div>
      {todos.length === 0 && <div style={{ fontSize: 12, color: '#aaa', marginBottom: 12 }}>タスクなし</div>}
      {todos.slice(0,6).map(t => {
        const pc = PCOLOR[t.priority]||PCOLOR.medium;
        return (
          <div key={t.id} style={{ ...st.card, borderLeft: `3px solid ${pc}`, padding: '10px 14px', marginBottom: 7, display: 'flex', alignItems: 'center', gap: 10 }}>
            <CheckCircle done={t.done} onClick={() => upd(d => { d.todos = d.todos.map(x => x.id===t.id?{...x,done:!x.done}:x); })} />
            <div style={{ flex: 1, fontSize: 13, color: '#111' }}>{t.text}</div>
            <span style={{ fontSize: 10, color: pc, border: `1px solid ${pc}40`, borderRadius: 2, padding: '1px 5px' }}>{PLABEL[t.priority]}</span>
          </div>
        );
      })}

      {modal && <ReserveModal date={td} h={modal.h} m={modal.m} genres={data.genres||[]} onSave={saveRes} onClose={() => setModal(null)} upd={upd} />}
    </div>
  );
}

function ReserveModal({ date, h, m, genres, onSave, onClose, upd }) {
  const [title, setTitle] = useState('');
  const [genre, setGenre] = useState(genres[0]||'');
  const endM = (m+10) >= 60 ? 0 : m+10;
  const endH = (m+10) >= 60 ? h+1 : h;
  const [end, setEnd] = useState(`${pad(endH)}:${pad(endM)}`);
  const [newGenre, setNewGenre] = useState('');
  const [showAdd, setShowAdd] = useState(false);

  function addGenre() {
    if (!newGenre.trim()) return;
    upd(d => { if (!d.genres.includes(newGenre.trim())) d.genres = [...d.genres, newGenre.trim()]; });
    setGenre(newGenre.trim());
    setNewGenre('');
    setShowAdd(false);
  }

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'flex-end', justifyContent: 'center', zIndex: 200 }} onClick={onClose}>
      <div style={{ background: '#fff', borderRadius: '12px 12px 0 0', padding: 24, width: '100%', maxWidth: 480, paddingBottom: 40 }} onClick={e => e.stopPropagation()}>
        <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 14, color: '#111' }}>{pad(h)}:{pad(m)} に予約</div>
        <div style={{ fontSize: 10, color: '#888', marginBottom: 6 }}>ジャンル</div>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
          {genres.map(g => (
            <button key={g} onClick={() => setGenre(g)} style={{ padding: '5px 12px', background: genre===g?GOLD:LIGHT, border: `1px solid ${genre===g?GOLD:BORDER}`, borderRadius: 20, color: genre===g?'#fff':'#333', fontSize: 12, cursor: 'pointer' }}>{g}</button>
          ))}
          <button onClick={() => setShowAdd(!showAdd)} style={{ padding: '5px 12px', background: 'none', border: `1px dashed ${BORDER}`, borderRadius: 20, color: '#888', fontSize: 12, cursor: 'pointer' }}>＋ 追加</button>
        </div>
        {showAdd && (
          <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
            <input value={newGenre} onChange={e => setNewGenre(e.target.value)} placeholder="新しいジャンル" style={{ ...st.inp, flex: 1 }} />
            <button onClick={addGenre} style={st.btn()}>追加</button>
          </div>
        )}
        <div style={{ fontSize: 10, color: '#888', marginBottom: 4 }}>タイトル（任意）</div>
        <input value={title} onChange={e => setTitle(e.target.value)} placeholder="例：継代、読書など" style={{ ...st.inp, marginBottom: 10 }} />
        <div style={{ fontSize: 10, color: '#888', marginBottom: 4 }}>終了時間</div>
        <input type="time" value={end} onChange={e => setEnd(e.target.value)} style={{ ...st.inp, marginBottom: 16 }} />
        <button onClick={() => onSave({ title: title||genre, genre, start: `${pad(h)}:${pad(m)}`, end })} style={{ ...st.btn(), width: '100%' }}>予約する</button>
      </div>
    </div>
  );
}

// ── SCHEDULE ──
function ScheduleTab({ data, upd }) {
  const [weekOffset, setWeekOffset] = useState(0);
  const [editGoal, setEditGoal] = useState(false);
  const [goalInputs, setGoalInputs] = useState({});

  function getWeekDates(offset) {
    const now = new Date();
    const dow = now.getDay();
    const diff = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(now);
    monday.setDate(now.getDate() + diff + offset * 7);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    });
  }

  const weekDates = getWeekDates(weekOffset);
  const weekSchedule = (data.schedule||[]).filter(s => weekDates.includes(s.date));
  const genres = data.genres||[];
  const genreGoals = data.genreGoals||{};

  const genreTotals = {};
  genres.forEach(g => { genreTotals[g] = 0; });
  weekSchedule.forEach(s => { if (s.genre) genreTotals[s.genre] = (genreTotals[s.genre]||0) + 10; });

  const activeGenres = genres.filter(g => genreTotals[g] > 0 || genreGoals[g]);

  function saveGoals() {
    upd(d => { d.genreGoals = { ...goalInputs }; });
    setEditGoal(false);
  }

  // SVG bar chart
  const chartW = 320;
  const chartH = 140;
  const barW = activeGenres.length > 0 ? Math.min(32, (chartW - 40) / (activeGenres.length * 2 + 1)) : 20;
  const maxVal = Math.max(...activeGenres.map(g => Math.max((genreTotals[g]||0)/60, genreGoals[g]||0)), 1);

  return (
    <div>
      <div style={st.label}>週間サマリー</div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 14, alignItems: 'center' }}>
        <button onClick={() => setWeekOffset(w => w-1)} style={{ ...st.btn(LIGHT, '#333'), padding: '6px 12px' }}>◀</button>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 12, color: '#333' }}>
          {weekDates[0].slice(5).replace('-','/')} 〜 {weekDates[6].slice(5).replace('-','/')}
        </div>
        <button onClick={() => setWeekOffset(w => w+1)} style={{ ...st.btn(LIGHT, '#333'), padding: '6px 12px' }}>▶</button>
      </div>

      {activeGenres.length > 0 && (
        <div style={{ ...st.card, marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: '#888', marginBottom: 8 }}>ジャンル別時間（時間）</div>
          <svg width="100%" viewBox={`0 0 ${chartW} ${chartH+30}`} style={{ overflow: 'visible' }}>
            {activeGenres.map((g, i) => {
              const x = 30 + i * ((chartW - 40) / activeGenres.length) + 4;
              const actualH = ((genreTotals[g]||0)/60 / maxVal) * chartH;
              const goalH = ((genreGoals[g]||0) / maxVal) * chartH;
              const label = g.length > 4 ? g.slice(0,4) : g;
              return (
                <g key={g}>
                  {goalH > 0 && <rect x={x} y={chartH - goalH} width={barW} height={goalH} fill="#C0D4F0" rx="2" />}
                  <rect x={x + (goalH > 0 ? barW + 2 : 0)} y={chartH - actualH} width={barW} height={actualH} fill={GOLD} rx="2" />
                  <text x={x + barW/2} y={chartH + 14} textAnchor="middle" fontSize="9" fill="#666">{label}</text>
                  {actualH > 0 && <text x={x + (goalH > 0 ? barW + 2 : 0) + barW/2} y={chartH - actualH - 3} textAnchor="middle" fontSize="8" fill={GOLD}>{((genreTotals[g]||0)/60).toFixed(1)}</text>}
                </g>
              );
            })}
            <line x1="28" y1="0" x2="28" y2={chartH} stroke="#ddd" strokeWidth="1" />
            <line x1="28" y1={chartH} x2={chartW} y2={chartH} stroke="#ddd" strokeWidth="1" />
          </svg>
          <div style={{ display: 'flex', gap: 12, fontSize: 10, color: '#888', justifyContent: 'center', marginTop: 4 }}>
            <span><span style={{ display: 'inline-block', width: 10, height: 10, background: GOLD, marginRight: 4, borderRadius: 2 }}></span>実績</span>
            <span><span style={{ display: 'inline-block', width: 10, height: 10, background: '#C0D4F0', marginRight: 4, borderRadius: 2 }}></span>目標</span>
          </div>
        </div>
      )}

      <div style={{ ...st.between, marginBottom: 10 }}>
        <div style={st.label}>目標時間（時間/週）</div>
        <button onClick={() => { setGoalInputs({...genreGoals}); setEditGoal(!editGoal); }} style={{ ...st.btn(LIGHT, '#333'), padding: '5px 10px', fontSize: 11 }}>{editGoal?'キャンセル':'編集'}</button>
      </div>
      {editGoal ? (
        <div style={{ ...st.card, marginBottom: 14 }}>
          {genres.map(g => (
            <div key={g} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
              <div style={{ flex: 1, fontSize: 13, color: '#111' }}>{g}</div>
              <input type="number" value={goalInputs[g]||''} onChange={e => setGoalInputs(gi => ({...gi,[g]:parseFloat(e.target.value)||0}))} placeholder="0" style={{ ...st.inp, width: 70, textAlign: 'center' }} />
              <span style={{ fontSize: 11, color: '#888' }}>h</span>
            </div>
          ))}
          <button onClick={saveGoals} style={{ ...st.btn(), width: '100%' }}>保存</button>
        </div>
      ) : (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
          {genres.filter(g => genreGoals[g]).map(g => (
            <div key={g} style={{ background: LIGHT, border: `1px solid ${BORDER}`, borderRadius: 6, padding: '6px 12px', fontSize: 12 }}>
              <span style={{ color: '#333' }}>{g}</span>
              <span style={{ color: GOLD, marginLeft: 6, fontWeight: 700 }}>
                {((genreTotals[g]||0)/60).toFixed(1)}h / {genreGoals[g]}h
              </span>
            </div>
          ))}
          {genres.filter(g => genreGoals[g]).length === 0 && <div style={{ fontSize: 12, color: '#aaa' }}>「編集」から目標時間を設定してください</div>}
        </div>
      )}

      <div style={st.label}>今週の予定</div>
      {weekDates.map(d => {
        const dayItems = (data.schedule||[]).filter(s => s.date === d).sort((a,b) => a.start.localeCompare(b.start));

        const dt = new Date(d+'T00:00:00');
        const dow = ['日','月','火','水','木','金','土'][dt.getDay()];
        return (
          <div key={d} style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 11, color: '#888', marginBottom: 4 }}>{d.slice(5).replace('-','/')}（{dow}）</div>

              <div key={s.id} style={{ ...st.card, borderLeft: `3px solid ${GOLD}`, padding: '9px 12px', marginBottom: 5, display: 'flex', gap: 8, alignItems: 'center' }}>

              </div>
            ))}
          </div>
        );
      })}
    </div>
  );
}

function TodoTab({ data, upd }) {

function MoneyTab({ data, upd }) {

  const [resistForm, setResistForm] = useState({ name: '', price: '' });

  function saveRecord() {
    const amount = parseInt(form.amount);
    if (!amount || isNaN(amount)) return;
    upd(d => { d.finance.records = [{ id: Date.now(), ...form, amount }, ...d.finance.records]; });
    setForm({ date: today(), type: 'expense', amount: '', category: '', note: '' });
    setShowForm(false);
  }

  function saveResist() {
    const price = parseInt(resistForm.price);
    if (!resistForm.name || !price) return;
    upd(d => { d.resist.items = [...(d.resist.items||[]), { id: Date.now(), name: resistForm.name, price }]; });
    setResistForm({ name: '', price: '' });

  const recs = (data.finance.records||[]).filter(r => r.date && r.date.startsWith(viewMonth));

// ── WEIGHT ──
function WeightTab({ data, upd }) {
  const [form, setForm] = useState({ date: today(), weight: '' });
  const [showForm, setShowForm] = useState(false);

  function saveWeight() {
    const w = parseFloat(form.weight);
    if (isNaN(w)) return;
    upd(d => { d.weight = [{ id: Date.now(), date: form.date, weight: w }, ...(d.weight||[])].sort((a,b) => b.date.localeCompare(a.date)); });
    setForm({ date: today(), weight: '' });
    setShowForm(false);
  }

  const records = [...(data.weight||[])].reverse().slice(-30);
  const latest = (data.weight||[])[0];
  const W = 320, H = 120;
  const weights = records.map(r => r.weight);
  const minW = weights.length > 0 ? Math.min(...weights) - 1 : 50;
  const maxW = weights.length > 0 ? Math.max(...weights) + 1 : 80;

  function toY(w) { return H - ((w - minW) / (maxW - minW)) * H; }
  function toX(i) { return records.length > 1 ? (i / (records.length - 1)) * (W - 20) + 10 : W/2; }

  const points = records.map((r, i) => `${toX(i)},${toY(r.weight)}`).join(' ');

  return (
    <div>
      <div style={{ ...st.between, marginBottom: 12 }}>
        <div style={st.label}>体重記録</div>
        <button onClick={() => setShowForm(!showForm)} style={st.btn()}>+ 記録</button>
      </div>
      {latest && (
        <div style={{ ...st.card, textAlign: 'center', marginBottom: 14, background: '#FBF7EE', border: `1px solid ${GOLD}50` }}>
          <div style={{ fontSize: 10, color: '#888', marginBottom: 4 }}>最新</div>
          <div style={{ fontSize: 32, color: GOLD, fontWeight: 'bold' }}>{latest.weight}<span style={{ fontSize: 14, color: '#888' }}>kg</span></div>
          <div style={{ fontSize: 11, color: '#888' }}>{latest.date}</div>
        </div>
      )}
      {showForm && (
        <div style={{ ...st.card, border: `1px solid ${GOLD}`, marginBottom: 14 }}>
          <div style={{ ...st.grid2, marginBottom: 10 }}>
            <input type="date" value={form.date} onChange={e => setForm(f => ({...f,date:e.target.value}))} style={st.inp} />
            <input type="number" step="0.1" value={form.weight} onChange={e => setForm(f => ({...f,weight:e.target.value}))} placeholder="体重 (kg)" style={st.inp} />
          </div>
          <button onClick={saveWeight} style={st.btn()}>保存</button>
        </div>
      )}
      {records.length > 1 && (
        <div style={{ ...st.card, marginBottom: 14 }}>
          <div style={{ fontSize: 11, color: '#888', marginBottom: 8 }}>体重推移（kg）</div>
          <svg width="100%" viewBox={`0 0 ${W} ${H+20}`}>
            <polyline points={points} fill="none" stroke={GOLD} strokeWidth="2" />
            {records.map((r, i) => (
              <circle key={r.id} cx={toX(i)} cy={toY(r.weight)} r="3" fill={GOLD} />
            ))}
            {records.map((r, i) => (
              (i === 0 || i === records.length-1) && (
                <text key={`t${r.id}`} x={toX(i)} y={toY(r.weight)-6} textAnchor="middle" fontSize="9" fill="#888">{r.weight}</text>
              )
            ))}
            <text x="0" y={H+16} fontSize="9" fill="#aaa">{records[0]?.date.slice(5)}</text>
            {records.length>1 && <text x={W} y={H+16} fontSize="9" fill="#aaa" textAnchor="end">{records[records.length-1]?.date.slice(5)}</text>}
          </svg>
        </div>
      )}
      <div style={st.label}>記録一覧</div>
      {(data.weight||[]).length===0 && <div style={{ fontSize: 12, color: '#aaa' }}>まだ記録がありません</div>}
      {(data.weight||[]).slice(0,20).map(r => (
        <div key={r.id} style={{ display: 'flex', alignItems: 'center', padding: '10px 14px', marginBottom: 6, background: '#fff', border: `1px solid ${BORDER}`, borderRadius: 4 }}>
          <div style={{ flex: 1, fontSize: 11, color: '#888' }}>{r.date}</div>
          <div style={{ fontSize: 18, color: '#111', fontWeight: 'bold' }}>{r.weight}<span style={{ fontSize: 11, color: '#888' }}>kg</span></div>
          <button onClick={() => upd(d => { d.weight = d.weight.filter(x => x.id!==r.id); })} style={{ background: 'none', border: 'none', color: '#aaa', cursor: 'pointer', fontSize: 16, marginLeft: 10 }}>×</button>
        </div>
      ))}
    </div>
  );
}

// ── DIARY ──
function DiaryTab({ data, upd }) {
  const [mode, setMode] = useState('list');
  const [entry, setEntry] = useState({ date: today(), mood: '3', text: '', sleep: '' });
  const [viewing, setViewing] = useState(null);

  function saveEntry() {
    if (!entry.text.trim()) return;
    upd(d => {
      const idx = (d.diary||[]).findIndex(e => e.date===entry.date);
      if (idx>=0) d.diary[idx]={...entry,id:d.diary[idx].id};
      else d.diary=[{...entry,id:Date.now()},...(d.diary||[])];
    });
    setMode('list');
  }

  if (mode==='write') {
    return (
      <div>
        <div style={{ ...st.between, marginBottom: 14 }}>
          <div style={st.label}>日記を書く</div>
          <button onClick={() => setMode('list')} style={{ background: 'none', border: 'none', color: '#888', cursor: 'pointer', fontSize: 12 }}>← 戻る</button>
        </div>
        <input type="date" value={entry.date} onChange={e => setEntry(v => ({...v,date:e.target.value}))} style={{ ...st.inp, marginBottom: 8 }} />
        <div style={{ marginBottom: 8 }}>
          <div style={{ fontSize: 10, color: '#888', marginBottom: 6 }}>気分</div>
          <div style={{ display: 'flex', gap: 8 }}>
            {MOODS.map((m, i) => (
              <button key={i} onClick={() => setEntry(v => ({...v,mood:String(i)}))} style={{ fontSize: 20, background: entry.mood==i?'#FBF7EE':'#fff', border: `1px solid ${entry.mood==i?GOLD:BORDER}`, borderRadius: 4, padding: '5px 8px', cursor: 'pointer' }}>{m}</button>
            ))}
          </div>
        </div>
        <div style={{ marginBottom: 8 }}>
          <div style={{ fontSize: 10, color: '#888', marginBottom: 4 }}>睡眠時間</div>
          <input value={entry.sleep} onChange={e => setEntry(v => ({...v,sleep:e.target.value}))} placeholder="例: 23:30 → 7:00" style={st.inp} />
        </div>
        <textarea value={entry.text} onChange={e => setEntry(v => ({...v,text:e.target.value}))} placeholder="今日のこと..." rows={8} style={{ ...st.inp, resize: 'vertical', marginBottom: 10 }} />
        <button onClick={saveEntry} style={st.btn()}>保存</button>
      </div>
    );
  }

  if (viewing) {
    const e = (data.diary||[]).find(x => x.id===viewing);
    return (
      <div>
        <div style={{ ...st.between, marginBottom: 14 }}>
          <div style={st.label}>{e?.date}</div>
          <button onClick={() => setViewing(null)} style={{ background: 'none', border: 'none', color: '#888', cursor: 'pointer', fontSize: 12 }}>← 戻る</button>
        </div>
        {e && (
          <div style={st.card}>
            <div style={{ fontSize: 22, marginBottom: 8 }}>{MOODS[parseInt(e.mood)]||'😐'}</div>
            {e.sleep && <div style={{ fontSize: 11, color: '#888', marginBottom: 8 }}>睡眠: {e.sleep}</div>}
            <div style={{ fontSize: 13, lineHeight: 1.8, color: '#111', whiteSpace: 'pre-wrap' }}>{e.text}</div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div>
      <div style={{ ...st.between, marginBottom: 12 }}>
        <div style={st.label}>日記</div>
        <button onClick={() => { setEntry({ date: today(), mood: '3', text: '', sleep: '' }); setMode('write'); }} style={st.btn()}>+ 書く</button>
      </div>
      {(data.diary||[]).length===0 && <div style={{ fontSize: 12, color: '#aaa' }}>まだ日記がありません</div>}
      {(data.diary||[]).map(e => (
        <div key={e.id} onClick={() => setViewing(e.id)} style={{ ...st.card, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12, marginBottom: 8 }}>
          <div style={{ fontSize: 20 }}>{MOODS[parseInt(e.mood)]||'😐'}</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 11, color: '#888' }}>{e.date}{e.sleep?' | '+e.sleep:''}</div>
            <div style={{ fontSize: 13, color: '#111', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{e.text}</div>
          </div>
          <div style={{ color: '#aaa' }}>›</div>
        </div>
      ))}
    </div>
  );
}

// ── SHARED ──
function CheckCircle({ done, onClick, size=18 }) {
  return (
    <div onClick={onClick} style={{ width: size, height: size, borderRadius: '50%', border: `1.5px solid ${done?GOLD:BORDER}`, background: done?GOLD:'#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0, fontSize: size*0.6, color: '#fff' }}>
      {done?'✓':''}
    </div>
  );
}

function ProgressBar({ value, color }) {
  return (
    <div style={{ height: 6, background: '#eee', borderRadius: 3, overflow: 'hidden', margin: '6px 0' }}>
      <div style={{ width: value+'%', height: '100%', background: color, borderRadius: 3, transition: 'width 0.3s' }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
