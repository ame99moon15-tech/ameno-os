<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="飴野家OS" />
  <title>飴野家 Personal OS</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #FAF7F2; font-family: 'Georgia', 'Times New Roman', serif; }
    #root { height: 100%; }
    input, select, textarea, button { font-family: 'Georgia', 'Times New Roman', serif; }
    select option { background: #FAF7F2; color: #1A1410; }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator,
    input[type="month"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
    ::-webkit-scrollbar { width: 0; height: 0; }
    .tabs-scroll { display: flex; overflow-x: auto; }
    .tabs-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── COLORS ──
    const C = {
      gold: '#B8955A', goldLight: '#F5EDD8', goldMid: '#D4AA6E',
      navy: '#1B2A4A', navyLight: '#2C3E6B',
      cream: '#FAF7F2', creamDark: '#F0EAE0',
      brown: '#5C4033', brownLight: '#8B6355',
      text: '#1A1410', text2: '#5C4A3A', text3: '#9A8870',
      border: '#DDD3C0', surface: '#FFFFFF',
      red: '#B84040', green: '#3A7A5A',
    };

    const PCOLOR = { urgent: '#B84040', high: '#C07030', medium: '#8A7030', low: '#3A6080' };
    const PLABEL = { urgent: '緊急', high: '高', medium: '中', low: '低' };
    const MOODS = ['😞','😕','😐','🙂','😊'];

    const APP_KEY = 'ameno_os_v3';
    const DEFAULT_DATA = {
      pin: null,
      schedule: [], todos: [], goals: [],
      finance: { income: 144700, investment: 65000, defense: 22000, gym: 8000, subs: 10000, daily: 10000, records: [], investTotal: 0, defenseTotal: 0 },
      wishlist: [], resist: { items: [], log: {} }, diary: [], birthdays: [],
    };

    function loadData() {
      try { const r = localStorage.getItem(APP_KEY); if (r) return { ...DEFAULT_DATA, ...JSON.parse(r) }; } catch {}
      return { ...DEFAULT_DATA };
    }
    function saveData(d) { try { localStorage.setItem(APP_KEY, JSON.stringify(d)); } catch {} }
    function today() { return new Date().toISOString().split('T')[0]; }
    function todayStr() { return new Date().toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' }); }
    function fmtYen(n) { return '¥' + Math.round(n).toLocaleString(); }
    function fmtMan(n) { return (n / 10000).toFixed(1) + '万'; }

    // ── STYLES ──
    const st = {
      inp: { width: '100%', background: C.creamDark, border: `1px solid ${C.border}`, borderRadius: 3, padding: '8px 11px', color: C.text, fontSize: 13, outline: 'none', boxSizing: 'border-box' },
      btn: (bg = C.gold, fg = '#fff') => ({ background: bg, border: 'none', borderRadius: 3, padding: '8px 16px', color: fg, cursor: 'pointer', fontSize: 12 }),
      card: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 4, padding: '14px 16px', marginBottom: 10 },
      label: { fontSize: 9, letterSpacing: '0.2em', color: C.text3, textTransform: 'uppercase', marginBottom: 10 },
      row: { display: 'flex', gap: 8, alignItems: 'center' },
      between: { display: 'flex', justifyContent: 'space-between', alignItems: 'center' },
      grid2: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 },
    };

    const TABS = [
      { id: 'home', label: 'ホーム' },
      { id: 'schedule', label: 'スケジュール' },
      { id: 'todo', label: 'ToDo' },
      { id: 'goals', label: '目標' },
      { id: 'money', label: 'お金' },
      { id: 'wishlist', label: '欲しいもの' },
      { id: 'resist', label: '我慢リスト' },
      { id: 'diary', label: '日記' },
    ];

    // ── APP ──
    function App() {
      const [data, setData] = useState(loadData);
      const [tab, setTab] = useState('home');
      const [unlocked, setUnlocked] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(0);
      const [lockUntil, setLockUntil] = useState(0);
      const [setupPin, setSetupPin] = useState('');

      function upd(fn) {
        setData(d => {
          const n = { ...d };
          fn(n);
          saveData(n);
          return n;
        });
      }

      // PIN SETUP
      if (!data.pin) {
        return (
          <div style={{ background: C.navy, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ textAlign: 'center', padding: 32 }}>
              <div style={{ fontSize: 10, letterSpacing: '0.25em', color: C.goldMid, marginBottom: 6 }}>飴野家 PERSONAL OS</div>
              <div style={{ fontSize: 14, color: '#F5EDD8', marginBottom: 28 }}>PINコード（4桁）を設定</div>
              <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 24 }}>
                {[0,1,2,3].map(i => <div key={i} style={{ width: 14, height: 14, borderRadius: '50%', background: setupPin.length > i ? C.gold : 'rgba(255,255,255,0.2)' }} />)}
              </div>
              <PinPad value={setupPin} onChange={setSetupPin} maxLen={4} />
              {setupPin.length === 4 && (
                <button onClick={() => { upd(d => { d.pin = setupPin; }); setUnlocked(true); }} style={{ ...st.btn(), marginTop: 16 }}>設定する</button>
              )}
            </div>
          </div>
        );
      }

      // LOCK
      if (!unlocked) {
        const now = Date.now();
        const locked = lockUntil > now;
        return (
          <div style={{ background: C.navy, minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <div style={{ textAlign: 'center', padding: 32 }}>
              <div style={{ fontSize: 10, letterSpacing: '0.25em', color: C.goldMid, marginBottom: 6 }}>飴野家 PERSONAL OS</div>
              <div style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', marginBottom: 28 }}>{todayStr()}</div>
              {locked ? (
                <LockTimer lockUntil={lockUntil} />
              ) : (
                <>
                  <div style={{ display: 'flex', gap: 12, justifyContent: 'center', marginBottom: 24 }}>
                    {[0,1,2,3].map(i => <div key={i} style={{ width: 14, height: 14, borderRadius: '50%', background: pinInput.length > i ? C.gold : 'rgba(255,255,255,0.2)' }} />)}
                  </div>
                  {pinError > 0 && <div style={{ color: '#E07070', fontSize: 12, marginBottom: 12 }}>PINが違います（{pinError}/3）</div>}
                  <PinPad value={pinInput} onChange={v => {
                    setPinInput(v);
                    if (v.length === 4) {
                      if (v === data.pin) { setUnlocked(true); setPinInput(''); setPinError(0); }
                      else {
                        const e = pinError + 1;
                        setPinError(e);
                        setPinInput('');
                        if (e >= 3) { setLockUntil(Date.now() + 30000); setPinError(0); }
                      }
                    }
                  }} maxLen={4} />
                </>
              )}
            </div>
          </div>
        );
      }

      // MAIN
      const td = today();
      const month = td.slice(0, 7);
      const recs = (data.finance.records || []).filter(r => r.date && r.date.startsWith(month));
      const totalIncome = recs.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0) + data.finance.income;
      const totalExpense = recs.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0) + data.finance.investment + data.finance.defense + data.finance.gym + data.finance.subs + data.finance.daily;
      const freeBalance = totalIncome - totalExpense;

      return (
        <div style={{ maxWidth: 480, margin: '0 auto', background: C.cream, minHeight: '100vh' }}>
          {/* Header */}
          <div style={{ background: C.navy, padding: '16px 18px 12px' }}>
            <div style={{ fontSize: 9, letterSpacing: '0.25em', color: C.goldMid, marginBottom: 4 }}>飴野家 PERSONAL OS</div>
            <div style={{ ...st.between }}>
              <div style={{ fontSize: 16, color: '#F5EDD8' }}>{todayStr()}</div>
              <div style={{ textAlign: 'right' }}>
                <div style={{ fontSize: 11, color: C.goldMid }}>今月の自由枠</div>
                <div style={{ fontSize: 18, color: freeBalance >= 0 ? C.gold : '#E07070' }}>{fmtYen(freeBalance)}</div>
              </div>
            </div>
          </div>

          {/* Tabs */}
          <div className="tabs-scroll" style={{ background: C.navy, borderBottom: `1px solid rgba(184,149,90,0.3)`, position: 'sticky', top: 0, zIndex: 100 }}>
            {TABS.map(t => (
              <button key={t.id} onClick={() => setTab(t.id)} style={{ flex: '0 0 auto', padding: '10px 13px', background: 'none', border: 'none', borderBottom: tab === t.id ? `2px solid ${C.gold}` : '2px solid transparent', color: tab === t.id ? C.gold : 'rgba(245,237,216,0.5)', fontSize: 11, cursor: 'pointer', whiteSpace: 'nowrap', letterSpacing: '0.05em' }}>
                {t.label}
              </button>
            ))}
          </div>

          {/* Content */}
          <div style={{ padding: '16px 16px 80px' }}>
            {tab === 'home' && <HomeTab data={data} upd={upd} freeBalance={freeBalance} totalIncome={totalIncome} totalExpense={totalExpense} />}
            {tab === 'schedule' && <ScheduleTab data={data} upd={upd} />}
            {tab === 'todo' && <TodoTab data={data} upd={upd} />}
            {tab === 'goals' && <GoalsTab data={data} upd={upd} />}
            {tab === 'money' && <MoneyTab data={data} upd={upd} />}
            {tab === 'wishlist' && <WishlistTab data={data} upd={upd} />}
            {tab === 'resist' && <ResistTab data={data} upd={upd} />}
            {tab === 'diary' && <DiaryTab data={data} upd={upd} />}
          </div>
        </div>
      );
    }

    function PinPad({ value, onChange, maxLen }) {
      return (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 64px)', gap: 10, justifyContent: 'center' }}>
          {[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map((n, i) => (
            <button key={i} onClick={() => {
              if (n === '⌫') { onChange(value.slice(0, -1)); return; }
              if (n === '') return;
              if (value.length < maxLen) onChange(value + n);
            }} style={{ height: 54, background: n === '' ? 'none' : 'rgba(255,255,255,0.1)', border: `1px solid ${n === '' ? 'transparent' : 'rgba(255,255,255,0.2)'}`, borderRadius: 4, color: '#F5EDD8', fontSize: 18, cursor: n === '' ? 'default' : 'pointer' }}>{n}</button>
          ))}
        </div>
      );
    }

    function LockTimer({ lockUntil }) {
      const [rem, setRem] = useState(Math.ceil((lockUntil - Date.now()) / 1000));
      useEffect(() => {
        const t = setInterval(() => { const r = Math.ceil((lockUntil - Date.now()) / 1000); setRem(r); if (r <= 0) clearInterval(t); }, 1000);
        return () => clearInterval(t);
      }, [lockUntil]);
      return <div style={{ color: '#E07070', fontSize: 13 }}>{rem}秒後に再試行できます</div>;
    }

    // ── HOME ──
    function HomeTab({ data, upd, freeBalance, totalIncome, totalExpense }) {
      const td = today();
      const todaySchedule = (data.schedule || []).filter(s => s.date === td).sort((a, b) => a.start.localeCompare(b.start));
      const todayTodos = (data.todos || []).filter(t => !t.done).sort((a, b) => {
        const po = { urgent: 0, high: 1, medium: 2, low: 3 };
        return (po[a.priority] || 2) - (po[b.priority] || 2);
      }).slice(0, 5);
      const upcomingBdays = (data.birthdays || []).filter(b => {
        const now = new Date();
        const yr = now.getFullYear();
        const bday = new Date(`${yr}-${b.date}`);
        if (isNaN(bday)) return false;
        const diff = (bday - now) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= 30;
      });
      const isBlack = freeBalance >= 0;

      return (
        <div>
          <div style={st.label}>今日の予定</div>
          {todaySchedule.length === 0 ? <div style={{ fontSize: 12, color: C.text3, marginBottom: 14 }}>予定なし</div> : todaySchedule.map(s => (
            <div key={s.id} style={{ ...st.card, borderLeft: `3px solid ${C.gold}`, padding: '11px 14px', marginBottom: 8 }}>
              <div style={{ fontSize: 11, color: C.text3 }}>{s.start}{s.end ? ' — ' + s.end : ''}</div>
              <div style={{ fontSize: 13, color: C.text }}>{s.title}</div>
            </div>
          ))}

          <div style={st.label}>今月の収支予測</div>
          <div style={{ ...st.card, borderLeft: `3px solid ${isBlack ? C.green : C.red}`, marginBottom: 14 }}>
            <div style={st.between}>
              <div style={{ fontSize: 12, color: C.text2 }}>今月の収支</div>
              <div style={{ fontSize: 20, color: isBlack ? C.green : C.red }}>{isBlack ? '+' : ''}{fmtYen(freeBalance)}</div>
            </div>
            <div style={{ fontSize: 10, color: C.text3, marginTop: 4 }}>{isBlack ? '黒字予測' : '赤字予測'} — 収入 {fmtYen(totalIncome)} / 支出 {fmtYen(totalExpense)}</div>
          </div>

          <div style={st.label}>今日のToDo</div>
          {todayTodos.length === 0 ? <div style={{ fontSize: 12, color: C.text3, marginBottom: 14 }}>タスクなし</div> : todayTodos.map(t => {
            const pc = PCOLOR[t.priority] || PCOLOR.medium;
            return (
              <div key={t.id} style={{ ...st.card, borderLeft: `3px solid ${pc}`, padding: '11px 14px', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 10 }}>
                <CheckCircle done={t.done} onClick={() => upd(d => { d.todos = d.todos.map(x => x.id === t.id ? { ...x, done: !x.done } : x); })} color={C.gold} />
                <div style={{ flex: 1, fontSize: 13, color: C.text }}>{t.text}</div>
                <span style={{ fontSize: 10, color: pc, border: `1px solid ${pc}40`, borderRadius: 2, padding: '1px 5px' }}>{PLABEL[t.priority]}</span>
              </div>
            );
          })}

          {upcomingBdays.length > 0 && (
            <>
              <div style={st.label}>今月の誕生日</div>
              {upcomingBdays.map(b => (
                <div key={b.id} style={{ ...st.card, padding: '11px 14px', marginBottom: 8, display: 'flex', gap: 10 }}>
                  <div style={{ fontSize: 18 }}>🎂</div>
                  <div><div style={{ fontSize: 13, color: C.text }}>{b.name}</div><div style={{ fontSize: 11, color: C.text3 }}>{b.date}</div></div>
                </div>
              ))}
            </>
          )}
        </div>
      );
    }

    // ── SCHEDULE ──
    function ScheduleTab({ data, upd }) {
      const [viewDate, setViewDate] = useState(today());
      const [showForm, setShowForm] = useState(false);
      const [showBdayForm, setShowBdayForm] = useState(false);
      const [form, setForm] = useState({ title: '', start: '', end: '', note: '' });
      const [bdayForm, setBdayForm] = useState({ name: '', date: '' });

      const items = (data.schedule || []).filter(s => s.date === viewDate).sort((a, b) => a.start.localeCompare(b.start));
      const hours = Array.from({ length: 18 }, (_, i) => i + 6);

      function saveSchedule() {
        if (!form.title || !form.start) return;
        upd(d => { d.schedule = [...d.schedule, { id: Date.now(), date: viewDate, ...form }]; });
        setForm({ title: '', start: '', end: '', note: '' });
        setShowForm(false);
      }

      function saveBday() {
        if (!bdayForm.name || !bdayForm.date) return;
        upd(d => { d.birthdays = [...(d.birthdays || []), { id: Date.now(), ...bdayForm }]; });
        setBdayForm({ name: '', date: '' });
        setShowBdayForm(false);
      }

      return (
        <div>
          <div style={{ ...st.between, marginBottom: 12 }}>
            <div style={st.label}>スケジュール</div>
            <button onClick={() => setShowForm(!showForm)} style={st.btn()}>+ 追加</button>
          </div>
          <input type="date" value={viewDate} onChange={e => setViewDate(e.target.value)} style={{ ...st.inp, marginBottom: 12 }} />

          {showForm && (
            <div style={{ ...st.card, border: `1px solid ${C.goldMid}`, marginBottom: 12 }}>
              <input value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="予定タイトル" style={{ ...st.inp, marginBottom: 8 }} />
              <div style={{ ...st.grid2, marginBottom: 8 }}>
                <div><div style={{ fontSize: 10, color: C.text3, marginBottom: 4 }}>開始</div><input type="time" value={form.start} onChange={e => setForm(f => ({ ...f, start: e.target.value }))} style={st.inp} /></div>
                <div><div style={{ fontSize: 10, color: C.text3, marginBottom: 4 }}>終了</div><input type="time" value={form.end} onChange={e => setForm(f => ({ ...f, end: e.target.value }))} style={st.inp} /></div>
              </div>
              <input value={form.note} onChange={e => setForm(f => ({ ...f, note: e.target.value }))} placeholder="メモ（任意）" style={{ ...st.inp, marginBottom: 10 }} />
              <button onClick={saveSchedule} style={st.btn()}>保存</button>
            </div>
          )}

          <div style={{ paddingLeft: 44, position: 'relative' }}>
            {hours.map(h => {
              const hstr = String(h).padStart(2, '0') + ':00';
              const hItems = items.filter(s => s.start && s.start.startsWith(String(h).padStart(2, '0')));
              return (
                <div key={h} style={{ display: 'flex', minHeight: 40, borderTop: `1px solid ${C.border}`, position: 'relative' }}>
                  <div style={{ position: 'absolute', left: -44, width: 40, fontSize: 10, color: C.text3, paddingTop: 4, textAlign: 'right' }}>{hstr}</div>
                  <div style={{ flex: 1, padding: '2px 0' }}>
                    {hItems.map(s => (
                      <div key={s.id} style={{ background: C.goldLight, border: `1px solid ${C.goldMid}`, borderRadius: 3, padding: '4px 8px', marginBottom: 3, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <div>
                          <div style={{ fontSize: 11, color: C.gold }}>{s.start}{s.end ? ' — ' + s.end : ''}</div>
                          <div style={{ fontSize: 13, color: C.navy }}>{s.title}</div>
                          {s.note && <div style={{ fontSize: 10, color: C.text3 }}>{s.note}</div>}
                        </div>
                        <button onClick={() => upd(d => { d.schedule = d.schedule.filter(x => x.id !== s.id); })} style={{ background: 'none', border: 'none', color: C.text3, cursor: 'pointer', fontSize: 16 }}>×</button>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ marginTop: 24 }}>
            <div style={{ ...st.between, marginBottom: 10 }}>
              <div style={st.label}>誕生日・記念日</div>
              <button onClick={() => setShowBdayForm(!showBdayForm)} style={st.btn()}>+ 追加</button>
            </div>
            {showBdayForm && (
              <div style={{ ...st.card, border: `1px solid ${C.goldMid}`, marginBottom: 10 }}>
                <input value={bdayForm.name} onChange={e => setBdayForm(f => ({ ...f, name: e.target.value }))} placeholder="名前" style={{ ...st.inp, marginBottom: 8 }} />
                <input value={bdayForm.date} onChange={e => setBdayForm(f => ({ ...f, date: e.target.value }))} placeholder="例: 05-15（月-日）" style={{ ...st.inp, marginBottom: 10 }} />
                <button onClick={saveBday} style={st.btn()}>保存</button>
              </div>
            )}
            {(data.birthdays || []).length === 0 && <div style={{ fontSize: 12, color: C.text3 }}>まだ登録なし</div>}
            {(data.birthdays || []).map(b => (
              <div key={b.id} style={{ ...st.card, padding: '11px 14px', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 10 }}>
                <div style={{ fontSize: 18 }}>🎂</div>
                <div style={{ flex: 1 }}><div style={{ fontSize: 13, color: C.text }}>{b.name}</div><div style={{ fontSize: 11, color: C.text3 }}>{b.date}</div></div>
                <button onClick={() => upd(d => { d.birthdays = d.birthdays.filter(x => x.id !== b.id); })} style={{ background: 'none', border: 'none', color: C.text3, cursor: 'pointer', fontSize: 16 }}>×</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── TODO ──
    function TodoTab({ data, upd }) {
      const [filter, setFilter] = useState('active');
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ text: '', priority: 'medium', deadline: '', repeat: '' });

      function saveTodo() {
        if (!form.text.trim()) return;
        upd(d => { d.todos = [...d.todos, { id: Date.now(), ...form, done: false }]; });
        setForm({ text: '', priority: 'medium', deadline: '', repeat: '' });
        setShowForm(false);
      }

      const todos = (data.todos || []).filter(t => filter === 'done' ? t.done : !t.done).sort((a, b) => {
        const po = { urgent: 0, high: 1, medium: 2, low: 3 };
        return (po[a.priority] || 2) - (po[b.priority] || 2);
      });

      return (
        <div>
          <div style={{ ...st.between, marginBottom: 12 }}>
            <div style={st.label}>タスク管理</div>
            <button onClick={() => setShowForm(!showForm)} style={st.btn()}>+ 追加</button>
          </div>
          {showForm && (
            <div style={{ ...st.card, border: `1px solid ${C.goldMid}`, marginBottom: 12 }}>
              <input value={form.text} onChange={e => setForm(f => ({ ...f, text: e.target.value }))} placeholder="タスク内容" style={{ ...st.inp, marginBottom: 8 }} />
              <div style={{ ...st.grid2, marginBottom: 8 }}>
                <select value={form.priority} onChange={e => setForm(f => ({ ...f, priority: e.target.value }))} style={st.inp}>
                  <option value="urgent">緊急</option><option value="high">高</option><option value="medium" >中</option><option value="low">低</option>
                </select>
                <input type="date" value={form.deadline} onChange={e => setForm(f => ({ ...f, deadline: e.target.value }))} style={st.inp} />
              </div>

      const [viewMonth, setViewMonth] = useState(today().slice(0, 7));
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ date: today(), type: 'expense', amount: '', category: '', note: '' });

      function saveRecord() {
        const amount = parseInt(form.amount);
        if (!amount || isNaN(amount)) return;
        upd(d => { d.finance.records = [{ id: Date.now(), ...form, amount }, ...d.finance.records]; });
        setForm({ date: today(), type: 'expense', amount: '', category: '', note: '' });
        setShowForm(false);
      }

      const month = today().slice(0, 7);
      const recs = (data.finance.records || []).filter(r => r.date && r.date.startsWith(viewMonth));
      const addIncome = recs.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
      const addExpense = recs.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
      const fixedExp = viewMonth === month ? data.finance.investment + data.finance.defense + data.finance.gym + data.finance.subs + data.finance.daily : 0;
      const totalIncome = addIncome + (viewMonth === month ? data.finance.income : 0);
      const totalExpense = addExpense + fixedExp;
      const balance = totalIncome - totalExpense;

      const defProg = Math.min(100, Math.round(((data.finance.defenseTotal || 0) / 500000) * 100));
      const invProg = Math.min(100, Math.round(((data.finance.investTotal || 0) / 1495000) * 100));

      const fireMonths = 7 * 12;
      const fireRate = 0.07 / 12;
      let projected = (data.finance.investTotal || 0);

            <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
              <input type="number" id="invest-upd" placeholder="累計投資額を入力" style={{ ...st.inp, flex: 1, fontSize: 12 }} />
              <button onClick={() => { const v = parseFloat(document.getElementById('invest-upd')?.value); if (!isNaN(v)) upd(d => { d.finance.investTotal = v; }); }} style={{ ...st.btn(), fontSize: 11 }}>更新</button>

          <div style={{ ...st.card, marginBottom: 12 }}>

              <input type="number" id="defense-upd" placeholder="累計防衛費を入力" style={{ ...st.inp, flex: 1, fontSize: 12 }} />

          {showForm && (
            <div style={{ ...st.card, border: `1px solid ${C.goldMid}`, marginBottom: 12 }}>
              <div style={{ ...st.grid2, marginBottom: 8 }}>

    // ── RESIST ──
    function ResistTab({ data, upd }) {
      const [showForm, setShowForm] = useState(false);
      const [form, setForm] = useState({ name: '', price: '' });

      function saveResist() {
        const price = parseInt(form.price);
        if (!form.name || !price) return;
        upd(d => {
          if (!d.resist) d.resist = { items: [], log: {} };
          d.resist.items = [...(d.resist.items || []), { id: Date.now(), name: form.name, price }];
        });
        setForm({ name: '', price: '' });
        setShowForm(false);
      }

      const items = data.resist?.items || [];
      const log = data.resist?.log || {};
      const td = today();
      let totalSaved = 0;
      Object.values(log).forEach(dayLog => {
        Object.entries(dayLog).forEach(([id, saved]) => {
          if (saved) totalSaved += (items.find(i => i.id == id) || { price: 0 }).price;
        });
      });
      const future10 = Math.round(totalSaved * Math.pow(1.07, 10));

      return (
        <div>
          <div style={{ ...st.between, marginBottom: 12 }}>
            <div style={st.label}>我慢リスト</div>
            <button onClick={() => setShowForm(!showForm)} style={st.btn()}>+ 追加</button>
          </div>
          <div style={{ ...st.card, background: C.goldLight, border: `1px solid ${C.goldMid}`, marginBottom: 12 }}>
            <div style={{ fontSize: 10, color: C.text3 }}>累計節約額</div>
            <div style={{ fontSize: 24, color: C.gold }}>{fmtYen(totalSaved)}</div>
            <div style={{ fontSize: 11, color: C.text3, marginTop: 4 }}>10年投資したら → <span style={{ color: C.green }}>{fmtYen(future10)}</span></div>
          </div>
          {showForm && (
            <div style={{ ...st.card, border: `1px solid ${C.goldMid}`, marginBottom: 12 }}>
              <input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="浪費アイテム（例: コンビニ夜ご飯）" style={{ ...st.inp, marginBottom: 8 }} />
              <input type="number" value={form.price} onChange={e => setForm(f => ({ ...f, price: e.target.value }))} placeholder="1回あたりの金額（円）" style={{ ...st.inp, marginBottom: 10 }} />
              <button onClick={saveResist} style={st.btn()}>保存</button>
            </div>
          )}
          {items.length === 0 && <div style={{ fontSize: 12, color: C.text3 }}>浪費アイテムを登録してください</div>}
          {items.map(item => {
            const todayDone = log[td] && log[td][item.id];
            return (
              <div key={item.id} style={{ ...st.card, marginBottom: 8 }}>
                <div style={st.between}>
                  <div>
                    <div style={{ fontSize: 13, color: C.navy }}>{item.name}</div>
                    <div style={{ fontSize: 12, color: C.gold }}>{fmtYen(item.price)} / 回</div>
                  </div>
                  <button onClick={() => upd(d => { d.resist.items = d.resist.items.filter(i => i.id !== item.id); })} style={{ background: 'none', border: 'none', color: C.text3, cursor: 'pointer', fontSize: 16 }}>×</button>
                </div>
                <button onClick={() => upd(d => {
                  if (!d.resist.log) d.resist.log = {};
                  if (!d.resist.log[td]) d.resist.log[td] = {};
                  d.resist.log[td][item.id] = !d.resist.log[td][item.id];
                })} style={{ width: '100%', marginTop: 10, padding: 8, background: todayDone ? C.green : 'none', border: `1px solid ${todayDone ? C.green : C.border}`, borderRadius: 3, color: todayDone ? '#fff' : C.text2, fontSize: 12, cursor: 'pointer' }}>
                  {todayDone ? '✓ 今日も我慢した' : '今日我慢した'}
                </button>
              </div>
            );
          })}
        </div>
      );
    }

            </div>
            <input type="date" value={entry.date} onChange={e => setEntry(v => ({ ...v, date: e.target.value }))} style={{ ...st.inp, marginBottom: 8 }} />
            <div style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: C.text3, marginBottom: 6 }}>気分</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {MOODS.map((m, i) => (
                  <button key={i} onClick={() => setEntry(v => ({ ...v, mood: String(i) }))} style={{ fontSize: 20, background: entry.mood == i ? C.goldLight : 'none', border: `1px solid ${entry.mood == i ? C.gold : C.border}`, borderRadius: 4, padding: '5px 8px', cursor: 'pointer' }}>{m}</button>
                ))}
              </div>
            </div>
            <div style={{ marginBottom: 8 }}>
              <div style={{ fontSize: 10, color: C.text3, marginBottom: 4 }}>睡眠時間</div>
              <input value={entry.sleep} onChange={e => setEntry(v => ({ ...v, sleep: e.target.value }))} placeholder="例: 23:30 → 7:00" style={st.inp} />
            </div>
            <textarea value={entry.text} onChange={e => setEntry(v => ({ ...v, text: e.target.value }))} placeholder="今日のこと..." rows={8} style={{ ...st.inp, resize: 'vertical', marginBottom: 10 }} />
            <button onClick={saveEntry} style={st.btn()}>保存</button>
          </div>
        );
      }

      if (viewing) {
        const e = (data.diary || []).find(x => x.id === viewing);
        return (
          <div>
            <div style={{ ...st.between, marginBottom: 14 }}>
              <div style={st.label}>{e?.date}</div>
              <button onClick={() => setViewing(null)} style={{ background: 'none', border: 'none', color: C.text3, cursor: 'pointer', fontSize: 12 }}>← 戻る</button>
            </div>
            {e && (
              <div style={st.card}>
                <div style={{ fontSize: 22, marginBottom: 8 }}>{MOODS[parseInt(e.mood)] || '😐'}</div>
                {e.sleep && <div style={{ fontSize: 11, color: C.text3, marginBottom: 8 }}>睡眠: {e.sleep}</div>}
                <div style={{ fontSize: 13, lineHeight: 1.8, color: C.text, whiteSpace: 'pre-wrap' }}>{e.text}</div>
              </div>
            )}
          </div>
        );
      }

      return (
        <div>
          <div style={{ ...st.between, marginBottom: 12 }}>
            <div style={st.label}>日記</div>
            <button onClick={() => { setEntry({ date: today(), mood: '3', text: '', sleep: '' }); setMode('write'); }} style={st.btn()}>+ 書く</button>
          </div>
          {(data.diary || []).length === 0 && <div style={{ fontSize: 12, color: C.text3 }}>まだ日記がありません</div>}
          {(data.diary || []).map(e => (
            <div key={e.id} onClick={() => setViewing(e.id)} style={{ ...st.card, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 12 }}>
              <div style={{ fontSize: 20 }}>{MOODS[parseInt(e.mood)] || '😐'}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: C.text3 }}>{e.date}{e.sleep ? ' | ' + e.sleep : ''}</div>
                <div style={{ fontSize: 13, color: C.text, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{e.text}</div>
              </div>
              <div style={{ color: C.text3 }}>›</div>
            </div>
          ))}
        </div>
      );
    }

    // ── SHARED COMPONENTS ──
    function CheckCircle({ done, onClick, color, size = 18 }) {
      return (
        <div onClick={onClick} style={{ width: size, height: size, borderRadius: '50%', border: `1.5px solid ${done ? color : C.border}`, background: done ? color : 'none', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', flexShrink: 0, fontSize: size * 0.6, color: '#fff' }}>
          {done ? '✓' : ''}
        </div>
      );
    }

    function ProgressBar({ value, color }) {
      return (
        <div style={{ height: 6, background: C.creamDark, borderRadius: 3, overflow: 'hidden', margin: '6px 0' }}>
          <div style={{ width: value + '%', height: '100%', background: color, borderRadius: 3, transition: 'width 0.3s' }} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
